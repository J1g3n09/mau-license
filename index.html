><span class=\"sep\">›<\/span>\n      <span class=\"cur\">MAUライセンス 利用状況<\/span>\n    <\/nav>\n    <span class=\"spacer\"><\/span>\n    <div class=\"prof\" title=\"親組織管理者\">YS<\/div>\n  <\/header>\n\n<div class=\"wrap\">\n  <div class=\"page-head\">\n    <div>\n      <h1>MAUライセンス 利用状況<\/h1>\n      <p class=\"page-sub\">プランごとに、ご契約MAUに対する月次の利用実績とライセンスの割当状況をご確認いただけます。<\/p>\n    <\/div>\n  <\/div>\n\n  <div id=\"view\"><\/div>\n\n  <div class=\"footnotes\">\n    ＊<b>契約期間中はMAU超過による利用制限・自動プラン変更・追加請求のいずれも行いません。<\/b>月次実績は次回更新時のプラン見直しの参考としてご利用いただけます。\n  <\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"gtip\"><\/div>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<aside class=\"msheet\" id=\"msheet\" aria-label=\"メンバーのプラン移行\">\n  <div class=\"ms-h\"><h3>メンバーのプラン移行<\/h3><button class=\"x\" id=\"msClose\" aria-label=\"閉じる\">✕<\/button><\/div>\n  <div class=\"ms-b\" id=\"msBody\"><\/div>\n  <div class=\"ms-f\" id=\"msFoot\"><\/div>\n<\/aside>\n<div class=\"dlg\" id=\"dlg\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"dlg-h\"><h3 id=\"dTitle\">—<\/h3><button class=\"x\" id=\"dClose\">✕<\/button><\/div>\n  <div class=\"dlg-b\" id=\"dBody\"><\/div>\n  <div class=\"dlg-f\">\n    <button class=\"btn\" id=\"dCancel\">キャンセル<\/button>\n    <button class=\"btn btn-primary\" id=\"dSave\">保存<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"demobar\">\n  <span class=\"lbl\">Prototype state<\/span>\n  <div class=\"seg\" id=\"switcher\">\n    <button data-s=\"both\" class=\"on\">Basic + Advanced<\/button>\n    <button data-s=\"basic\">Basicのみ<\/button>\n    <button data-s=\"advanced\">Advancedのみ<\/button>\n  <\/div>\n  <span class=\"spacer\"><\/span>\n  <span class=\"cap\">親組織管理者向け（顧客画面）　／　契約の作成・変更はシステム管理者のみ<\/span>\n<\/div>\n\n<script>\n/* ============================================================================\n   MAUライセンス 利用状況 — 親組織管理者（顧客画面）\n\n   MODEL\n   -----\n   * The organisation holds up to two independent contracts, at most one active\n     per plan (Basic / Advanced). Each has its own cap, term and MAU, and each\n     gets its OWN PAGE — the plan switcher at the top of the page.\n   * Each contract points at ONE named ACL, maintained on the existing ACL管理\n     page. The ACL lists which child organisations may use the contract.\n     aclId === null means 「子組織に共有しない」.\n   * The unit of licence assignment is the DEPARTMENT, not the individual.\n     A department belongs to one child organisation, so the chain is\n        department → child org → ACL → contract\n     A department can only sit on a plan whose ACL covers its child org.\n   * A member's plan is INHERITED from their department. There is no per-member\n     assignment field, so the member list is read-only by construction.\n   * MAU is derived, never authored: contract MAU = sum of the MAU of the\n     departments on that plan whose child org is inside the ACL. Moving a\n     department visibly moves MAU, and the contract total can never disagree\n     with the per-child or per-department tables.\n\n   PERMISSIONS (this screen = 親組織管理者)\n   * CAN: choose which ACL each contract uses; move departments between plans.\n   * CANNOT: create or edit the contracts themselves (System Admin only).\n   ========================================================================== */\nconst PLANS=['basic','advanced'];\nconst PL={basic:'Basic', advanced:'Advanced'};\nconst MONTH_LABELS=['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];\nconst MONTH_FULL=['2026年4月','2026年5月','2026年6月','2026年7月','2026年8月','2026年9月','2026年10月',\n                  '2026年11月','2026年12月','2027年1月','2027年2月','2027年3月'];\n/* Head count of the whole tenant. The eligible pool routinely dwarfs 契約MAU —\n   20,000 people may be entitled to study while the contract covers 2,000 monthly\n   actives. The two numbers are not comparable and the UI must not imply they are. */\nconst SEATS=21000;\n\nconst ORGS=[\n  {id:'toyo',  name:'日本テクノ研修センター', code:'ORG-100301'},\n  {id:'tokyo', name:'東京本社',              code:'ORG-100302'},\n  {id:'osaka', name:'大阪支社',              code:'ORG-100303'},\n  {id:'nagoya',name:'名古屋支社',            code:'ORG-100304'},\n  {id:'kyushu',name:'九州テック株式会社',     code:'ORG-100305'},\n  {id:'global',name:'グローバル事業部',       code:'ORG-100306'},\n];\n\n/* Named ACLs — defined and maintained on the existing ACL管理 page. This screen\n   only selects one per contract and shows what it resolves to. */\nconst ACLS=[\n  {id:'all',      name:'All（全子組織）',      orgs:['toyo','tokyo','osaka','nagoya','kyushu','global']},\n  {id:'future',   name:'ALL current and future children',\n                  orgs:['toyo','tokyo','osaka','nagoya','kyushu','global'], future:true},\n  {id:'domestic', name:'国内拠点のみ',          orgs:['toyo','tokyo','osaka','nagoya','kyushu']},\n  {id:'tech',     name:'技術・グローバル部門',   orgs:['toyo','tokyo','global']},\n  {id:'hq',       name:'本社・研修センターのみ', orgs:['toyo','tokyo']},\n];\nconst aclById=id=>ACLS.find(a=>a.id===id)||null;\n\n/* Departments group members; they do NOT own the assignment.\n   Assignment is per member — `by[plan].n` is how many of the department's members\n   currently hold that plan, and `by[plan].mau` how many of those studied this\n   month. A department can therefore be MIXED (情報システム部 below is), which is\n   the whole point: an admin can move one person without moving the department.\n   n and mau are aggregates because a prototype cannot carry 20,000 rows; the\n   named sample in MEMBERS gives the row-level view. */\nconst B=(bn,bm,an,am)=>({basic:{n:bn,mau:bm}, advanced:{n:an,mau:am}});\nconst BASE_DEPTS=[\n  {id:'d1', name:'研修企画部',     org:'toyo',   head:3400, by:B(3400,480,   0,  0)},\n  {id:'d2', name:'技術研修部',     org:'toyo',   head:2600, by:B(   0,  0,2600,460)},\n  {id:'d3', name:'営業部',         org:'tokyo',  head:4200, by:B(4200,300,   0,  0)},\n  {id:'d4', name:'人事部',         org:'tokyo',  head: 900, by:B( 900, 90,   0,  0)},\n  /* mixed: 200 of its 1,600 members were moved down to Basic individually */\n  {id:'d5', name:'情報システム部', org:'tokyo',  head:1600, by:B( 200, 40,1400,360)},\n  {id:'d6', name:'営業部',         org:'osaka',  head:1800, by:B(1800,170,   0,  0)},\n  {id:'d7', name:'管理部',         org:'osaka',  head: 700, by:B( 700,110,   0,  0)},\n  {id:'d8', name:'製造技術部',     org:'nagoya', head:2100, by:B(2100,195,   0,  0)},\n  {id:'d9', name:'営業部',         org:'kyushu', head:1300, by:B(1300,115,   0,  0)},\n  {id:'d10',name:'海外開発部',     org:'global', head:1400, by:B(   0,  0,1400,260)},\n];\n\n/* Named sample for the row-level view. `plan` is stored per member. */\nconst M=(id,name,mail,dept,plan)=>({id,name,mail,dept,plan,act:true});\nconst BASE_MEMBERS=[\n  /* 日本テクノ研修センター(toyo) と 東京本社(tokyo) は両プランのACLに含まれる */\n  M('m1','加藤 隆',    'takashi.kato@nihon-techno.co.jp',  'd1','basic'),\n  M('m2','大和田 恵',  'megumi.owada@nihon-techno.co.jp',  'd1','basic'),\n  M('m3','篠原 亮太',  'ryota.shinohara@nihon-techno.co.jp','d1','basic'),\n  M('m4','田中 健一',  'kenichi.tanaka@nihon-techno.co.jp','d2','advanced'),\n  M('m5','佐藤 美咲',  'misaki.sato@nihon-techno.co.jp',   'd2','advanced'),\n  M('m6','鈴木 大輔',  'daisuke.suzuki@nihon-techno.co.jp','d3','basic'),\n  M('m7','伊藤 由紀',  'yuki.ito@nihon-techno.co.jp',      'd3','basic'),\n  M('m8','岡本 早苗',  'sanae.okamoto@nihon-techno.co.jp', 'd3','basic'),\n  M('m9','松本 沙織',  'saori.matsumoto@nihon-techno.co.jp','d4','basic'),\n  M('m10','高橋 亮',   'ryo.takahashi@nihon-techno.co.jp', 'd5','advanced'),\n  M('m11','森 千尋',   'chihiro.mori@nihon-techno.co.jp',  'd5','basic'),\n  M('m12','藤田 直人', 'naoto.fujita@nihon-techno.co.jp',  'd5','advanced'),\n  /* 片方のプランしか使えない子テナント — 移行できないため一覧に出ない */\n  M('m13','渡辺 彩',   'aya.watanabe@nihon-techno.co.jp',  'd6','basic'),\n  M('m14','山本 翔太', 'shota.yamamoto@nihon-techno.co.jp','d8','basic'),\n  M('m15','小林 恵',   'megumi.kobayashi@nihon-techno.co.jp','d10','advanced'),\n];\n\n/* Only 利用中 licences reach this screen. System Admin may also hold 下書き\n   (proposals) and アーカイブ済 (past terms) licences for this organisation; the\n   customer never sees either, so they are not modelled here. `status` is carried\n   explicitly so the relationship is legible rather than implied. */\nconst BASE_LIC={\n  basic:{name:'全社ITリテラシー（2026年度）', status:'inuse', cap:2000, aclId:'domestic',\n    term:'2026/04/01 – 2027/03/31', days:227, created:'2026/03/18', elapsed:5,\n    past:[980,1150,1290,1380]},\n  advanced:{name:'先端技術エンジニア育成（2026年度）', status:'inuse', cap:1000, aclId:'tech',\n    term:'2026/04/01 – 2027/03/31', days:227, created:'2026/03/18', elapsed:5,\n    past:[640,780,900,1010]},\n};\n\n/* ---------- mutable state ---------- */\nconst clone=o=>JSON.parse(JSON.stringify(o));\nlet LIC=clone(BASE_LIC);\nlet DEPTS=clone(BASE_DEPTS);\nlet MEMBERS=clone(BASE_MEMBERS);\nlet plan='basic';\n\nconst n=v=>v.toLocaleString('ja-JP');\nconst pct=(a,b)=>b?Math.round(a/b*1000)/10:0;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\n/* A licence is only usable here when it is 利用中. */\nconst has=p=>!!LIC[p]&&LIC[p].status==='inuse';\nconst orgName=id=>(ORGS.find(o=>o.id===id)||{}).name||id;\nconst deptById=id=>DEPTS.find(d=>d.id===id);\nconst planTag=p=>p?`<span class=\"lictag ${p==='advanced'?'adv':'basic'}\">${PL[p]}<\/span>`\n  :`<span class=\"lictag\" style=\"background:#fdeceb;color:#a01f1f;border:1px solid #f5c6c3\">ACL範囲外<\/span>`;\nconst info=html=>`<span class=\"info\" tabindex=\"0\">?<span class=\"tip\">${html}<\/span><\/span>`;\n\nconst aclOrgs=p=>{ const a=has(p)&&aclById(LIC[p].aclId); return a?a.orgs:[]; };\nconst livePlans=()=>PLANS.filter(has);\n\n/* ---- coverage gaps -------------------------------------------------------\n   A child organisation is COVERED when it appears in the ACL of at least one\n   licence currently in use. Two distinct gaps can occur, and they need\n   different remedies:\n\n   1. UNCOVERED ORG — in no licence's ACL at all. Nobody there can study, and\n      because every plan page is ACL-scoped the organisation is invisible\n      everywhere else. Remedy: apply an ACL that includes it.\n   2. MISMATCHED DEPT — the organisation is covered by some licence, but not by\n      the licence of the tier its department sits on. Remedy: move the\n      department to the tier that does reach it.\n   ------------------------------------------------------------------------- */\nfunction coveredOrgIds(){\n  const s=new Set();\n  livePlans().forEach(p=>aclOrgs(p).forEach(id=>s.add(id)));\n  return s;\n}\nconst uncoveredOrgs   = ()=>{ const c=coveredOrgIds(); return ORGS.filter(o=>!c.has(o.id)); };\n/* Members holding a plan whose ACL no longer reaches their child organisation —\n   the only thing on this tab that is actually broken. Grouped by department+plan\n   because that is the unit an admin acts on. `alt` is the other plan that DOES\n   reach them, if any; it decides which remedy the row offers:\n     alt set   → move those members to `alt` (one click)\n     alt null  → no plan reaches them at all; the ACL has to change instead. */\nfunction strandedGroups(){\n  const out=[];\n  PLANS.filter(has).forEach(p=>DEPTS.forEach(d=>{\n    if(d.by[p].n>0 && !inScope(p,d.org))\n      out.push({d,p,n:d.by[p].n,mau:d.by[p].mau,\n                alt:PLANS.find(q=>q!==p&&has(q)&&inScope(q,d.org))||null});\n  }));\n  return out;\n}\n/* The same problem rolled up to CHILD ORGANISATION level, which is the unit the\n   parent org admin thinks in. One row per affected organisation:\n     `plans` — which plans its members hold that the ACL does not reach\n     `alt`   — the plan that DOES reach it, if any; decides the remedy. */\nfunction strandedByOrg(){\n  const byOrg={};\n  strandedGroups().forEach(g=>{\n    const o=byOrg[g.d.org]=byOrg[g.d.org]||{org:g.d.org,n:0,plans:new Set(),groups:[]};\n    o.n+=g.n; o.plans.add(g.p); o.groups.push(g);\n  });\n  return Object.values(byOrg).map(o=>({...o,\n    plans:[...o.plans],\n    alt:PLANS.find(q=>has(q)&&inScope(q,o.org))||null}));\n}\n\n/* Child orgs in no ACL that have nobody in them. Nothing is broken — worth\n   mentioning as a setup gap, not worth a table row. */\n/* \"empty\" means nobody is in it — a department that exists but holds no members\n   is still empty, so test the head count rather than the department count. */\nconst emptyUncovered = ()=>uncoveredOrgs().filter(o=>\n  orgDepts(o.id).reduce((a,d)=>a+d.head,0)===0);\nconst gapCount = ()=>strandedByOrg().length;\nconst orgDepts        = id=>DEPTS.filter(d=>d.org===id);\nconst aclsCovering    = id=>ACLS.filter(a=>a.orgs.includes(id));\nconst inScope=(p,orgId)=>aclOrgs(p).includes(orgId);\nconst canHold=(d,p)=>has(p)&&inScope(p,d.org);\n/* Why a department cannot sit on a plan — shown on the disabled option so the\n   restriction is explained where it is encountered. */\nfunction blockReason(d,p){\n  if(!has(p)) return `${PL[p]}のご契約がありません`;\n  if(!inScope(p,d.org)) return `${orgName(d.org)} は${PL[p]}のアクセス範囲（ACL）に含まれていません`;\n  return '';\n}\n/* Departments with at least one member on this plan AND reachable through the\n   plan's ACL. A department whose child org is outside the ACL contributes nothing\n   to this contract's totals. */\nconst deptsOn=p=>DEPTS.filter(d=>d.by[p].n>0&&canHold(d,p));\n/* Same, ignoring the ACL — used to size the impact of an ACL change. */\nconst deptsClaiming=p=>DEPTS.filter(d=>d.by[p].n>0);\nconst assigned=p=>deptsOn(p).reduce((a,d)=>a+d.by[p].n,0);\nconst curMau =p=>deptsOn(p).reduce((a,d)=>a+d.by[p].mau,0);\nconst memberPlan=m=>m.plan;\nconst trend  =p=>LIC[p].past.concat([curMau(p)]);\n\nfunction stats(p){\n  const T=trend(p), CAP=LIC[p].cap;\n  const ex=T.filter(v=>v>CAP);\n  const peak=Math.max(...T), avg=Math.round(T.reduce((a,b)=>a+b,0)/T.length);\n  return {T,CAP,nEx:ex.length,mau:T[T.length-1],peak,peakM:MONTH_LABELS[T.indexOf(peak)],\n          avg,maxOver:ex.length?Math.max(...ex)-CAP:0,util:pct(avg,CAP),idle:pct(avg,CAP)<50};\n}\n\n/* ---------- plan page switcher: Basic and Advanced are separate pages ---------- */\nfunction planNav(){\n  const g=gapCount();\n  return `<div class=\"plannav\">${PLANS.map(p=>{\n    if(!has(p)) return `<button class=\"pn\" disabled>${PL[p]}<span>ご契約なし<\/span><\/button>`;\n    const s=stats(p);\n    return `<button class=\"pn ${p===plan?'on':''}\" data-plan=\"${p}\">${PL[p]}\n      <span>当月 ${n(s.mau)} / ${n(s.CAP)} MAU${s.nEx?`　・　超過 ${s.nEx}ヶ月`:''}<\/span><\/button>`;\n  }).join('')}\n  <button class=\"pn ${plan==='unassigned'?'on':''}\" data-plan=\"unassigned\">\n    未割当${g?`（${g}）`:''}\n    <span>${g?'ライセンスを利用できない子組織があります':'すべての子組織がライセンス対象です'}<\/span><\/button>\n  <\/div>`;\n}\n\n/* ---------- the open plan's page ---------- */\nfunction planPage(){\n  const p=plan, L=LIC[p], s=stats(p), CAP=L.cap, H=190;\n  const over=s.mau>CAP, acl=aclById(L.aclId);\n\n\n  const CMAX=Math.max(...s.T,CAP)*1.18;\n  const ys=[0,.25,.5,.75,1].map(f=>`<span style=\"top:${H-f*H}px\">${n(Math.round(CMAX*f))}<\/span>`).join('');\n  const bars=MONTH_LABELS.slice(0,L.elapsed).map((lab,i)=>{\n    const v=s.T[i], ov=v>CAP, now=i===L.elapsed-1;\n    return `<div class=\"bcol ${now?'now':''}\">\n      <span class=\"bval\" style=\"color:${ov?'#a3600a':'var(--text-2)'}\">${n(v)}<\/span>\n      <div class=\"bar\" style=\"height:${Math.max(v/CMAX*H,3)}px;background:${ov?'#e0a03a':(now?'#2563eb':'#8fb2f4')}\"><\/div>\n      <span class=\"bx\">${lab}<\/span><\/div>`;\n  }).join('');\n  const rows=MONTH_FULL.slice(0,L.elapsed).map((lab,i)=>{\n    const v=s.T[i], ov=v>CAP;\n    return `<tr class=\"${ov?'exceeded':''}\">\n      <td>${lab}${i===L.elapsed-1?' <span style=\"font-size:10.5px;color:var(--brand);font-weight:700\">当月<\/span>':''}<\/td>\n      <td class=\"r num\"><b>${n(v)}<\/b><\/td><td class=\"r num\">${n(CAP)}<\/td>\n      <td class=\"r num ${ov?'delta-pos':''}\">${pct(v,CAP)}%<\/td><\/tr>`;\n  }).join('');\n\n  const kids=aclOrgs(p).map(id=>{\n    const ds=deptsOn(p).filter(d=>d.org===id);\n    return {...ORGS.find(o=>o.id===id),\n            mau:ds.reduce((a,d)=>a+d.by[p].mau,0), head:ds.reduce((a,d)=>a+d.by[p].n,0), nd:ds.length};\n  }).sort((a,b)=>b.mau-a.mau);\n  const kidTot=kids.reduce((a,o)=>a+o.mau,0);\n  const kidRows=kids.map(o=>{\n    const share=pct(o.mau,kidTot||1);\n    return `<tr>\n      <td><div class=\"org-cell\"><div class=\"org-ico\">${o.name.slice(0,2)}<\/div>\n        <div><div class=\"org-name\">${esc(o.name)}<\/div>\n          <div class=\"org-sub\">${o.nd?`${o.nd}部門　／　${n(o.head)}名`:'このプランの部門なし'}<\/div><\/div><\/div><\/td>\n      <td class=\"r num\"><b>${n(o.mau)}<\/b><\/td>\n      <td><div class=\"sharecell\">\n        <span class=\"mini\"><span style=\"width:${share}%;background:var(--brand)\"><\/span><\/span>\n        <span class=\"pv\">${share}%<\/span><\/div><\/td><\/tr>`;\n  }).join('');\n\n  const mine=deptsOn(p);   /* already ACL-scoped */\n  const scopeOrgs=new Set(mine.map(d=>d.org)).size;\n\n  return `${s.nEx?`<div class=\"banner bn-warn\"><div class=\"ico\" style=\"background:#d97706\">!<\/div><div>\n      <h3>契約期間中にご契約MAUを超過した月が ${s.nEx} ヶ月あります<\/h3>\n      <p>最大超過幅 <b>${n(s.maxOver)} MAU<\/b>（${s.peakM}・${n(s.peak)} MAU）。\n         この傾向が続く場合、次回更新時にご契約MAUの見直しをご相談ください。<\/p><\/div><\/div>`:''}\n\n  <div class=\"lichead\">\n    <div style=\"flex:1;min-width:0\">\n      <div class=\"nm\">${esc(L.name)}<\/div>\n      <div class=\"meta\">ACL <b>${acl?esc(acl.name):'子組織に共有しない'}<\/b>${acl?`（${acl.orgs.length}組織）`:''}\n        　／　有効な期限 ${L.term}（更新まで <b class=\"num\">${L.days}<\/b> 日）　／　作成 ${L.created}<\/div>\n    <\/div>\n    ${planTag(p)}\n    <button class=\"btn btn-sm\" id=\"btn-depts\">メンバーのプラン移行<\/button>\n    <button class=\"btn btn-sm\" id=\"btn-acl\">ACLを変更<\/button>\n  <\/div>\n\n  <div class=\"kpis section\">\n    <div class=\"kpi\">\n      <div class=\"k\">ご契約MAU${info('契約時にご購入いただいたMAU数です。<br>超えても受講は継続でき、<b>追加請求はありません<\/b>。')}<\/div>\n      <div class=\"v num\">${n(CAP)}<small>MAU<\/small><\/div>\n      <div class=\"s\">${PL[p]}契約のベースライン<\/div><\/div>\n    <div class=\"kpi accent\">\n      <div class=\"k\">当月MAU（2026年8月）${info('当月に対象コースを1つ以上受講した<b>実人数<\/b>です。<br>何回受講しても 1 MAU、月次でリセットされます。')}<\/div>\n      <div class=\"v num\" style=\"color:${over?'var(--warn)':'var(--brand)'}\">${n(s.mau)}<\/div>\n      <div class=\"s\">ご契約MAU比 ${pct(s.mau,CAP)}%<\/div><\/div>\n    <div class=\"kpi\">\n      <div class=\"k\">対象者数${info('このプランの組織に所属する、<b>受講できる対象者<\/b>の数です。')}<\/div>\n      <div class=\"v num\">${n(assigned(p))}<small>名<\/small><\/div>\n      <div class=\"s\">${scopeOrgs}組織<\/div><\/div>\n    <div class=\"kpi\">\n      <div class=\"k\">平均活用率${info('経過月の平均MAU ÷ ご契約MAU。')}<\/div>\n      <div class=\"v num\" style=\"color:${s.idle?'#6b4a9e':s.util>100?'var(--warn)':'var(--ok)'}\">${s.util}%<\/div>\n      <div class=\"s\">平均 ${n(s.avg)} MAU<\/div><\/div>\n  <\/div>\n\n  <div class=\"section card\">\n    <div class=\"card-h\"><h2>月次MAU実績<\/h2><span class=\"hint\">社内報告用にCSVでダウンロードいただけます<\/span><\/div>\n    <div class=\"card-b\">\n      <div class=\"chart\"><div class=\"chart-y\">${ys}<\/div>\n        <div class=\"chart-plot\">\n          <div class=\"rline avg\" style=\"top:${H-s.avg/CMAX*H}px\"><span>期間平均 <b>${n(s.avg)}<\/b><\/span><\/div>\n          <div class=\"rline cap\" style=\"top:${H-CAP/CMAX*H}px\"><span>ご契約MAU ${n(CAP)}<\/span><\/div>\n          <div class=\"bars\">${bars}<\/div><\/div><\/div>\n      <div class=\"legend\"><span><i style=\"background:#2563eb\"><\/i>ご契約MAU内<\/span>\n        <span><i style=\"background:#e0a03a\"><\/i>ご契約MAU超過<\/span>\n        <span><i style=\"background:none;border-top:2px dotted #7c8ba1;height:0;border-radius:0\"><\/i>期間平均<\/span><\/div>\n    <\/div>\n    <div class=\"card-h\" style=\"border-top:1px solid var(--line)\">\n      <h2 style=\"font-size:13px\">月次明細<\/h2><button class=\"btn btn-sm\">CSVダウンロード<\/button><\/div>\n    <table><thead><tr>\n      <th style=\"width:34%\">対象月<\/th><th class=\"r\" style=\"width:22%\">当月MAU<\/th>\n      <th class=\"r\" style=\"width:22%\">ご契約MAU<\/th><th class=\"r\" style=\"width:22%\">契約比<\/th>\n    <\/tr><\/thead><tbody>${rows}<\/tbody><\/table>\n  <\/div>\n\n  ${kids.length?`<div class=\"section card\">\n    <div class=\"card-h\"><h2>子組織別 利用状況<\/h2>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <span class=\"hint\">${kidTot?`受講が最も多いのは ${esc(kids[0].name)}（全体の ${pct(kids[0].mau,kidTot)}%）`:'当月の受講はありません'}<\/span>\n        <button class=\"btn btn-sm\">CSVダウンロード<\/button><\/div><\/div>\n    <table><thead><tr>\n      <th style=\"width:38%\">子組織<\/th><th class=\"r\" style=\"width:18%\">当月MAU<\/th>\n      <th style=\"width:44%\">構成比（当月MAU）<\/th>\n    <\/tr><\/thead><tbody>${kidRows}<\/tbody>\n    <tfoot><tr><td>合計（<span class=\"num\">${kids.length}<\/span>組織）<\/td>\n      <td class=\"r num\">${n(kidTot)}<\/td>\n      <td style=\"font-weight:400;color:var(--text-3);font-size:11.5px\">当月MAU（${MONTH_FULL[L.elapsed-1]}）の多い順<\/td>\n    <\/tr><\/tfoot><\/table>\n  <\/div>`:''}`;\n}\n\n/* ---------- 未割当: child orgs and departments no licence reaches ---------- */\nfunction viewUnassigned(){\n  const mm=strandedByOrg(), live=livePlans(), emptyOrgs=emptyUncovered();\n  const mmHead=mm.reduce((a,g)=>a+g.n,0);\n\n  if(!live.length) return `<div class=\"section card\"><div class=\"card-b\" style=\"text-align:center;padding:52px;color:var(--text-3)\">\n    ご利用中のライセンスがないため、判定できません。<\/div><\/div>`;\n\n  const note=emptyOrgs.length?`<div class=\"note section\"><span>ℹ️<\/span><span>\n    <b>いずれのACLにも含まれていない子組織：${emptyOrgs.length}組織<\/b>\n    （${emptyOrgs.map(o=>esc(o.name)).join('、')}）。\n    メンバーが登録されていないため現時点で影響はありませんが、利用を開始する場合はACLへの追加が必要です。<\/span><\/div>`:'';\n\n  /* Nothing broken. The note may still appear for an org nobody is in yet. */\n  if(!mm.length) return `<div class=\"empty\">\n    <div class=\"ei\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 12.5l5 5 11-11\"/><\/svg><\/div>\n    <h3>未割当の子組織はありません<\/h3>\n    <p>すべての子組織が、ご利用中のライセンス（${live.map(p=>PL[p]).join('・')}）のいずれかのアクセス範囲に含まれています。<\/p>\n  <\/div>${note}`;\n\n  return `<div class=\"section card\">\n    <div class=\"card-h\"><h2>利用できない子組織<\/h2>\n      <span class=\"hint\">${mm.length}組織　／　${n(mmHead)}名　／　対象コースを受講できず、MAUにも計上されません<\/span><\/div>\n    <table><thead><tr>\n      <th style=\"width:30%\">子組織<\/th><th class=\"r\" style=\"width:14%\">影響人数<\/th>\n      <th style=\"width:30%\">原因<\/th><th class=\"r\" style=\"width:26%\">対応<\/th>\n    <\/tr><\/thead><tbody>${mm.map(g=>`<tr class=\"exceeded\">\n        <td><div class=\"org-cell\"><div class=\"org-ico\">${orgName(g.org).slice(0,2)}<\/div>\n          <div><div class=\"org-name\">${esc(orgName(g.org))}<\/div>\n            <div class=\"org-sub\">${(ORGS.find(o=>o.id===g.org)||{}).code||''}<\/div><\/div><\/div><\/td>\n        <td class=\"r num\">${n(g.n)}<\/td>\n        <td style=\"font-size:12px;line-height:1.6\">${g.alt\n          ? `<b>${g.plans.map(p=>PL[p]).join('・')}のACL範囲外<\/b>のため利用できません。<br>${PL[g.alt]}のACLには含まれています。`\n          : `<b>どのACLにも含まれていません<\/b>。`}<\/td>\n        <td class=\"r\">${g.alt\n          ? `<button class=\"btn btn-sm btn-primary\" data-fixorg=\"${g.org}:${g.alt}\">${PL[g.alt]}へ移行<\/button>`\n          : live.map(p=>`<button class=\"btn btn-sm\" data-fixacl=\"${p}\" style=\"margin-left:6px\">${PL[p]}のACLを変更<\/button>`).join('')}<\/td>\n      <\/tr>`).join('')}\n    <\/tbody><\/table>\n  <\/div>${note}`;\n}\n\n\nfunction render(){\n  if(!PLANS.some(has)){\n    $('view').innerHTML=`<div class=\"section card\"><div class=\"card-b\" style=\"text-align:center;padding:56px;color:var(--text-3)\">\n      Eラーニングのご契約がありません。<\/div><\/div>`;\n    return;\n  }\n  if(plan!=='unassigned' && !has(plan)) plan=PLANS.find(has);\n  $('view').innerHTML=planNav()+(plan==='unassigned'?viewUnassigned():planPage());\n  $('view').querySelectorAll('button[data-plan]').forEach(b=>\n    b.addEventListener('click',()=>{ plan=b.dataset.plan; render(); }));\n  const ab=$('btn-acl'); if(ab) ab.addEventListener('click',()=>openAcl(plan));\n  const db=$('btn-depts'); if(db) db.addEventListener('click',openMigrate);\n  $('view').querySelectorAll('button[data-fixacl]').forEach(b=>\n    b.addEventListener('click',()=>openAcl(b.dataset.fixacl)));\n  $('view').querySelectorAll('button[data-fixorg]').forEach(b=>b.addEventListener('click',()=>{\n    const [orgId,to]=b.dataset.fixorg.split(':');\n    /* move every out-of-scope member in that organisation onto the plan that\n       actually reaches it, department by department */\n    strandedGroups().filter(g=>g.d.org===orgId).forEach(g=>{\n      moveMembers(g.d,g.p,to,g.n);\n      MEMBERS.forEach(m=>{ if(m.dept===g.d.id&&m.plan===g.p) m.plan=to; });\n    });\n    render();\n  }));\n  const label = plan==='unassigned' ? '未割当' : PL[plan];\n  document.title=`Skill Hub — MAUライセンス 利用状況（${label}）`;\n  const cur=document.querySelector('.crumb .cur');\n  if(cur) cur.textContent=`MAUライセンス 利用状況（${label}）`;\n  bindTips();\n}\n\n/* ---------- Edit ACL dialog — mirrors the existing exam ACL dialog ---------- */\nlet aclPick=null, aclShare=true;\nfunction openAcl(target){\n  const tp = target || plan;\n  const L=LIC[tp];\n  aclShare=!!L.aclId; aclPick=L.aclId||ACLS[0].id;\n  $('dTitle').textContent=`${PL[tp]} のACLを変更`;\n  $('dBody').innerHTML=`\n    <div class=\"acllab\">アクセス制御リスト（ACL）<\/div>\n    <div class=\"rdonly\" style=\"margin:0 0 13px\">この契約を利用できる子組織をACLで管理します。<\/div>\n    <label class=\"pcard ${aclShare?'sel-on':''}\" data-acl-mode=\"select\">\n      <input type=\"radio\" name=\"aclmode\" value=\"select\"${aclShare?' checked':''} />\n      <div class=\"pb\"><div class=\"pn\">ACLを選択<\/div>\n        <select class=\"selbox\" id=\"aclSel\"${aclShare?'':' disabled'}>\n          ${ACLS.map(a=>`<option value=\"${a.id}\"${a.id===aclPick?' selected':''}>${esc(a.name)}（${a.orgs.length}組織）<\/option>`).join('')}\n        <\/select>\n        <div class=\"pd\" id=\"aclPrev\"><\/div>\n      <\/div><\/label>\n    <label class=\"pcard ${aclShare?'':'sel-on'}\" data-acl-mode=\"none\">\n      <input type=\"radio\" name=\"aclmode\" value=\"none\"${aclShare?'':' checked'} />\n      <div class=\"pb\"><div class=\"pn\">子組織に共有しない<\/div>\n        <div class=\"pd\">本組織のメンバーのみがこの契約を利用します。子組織の部門はすべてACLの範囲外になります。<\/div>\n      <\/div><\/label>\n    <div id=\"aclImpact\"><\/div>`;\n  /* Losing this plan is only a problem if the other plan does not cover the\n     organisation either. So the warning counts child orgs that would end up\n     outside EVERY in-use plan — not the ones merely leaving this one. */\n  const coveredUnder=(id,share)=>{\n    const set=new Set();\n    PLANS.filter(has).forEach(p=>{\n      const a = p===tp ? (share?aclById(id):null) : aclById(LIC[p].aclId);\n      if(a) a.orgs.forEach(o=>set.add(o));\n    });\n    return set;\n  };\n  const prev=()=>{\n    const a=aclById(aclPick);\n    $('aclPrev').innerHTML=(aclShare&&a)\n      ? `対象：${a.orgs.map(orgName).join('、')}${a.future?'<br>新規追加される子組織も自動的に含まれます':''}`\n      : '';\n    const w=$('aclImpact'); if(!w) return;\n    const before=coveredUnder(L.aclId,!!L.aclId), after=coveredUnder(aclPick,aclShare);\n    /* newly outside every plan, and with people in them */\n    const lost=ORGS.filter(o=>before.has(o.id) && !after.has(o.id)\n      && orgDepts(o.id).reduce((x,d)=>x+d.head,0)>0);\n    const lostHead=lost.reduce((x,o)=>x+orgDepts(o.id).reduce((y,d)=>y+d.head,0),0);\n    w.innerHTML = lost.length\n      ? `<div class=\"banner bn-warn\" style=\"margin:14px 0 0\"><div class=\"ico\" style=\"background:#d97706\">!<\/div><div>\n          <h3>この変更で ${lost.length}組織・${n(lostHead)}名 がどのプランも利用できなくなります<\/h3>\n          <p>${lost.map(o=>esc(o.name)).join('、')}。他のプランのACLにも含まれていないため、\n             対象コースを受講できず、MAUにも計上されません。<\/p><\/div><\/div>`\n      : '';\n  };\n  prev();\n  $('dBody').querySelectorAll('input[name=aclmode]').forEach(r=>r.addEventListener('change',()=>{\n    aclShare=r.value==='select';\n    $('aclSel').disabled=!aclShare;\n    $('dBody').querySelectorAll('.pcard').forEach(c=>\n      c.classList.toggle('sel-on',(c.dataset.aclMode==='select')===aclShare));\n    prev();\n  }));\n  $('aclSel').addEventListener('change',e=>{ aclPick=e.target.value; prev(); });\n  $('dSave').textContent='保存';\n  $('dSave').onclick=()=>{ LIC[tp].aclId=aclShare?aclPick:null; closeDlg(); render(); };\n  openDlg();\n}\n\n/* ---------- メンバーのプラン移行（サイドパネル） ---------------------------\n   Assignment is per member, so the panel lists people. Two source tabs — the\n   plan a member is on now — each carrying its own head count, which is what an\n   admin wants to see first.\n\n   Only members whose child organisation can use BOTH plans are listed. A member\n   in a one-plan organisation has nowhere to go, so rather than render a disabled\n   row we leave them out and say so above the table. Every button on screen works.\n\n   Selection is per row with a select-all, plus an explicit \"select every match\"\n   for the case where the population is far larger than a page.\n   -------------------------------------------------------------------------- */\nlet mgSrc='basic', mgOrg='', mgDept='', mgQ='', mgSel=new Set(), mgAll=false;\nconst PAGE_SIZE=10;\n\n/* orgs reachable by every in-use plan — the only ones where a move is possible */\nconst bothOrgs=()=>{\n  const live=PLANS.filter(has);\n  if(live.length<2) return [];\n  return ORGS.filter(o=>live.every(p=>aclOrgs(p).includes(o.id))).map(o=>o.id);\n};\nconst movableMembers=()=>{\n  const ok=bothOrgs();\n  return MEMBERS.filter(m=>{ const d=deptById(m.dept); return d && ok.includes(d.org); });\n};\n/* Departments where a move is possible, narrowed by the org/department filters.\n   The head counts come from here — MEMBERS is only a named sample of them. */\nconst eligDepts=()=>{\n  const ok=bothOrgs();\n  return DEPTS.filter(d=>ok.includes(d.org) &&\n    (!mgOrg||d.org===mgOrg) && (!mgDept||d.name===mgDept));\n};\nconst eligTotal=p=>{\n  const ok=bothOrgs();\n  return DEPTS.filter(d=>ok.includes(d.org)).reduce((a,d)=>a+d.by[p].n,0);\n};\nconst eligFiltered=p=>eligDepts().reduce((a,d)=>a+d.by[p].n,0);\nconst mgFiltered=()=>movableMembers().filter(m=>{\n  const d=deptById(m.dept);\n  return m.plan===mgSrc &&\n    (!mgOrg||d.org===mgOrg) && (!mgDept||d.name===mgDept) &&\n    (!mgQ||m.name.includes(mgQ)||(m.mail||'').includes(mgQ));\n});\nconst mgTarget=()=>PLANS.find(p=>p!==mgSrc&&has(p))||mgSrc;\n\nfunction openMigrate(){\n  mgSrc=PLANS.find(has)||'basic'; mgOrg=''; mgDept=''; mgQ='';\n  mgSel=new Set(); mgAll=false;\n  paintMigrate();\n  $('msheet').classList.add('on'); $('scrim').classList.add('on');\n}\nfunction closeMigrate(){ $('msheet').classList.remove('on'); $('scrim').classList.remove('on'); }\n\nfunction paintMigrate(){\n  const to=mgTarget(), rows=mgFiltered(), page=rows.slice(0,PAGE_SIZE);\n  const total=eligFiltered(mgSrc);   /* the real population behind the sample */\n  const ok=bothOrgs();\n  const deptNames=[...new Set(movableMembers().map(m=>deptById(m.dept).name))].sort();\n  const orgsWith=ORGS.filter(o=>ok.includes(o.id));\n  const allSel=page.length>0 && page.every(m=>mgSel.has(m.id));\n  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));\n\n  $('msBody').innerHTML=`\n    <div class=\"mtabs\">${PLANS.filter(has).map(p=>{\n      const c=eligTotal(p);\n      return `<button class=\"${p===mgSrc?'on':''}\" data-src=\"${p}\">${PL[p]}<span class=\"cnt\">${n(c)}名<\/span><\/button>`;\n    }).join('')}<\/div>\n\n    <div class=\"mfilt\">\n      <div class=\"dsearch\">\n        <svg viewBox=\"0 0 20 20\"><circle cx=\"8.6\" cy=\"8.6\" r=\"5.4\"/><path d=\"M12.7 12.7l4 4\"/><\/svg>\n        <input id=\"mgq\" type=\"text\" placeholder=\"従業員名で検索\" value=\"${esc(mgQ)}\" />\n      <\/div>\n      <select class=\"selbox\" id=\"mgorg\" style=\"margin-top:0\"><option value=\"\">子テナント<\/option>\n        ${orgsWith.map(o=>`<option value=\"${o.id}\"${mgOrg===o.id?' selected':''}>${esc(o.name)}<\/option>`).join('')}<\/select>\n      <select class=\"selbox\" id=\"mgdept\" style=\"margin-top:0\"><option value=\"\">所属部署<\/option>\n        ${deptNames.map(nm=>`<option value=\"${esc(nm)}\"${mgDept===nm?' selected':''}>${esc(nm)}<\/option>`).join('')}<\/select>\n    <\/div>\n\n    <div class=\"mnote\">${PL.basic}・${PL.advanced} の<b>両方を利用できる子テナント<\/b>のメンバーのみを表示しています（${orgsWith.length}組織）。\n      片方のプランしか利用できない子テナントのメンバーは移行できないため、一覧には含まれません。<\/div>\n\n    <table class=\"mtbl\"><thead><tr>\n      <th style=\"width:34px\"><input type=\"checkbox\" id=\"mgAllChk\"${allSel?' checked':''} aria-label=\"表示中のすべてを選択\" /><\/th>\n      <th>氏名<\/th><th style=\"width:26%\">子テナント<\/th><th style=\"width:22%\">部署<\/th><th style=\"width:96px\"><\/th>\n    <\/tr><\/thead><tbody>${page.length?page.map(m=>{\n      const d=deptById(m.dept), s=mgSel.has(m.id);\n      return `<tr class=\"${s?'sel':''}\">\n        <td><input type=\"checkbox\" data-pick=\"${m.id}\"${s?' checked':''} aria-label=\"${esc(m.name)}を選択\" /><\/td>\n        <td><div class=\"mperson\"><div class=\"mav\">${esc(m.name.slice(0,1))}<\/div>\n          <div><div class=\"mnm\">${esc(m.name)}<\/div><div class=\"mml\">${esc(m.mail||'')}<\/div><\/div><\/div><\/td>\n        <td>${esc(orgName(d.org))}<\/td>\n        <td>${esc(d.name)}<\/td>\n        <td><button class=\"btn btn-sm\" data-one=\"${m.id}\">${PL[to]}へ<\/button><\/td><\/tr>`;\n    }).join(''):`<tr><td colspan=\"5\" style=\"text-align:center;color:var(--text-3);padding:26px\">条件に一致するメンバーはいません<\/td><\/tr>`}\n    <\/tbody><\/table>\n\n    <div class=\"mpager\">\n      <span>${total?`1–${page.length} / ${n(total)}名`:'0名'}<\/span>\n      <span class=\"sp\"><\/span>\n      <button disabled>‹<\/button>\n      ${Array.from({length:Math.min(pages,4)},(_,i)=>`<button class=\"${i===0?'on':''}\">${i+1}<\/button>`).join('')}\n      ${pages>4?`<span>…<\/span><button>${n(pages)}<\/button>`:''}\n      <button ${pages>1?'':'disabled'}>›<\/button>\n    <\/div>`;\n\n  const selCount = mgAll ? total : mgSel.size;\n  $('msFoot').innerHTML = selCount\n    ? `<span class=\"mselinfo\"><b>${n(selCount)}名<\/b>を選択中${\n        (!mgAll&&total>page.length)?`　<button class=\"mlink\" id=\"mgSelAll\">該当する ${n(total)}名すべてを選択<\/button>`:''}<\/span>\n       <span style=\"flex:1\"><\/span>\n       <button class=\"btn\" id=\"mgClear\">選択を解除<\/button>\n       <button class=\"btn btn-primary\" id=\"mgGo\">${PL[to]} へ移行<\/button>`\n    : `<span class=\"mselinfo\" style=\"color:var(--text-3)\">移行するメンバーを選択してください<\/span>\n       <span style=\"flex:1\"><\/span>\n       <button class=\"btn btn-primary\" disabled>${PL[to]} へ移行<\/button>`;\n\n  /* wiring */\n  $('msBody').querySelectorAll('button[data-src]').forEach(b=>b.addEventListener('click',()=>{\n    mgSrc=b.dataset.src; mgSel=new Set(); mgAll=false; paintMigrate(); }));\n  $('msBody').querySelectorAll('input[data-pick]').forEach(c=>c.addEventListener('change',()=>{\n    const id=c.dataset.pick;\n    if(mgSel.has(id)) mgSel.delete(id); else mgSel.add(id);\n    mgAll=false; paintMigrate(); }));\n  const ac=$('mgAllChk');\n  if(ac) ac.addEventListener('change',()=>{\n    if(allSel) page.forEach(m=>mgSel.delete(m.id)); else page.forEach(m=>mgSel.add(m.id));\n    mgAll=false; paintMigrate(); });\n  $('msBody').querySelectorAll('button[data-one]').forEach(b=>b.addEventListener('click',()=>{\n    moveOne(b.dataset.one, to); paintMigrate(); render(); }));\n  const q=$('mgq');\n  if(q) q.addEventListener('input',()=>{ const at=q.selectionStart; mgQ=q.value; paintMigrate();\n    const nq=$('mgq'); if(nq){ nq.focus(); try{ nq.setSelectionRange(at,at); }catch(e){} } });\n  [['mgorg',v=>mgOrg=v],['mgdept',v=>mgDept=v]].forEach(([id,set])=>{\n    const el=$(id); if(el) el.addEventListener('change',()=>{ set(el.value); mgSel=new Set(); mgAll=false; paintMigrate(); });\n  });\n  const sa=$('mgSelAll'); if(sa) sa.addEventListener('click',()=>{ mgAll=true; paintMigrate(); });\n  const cl2=$('mgClear'); if(cl2) cl2.addEventListener('click',()=>{ mgSel=new Set(); mgAll=false; paintMigrate(); });\n  const go=$('mgGo'); if(go) go.addEventListener('click',()=>{\n    if(mgAll){\n      /* move the whole matching population, department by department */\n      eligDepts().forEach(d=>{\n        const k=d.by[mgSrc].n; if(!k) return;\n        moveMembers(d,mgSrc,to,k);\n        MEMBERS.forEach(m=>{ if(m.dept===d.id&&m.plan===mgSrc) m.plan=to; });\n      });\n    } else {\n      rows.filter(m=>mgSel.has(m.id)).forEach(m=>moveOne(m.id,to));\n    }\n    mgSel=new Set(); mgAll=false; paintMigrate(); render(); });\n}\n\n/* Move one member, keeping the department's per-plan split and its share of the\n   recorded MAU consistent. */\nfunction moveOne(id,to){\n  const m=MEMBERS.find(x=>x.id===id); if(!m||m.plan===to) return;\n  const d=deptById(m.dept); if(!d||!canHold(d,to)) return;\n  moveMembers(d,m.plan,to,1); m.plan=to;\n}\nfunction moveMembers(d,from,to,k){\n  k=Math.min(k,d.by[from].n); if(k<=0) return;\n  const share=d.by[from].n?Math.round(d.by[from].mau*k/d.by[from].n):0;\n  d.by[from].n-=k; d.by[from].mau-=share;\n  d.by[to].n+=k;   d.by[to].mau+=share;\n}\n\n/* ---------- dialog plumbing ---------- */\nfunction openDlg(){ $('dlg').classList.add('on'); $('scrim').classList.add('on'); }\nfunction closeDlg(){ $('dlg').classList.remove('on'); $('dlg').classList.remove('wide');\n  $('scrim').classList.remove('on'); $('dSave').disabled=false; }\n$('dClose').addEventListener('click',closeDlg);\n$('dCancel').addEventListener('click',closeDlg);\n$('scrim').addEventListener('click',()=>{ closeDlg(); closeMigrate(); });\n$('msClose').addEventListener('click',closeMigrate);\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDlg(); closeMigrate(); } });\n\n/* ---------- prototype state ---------- */\nfunction setState(s){\n  LIC=clone(BASE_LIC); DEPTS=clone(BASE_DEPTS);\n  const collapse=(to,from)=>DEPTS.forEach(d=>{\n    d.by[to].n+=d.by[from].n; d.by[to].mau+=d.by[from].mau;\n    d.by[from].n=0; d.by[from].mau=0;\n  });\n  if(s==='basic'){    LIC.advanced=null; collapse('basic','advanced');\n                      MEMBERS.forEach(m=>m.plan='basic'); }\n  if(s==='advanced'){ LIC.basic=null;    collapse('advanced','basic');\n                      MEMBERS.forEach(m=>m.plan='advanced'); }\n  plan=PLANS.find(has)||'basic';\n  render();\n}\ndocument.querySelectorAll('#switcher button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#switcher button').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); setState(b.dataset.s);\n}));\n\n/* Tooltip */\nconst gtip = $('gtip'); const TIP_W = 290, GAP = 10, EDGE = 12;\nfunction gtipArrow(ax){\n  let s = document.getElementById('gtip-arrow-style');\n  if(!s){ s = document.createElement('style'); s.id='gtip-arrow-style'; document.head.appendChild(s); }\n  s.textContent = `#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(icon){\n  const src = icon.querySelector('.tip'); if(!src) return;\n  gtip.innerHTML = src.innerHTML; gtip.classList.add('on'); gtip.style.width = TIP_W+'px';\n  const r = icon.getBoundingClientRect();\n  let left = Math.max(EDGE, Math.min(r.left + r.width/2 - TIP_W/2, window.innerWidth - TIP_W - EDGE));\n  const h = gtip.offsetHeight, above = r.top - GAP - h >= 60;\n  gtip.style.left = left+'px';\n  gtip.style.top  = (above ? r.top-GAP-h : r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above); gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12, Math.min(r.left + r.width/2 - left - 4.5, TIP_W-21)));\n}\nfunction hideTip(){ gtip.classList.remove('on'); }\nfunction bindTips(){\n  document.querySelectorAll('.info').forEach(i=>{\n    if(i.dataset.b) return; i.dataset.b='1';\n    i.setAttribute('tabindex','0');\n    i.addEventListener('mouseenter',()=>showTip(i)); i.addEventListener('mouseleave',hideTip);\n    i.addEventListener('focus',()=>showTip(i));      i.addEventListener('blur',hideTip);\n  });\n}\nwindow.addEventListener('scroll',hideTip,true); window.addEventListener('resize',hideTip);\n\n$('navToggle').addEventListener('click', ()=>document.body.classList.toggle('nav-collapsed'));\n\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "child": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=1280\" />\n<title>Skill Hub — MAUライセンス 利用状況（子テナント）<\/title>\n<style>\n  :root{\n    --bg:#f4f6f9; --surface:#fff; --line:#e3e8ef; --line-strong:#cdd5e0;\n    --text:#101828; --text-2:#475467; --text-3:#79839a;\n    --brand:#2563eb; --brand-weak:#eaf1fe;\n    --ok:#0d8a5f; --ok-weak:#e8f6f0;\n    --warn:#b45309; --warn-weak:#fef4e6;\n    --danger:#c02626; --danger-weak:#fdeceb;\n    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;\n    font-family:\"Inter\",\"Helvetica Neue\",Arial,\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Noto Sans JP\",\"Yu Gothic UI\",\"Meiryo\",sans-serif;}\n  .num{font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\";}\n\n  /* ---------- App shell: sidebar + header (Givery Skill Hub DS) ---------- */\n  .shell{display:flex;min-height:100vh;}\n  .side{width:256px;flex:none;background:#fff;border-right:1px solid var(--line);\n    position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:width .18s,transform .18s;}\n  .side-brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 18px;}\n  .side-brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ef4a3c,#c8362d);\n    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none;}\n  .side-brand .nm{font-weight:700;font-size:15.5px;letter-spacing:.01em;}\n\n  .orgsw{margin:2px 12px 6px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;\n    display:flex;align-items:center;gap:9px;cursor:pointer;background:#fff;}\n  .orgsw:hover{background:#f7f9fc;}\n  .orgsw .oi{width:26px;height:26px;bor 6 7.7-3.5-1.2-6-3.8-6-7.7v-5z\"/><\/svg>セキュリティ<\/a>\n      <a href=\"#\" class=\"active\"><svg viewBox=\"0 0 20 20\"><rect x=\"2.3\" y=\"4.6\" width=\"15.4\" height=\"10.8\" rx=\"2\"/><path d=\"M2.3 8.4h15.4M5.4 12.2h3\"/><\/svg>ライセンス管理<\/a>\n    <\/nav>\n    <nav class=\"nav sub\">\n      <a href=\"#\" class=\"active\">MAUライセンス 利用状況<\/a>\n      <a href=\"#\">Coreライセンス<\/a>\n    <\/nav>\n  <\/div>\n  <div style=\"height:28px\"><\/div>\n<\/aside>\n\n<div class=\"main\">\n  <header class=\"hdr\">\n    <button class=\"toggle\" id=\"navToggle\" aria-label=\"ナビゲーションの表示切替\">\n      <svg viewBox=\"0 0 20 20\"><rect x=\"2.5\" y=\"3.5\" width=\"15\" height=\"13\" rx=\"2\"/><path d=\"M7.8 3.5v13\"/><\/svg>\n    <\/button>\n    <span class=\"vr\"><\/span>\n    <nav class=\"crumb\">\n      <span id=\"crumbOrg\">九州テック株式会社<\/span><span class=\"sep\">›<\/span>\n      <span class=\"cur\">MAUライセンス 利用状況<\/span>\n    <\/nav>\n    <span class=\"spacer\"><\/span>\n    <div class=\"prof\" title=\"子テナント管理者\">KT<\/div>\n  <\/header>\n\n<div class=\"wrap\">\n  <div class=\"page-head\">\n    <div>\n      <div class=\"ctx\">\n        <span id=\"ctxOrg\">九州テック株式会社<\/span>\n        <span class=\"badge b-neutral\">子テナント<\/span>\n      <\/div>\n      <h1>MAUライセンス 利用状況<\/h1>\n      <p class=\"page-sub\" id=\"pageSub\">—<\/p>\n    <\/div>\n    <div id=\"pageAct\"><\/div>\n  <\/div>\n\n  <div id=\"view\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"gtip\"><\/div>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<aside class=\"msheet\" id=\"msheet\" aria-label=\"メンバーのプラン移行\">\n  <div class=\"ms-h\"><h3>メンバーのプラン移行<\/h3><button class=\"x\" id=\"msClose\" aria-label=\"閉じる\">✕<\/button><\/div>\n  <div class=\"ms-b\" id=\"msBody\"><\/div>\n  <div class=\"ms-f\" id=\"msFoot\"><\/div>\n<\/aside>\n<div class=\"dlg\" id=\"dlg\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"dlg-h\"><h3 id=\"dTitle\">—<\/h3><button class=\"x\" id=\"dClose\" aria-label=\"閉じる\">✕<\/button><\/div>\n  <div class=\"dlg-b\" id=\"dBody\"><\/div>\n  <div class=\"dlg-f\">\n    <button class=\"btn\" id=\"dCancel\">キャンセル<\/button>\n    <button class=\"btn btn-primary\" id=\"dSave\">移行する<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"demobar\">\n  <span class=\"lbl\">Prototype state<\/span>\n  <div class=\"seg\" id=\"switcher\">\n    <button data-s=\"both\" class=\"on\">両プラン利用可<\/button>\n    <button data-s=\"basic\">Basicのみ<\/button>\n    <button data-s=\"advanced\">Advancedのみ<\/button>\n    <button data-s=\"none\">対象外<\/button>\n  <\/div>\n  <span class=\"spacer\"><\/span>\n  <span class=\"cap\" id=\"dbCap\"><\/span>\n<\/div>\n<script>\n/* ============================================================================\n   MAUライセンス 利用状況 — 子テナント管理者\n\n   A child tenant owns nothing. The contract, its cap and its ACL all belong to\n   the parent. This screen is therefore the parent screen with every ownership\n   affordance removed and every figure re-scoped to this organisation only.\n\n   INFORMATION BOUNDARY\n   The child sees the parent's contract size and the parent's org-wide total —\n   both are needed for its own figure to mean anything. What it does not get is\n   any per-sibling breakdown: there is no 子組織別 table here, and no way to\n   attribute the remainder of the pool to a named organisation.\n\n   PERMISSIONS\n   * CAN: move its OWN members between plans, when the ACL grants both.\n   * CANNOT: choose the ACL, edit the contract, or see anything about siblings.\n   ========================================================================== */\nconst PLANS=['basic','advanced'];\nconst PL={basic:'Basic', advanced:'Advanced'};\nconst MONTH_LABELS=['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];\nconst MONTH_FULL=['2026年4月','2026年5月','2026年6月','2026年7月','2026年8月','2026年9月','2026年10月',\n                  '2026年11月','2026年12月','2027年1月','2027年2月','2027年3月'];\nconst PARENT='日本テクノホールディングス';\n\n/* The parent's licences as this child sees them: name, term, cap and the\n   org-wide current month. Not broken down by sibling organisation. */\nconst PARENT_LIC={\n  basic:{name:'全社ITリテラシー（2026年度）', cap:2000,\n         term:'2026/04/01 – 2027/03/31', parentTotal:1500},\n  advanced:{name:'先端技術エンジニア育成（2026年度）', cap:1000,\n            term:'2026/04/01 – 2027/03/31', parentTotal:1080},\n};\n\n/* This organisation's own departments. `by[plan]` is the per-member split, the\n   same shape the parent screen uses — assignment lives on the member. */\nconst ORG_BASE={\n  id:'tokyo', name:'東京本社', code:'ORG-100302',\n  grants:{basic:true, advanced:true},      /* what the parent's ACLs allow */\n  depts:[\n    {id:'d3', name:'営業部',         head:4200, by:{basic:{n:4200,mau:300}, advanced:{n:0,mau:0}}},\n    {id:'d4', name:'人事部',         head: 900, by:{basic:{n: 900,mau: 90}, advanced:{n:0,mau:0}}},\n    {id:'d5', name:'情報システム部', head:1600, by:{basic:{n: 200,mau: 40}, advanced:{n:1400,mau:360}}},\n  ],\n  members:[\n    {id:'m1', name:'鈴木 大輔', mail:'daisuke.suzuki@nihon-techno.co.jp', dept:'d3', plan:'basic',    act:true},\n    {id:'m2', name:'伊藤 由紀', mail:'yuki.ito@nihon-techno.co.jp',      dept:'d3', plan:'basic',    act:false},\n    {id:'m3', name:'岡本 早苗', mail:'sanae.okamoto@nihon-techno.co.jp', dept:'d3', plan:'basic',    act:true},\n    {id:'m4', name:'松本 沙織', mail:'saori.matsumoto@nihon-techno.co.jp',dept:'d4', plan:'basic',   act:false},\n    {id:'m5', name:'高橋 亮',   mail:'ryo.takahashi@nihon-techno.co.jp', dept:'d5', plan:'advanced', act:true},\n    {id:'m6', name:'森 千尋',   mail:'chihiro.mori@nihon-techno.co.jp',  dept:'d5', plan:'basic',    act:true},\n    {id:'m7', name:'藤田 直人', mail:'naoto.fujita@nihon-techno.co.jp',  dept:'d5', plan:'advanced', act:true},\n  ],\n  /* own monthly history, excluding the current month which is derived */\n  past:{basic:[210,280,340,390], advanced:[180,240,300,340]},\n};\n\n/* Alternative shapes for the prototype state bar. */\nconst SHAPES={\n  both:     {id:'tokyo', name:'東京本社',            code:'ORG-100302', grants:{basic:true, advanced:true}},\n  basic:    {id:'osaka', name:'大阪支社',            code:'ORG-100303', grants:{basic:true, advanced:false}},\n  advanced: {id:'global',name:'グローバル事業部',    code:'ORG-100306', grants:{basic:false,advanced:true}},\n  none:     {id:'kyushu',name:'九州テック株式会社',  code:'ORG-100305', grants:{basic:false,advanced:false}},\n};\n\nconst clone=o=>JSON.parse(JSON.stringify(o));\nlet ORG=clone(ORG_BASE);\nlet plan='basic';\n\nconst n=v=>v.toLocaleString('ja-JP');\nconst pct=(a,b)=>b?Math.round(a/b*1000)/10:0;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nconst granted=p=>!!ORG.grants[p];\nconst anyGrant=()=>PLANS.some(granted);\nconst deptById=id=>ORG.depts.find(d=>d.id===id);\nconst planTag=p=>`<span class=\"lictag ${p==='advanced'?'adv':'basic'}\">${PL[p]}<\/span>`;\nconst info=html=>`<span class=\"info\" tabindex=\"0\">?<span class=\"tip\">${html}<\/span><\/span>`;\n\n/* own figures only */\nconst ownAssigned=p=>granted(p)?ORG.depts.reduce((a,d)=>a+d.by[p].n,0):0;\nconst ownMau     =p=>granted(p)?ORG.depts.reduce((a,d)=>a+d.by[p].mau,0):0;\nconst ownSeries  =p=>ORG.past[p].concat([ownMau(p)]);\n\n/* Whether the shared pool is inside the contract. The org-wide total is shown;\n   which sibling contributed what is not. */\nconst poolOver=p=>PARENT_LIC[p].parentTotal>PARENT_LIC[p].cap;\nfunction poolNote(p){\n  const L=PARENT_LIC[p], over=poolOver(p), mine=ownMau(p);\n  return `<div class=\"poolnote ${over?'pool-over':'pool-ok'}\">\n    <svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7.6\"/><path d=\"${over?'M10 7v5M10 14.8h.01':'M10 6.5v7M10 3.2h.01'}\"/><\/svg>\n    <span>ご契約MAU <b>${n(L.cap)}<\/b> は${PARENT}全体で共有されます。\n      当月の全体利用は <b>${n(L.parentTotal)}<\/b>（うち当社 ${n(mine)}・${pct(mine,L.parentTotal)}%）です。\n      ${over?'<b>全体で契約MAUを超過しています。<\/b>受講は継続できますが、次回更新時に契約の見直しが検討される可能性があります。':'現在は契約の範囲内です。'}<\/span>\n  <\/div>`;\n}\n\n/* ---------- plan tabs: only what the parent's ACL grants ---------- */\nfunction planNav(){\n  return `<div class=\"plannav\">${PLANS.map(p=>{\n    if(!granted(p)) return `<button class=\"pn\" disabled>${PL[p]}<span>対象外<\/span><\/button>`;\n    return `<button class=\"pn ${p===plan?'on':''}\" data-plan=\"${p}\">${PL[p]}\n      <span>当社の当月MAU ${n(ownMau(p))}<\/span><\/button>`;\n  }).join('')}<\/div>`;\n}\n\n/* ---------- the open plan ---------- */\nfunction planPage(){\n  const p=plan, L=PARENT_LIC[p], H=180;\n  const mau=ownMau(p), asg=ownAssigned(p), T=ownSeries(p);\n  const avg=Math.round(T.reduce((a,b)=>a+b,0)/T.length);\n  const CMAX=Math.max(...T)*1.3;\n  const ys=[0,.5,1].map(f=>`<span style=\"top:${H-f*H}px\">${n(Math.round(CMAX*f))}<\/span>`).join('');\n  const bars=MONTH_LABELS.slice(0,T.length).map((lab,i)=>{\n    const now=i===T.length-1;\n    return `<div class=\"bcol ${now?'now':''}\">\n      <span class=\"bval\" style=\"color:var(--text-2)\">${n(T[i])}<\/span>\n      <div class=\"bar\" style=\"height:${Math.max(T[i]/CMAX*H,3)}px;background:${now?'#2563eb':'#8fb2f4'}\"><\/div>\n      <span class=\"bx\">${lab}<\/span><\/div>`;\n  }).join('');\n  const rows=T.map((v,i)=>`<tr>\n      <td>${MONTH_FULL[i]}${i===T.length-1?' <span style=\"font-size:10.5px;color:var(--brand);font-weight:700\">当月<\/span>':''}<\/td>\n      <td class=\"r num\"><b>${n(v)}<\/b><\/td>\n      <td class=\"r num\">${n(ORG.depts.reduce((a,d)=>a+d.by[p].n,0))}<\/td>\n      <td class=\"r num\">${pct(v,asg)}%<\/td><\/tr>`).join('');\n\n\n  return `<div class=\"lichead\">\n    <div style=\"flex:1;min-width:0\">\n      <div class=\"nm\">${esc(L.name)}<\/div>\n      <div class=\"meta\">有効な期限 ${L.term}　／　${esc(PARENT)} のご契約<\/div>\n    <\/div>\n    ${planTag(p)}\n    <span class=\"roflag\"><svg viewBox=\"0 0 20 20\"><rect x=\"4.5\" y=\"9\" width=\"11\" height=\"7.5\" rx=\"1.6\"/><path d=\"M7.2 9V6.8a2.8 2.8 0 015.6 0V9\"/><\/svg>参照のみ<\/span>\n  <\/div>\n\n  <div class=\"kpis section\">\n    <div class=\"kpi accent\">\n      <div class=\"k\">当社の当月MAU（2026年8月）${info('当社のメンバーのうち、当月に対象コースを1つ以上受講した<b>実人数<\/b>です。月次でリセットされます。')}<\/div>\n      <div class=\"v num\" style=\"color:var(--brand)\">${n(mau)}<\/div>\n      <div class=\"s\">前月 ${n(T[T.length-2])} → 当月 ${n(mau)}<\/div><\/div>\n    <div class=\"kpi\">\n      <div class=\"k\">当社の対象者数${info('当社の部門に所属し、このプランを利用できるメンバーの数です。')}<\/div>\n      <div class=\"v num\">${n(asg)}<small>名<\/small><\/div>\n      <div class=\"s\">全 ${n(ORG.depts.reduce((a,d)=>a+d.head,0))}名中<\/div><\/div>\n    <div class=\"kpi\">\n      <div class=\"k\">当社の平均MAU${info('記録された月の当社MAUの平均です。当月だけの増減に左右されない水準を示します。')}<\/div>\n      <div class=\"v num\">${n(avg)}<\/div>\n      <div class=\"s\">${T.length}ヶ月の平均　／　最大 ${n(Math.max(...T))}<\/div><\/div>\n    <div class=\"kpi shared\">\n      <div class=\"k\">ご契約MAU${info(`${esc(PARENT)}が契約したMAU数です。<br><b>親組織全体で共有されます<\/b>ので、当社だけで使い切れる数ではありません。`)}<\/div>\n      <div class=\"v num\" style=\"color:var(--text-2)\">${n(L.cap)}<small>MAU<\/small><\/div>\n      <div class=\"shr\">親組織全体で共有<\/div><\/div>\n  <\/div>\n\n  ${poolNote(p)}\n\n  <div class=\"section card\">\n    <div class=\"card-h\"><h2>月次MAU実績（当社）<\/h2>\n      <span class=\"hint\">当社のメンバーのみを集計しています<\/span><\/div>\n    <div class=\"card-b\">\n      <div class=\"chart\"><div class=\"chart-y\">${ys}<\/div>\n        <div class=\"chart-plot\"><div class=\"bars\">${bars}<\/div><\/div><\/div>\n      <div class=\"legend\"><span><i style=\"background:#8fb2f4\"><\/i>過去月<\/span>\n        <span><i style=\"background:#2563eb\"><\/i>当月<\/span><\/div>\n    <\/div>\n    <div class=\"card-h\" style=\"border-top:1px solid var(--line)\">\n      <h2 style=\"font-size:13px\">月次明細（当社）<\/h2><button class=\"btn btn-sm\">CSVダウンロード<\/button><\/div>\n    <table><thead><tr>\n      <th style=\"width:34%\">対象月<\/th><th class=\"r\" style=\"width:22%\">当月MAU<\/th>\n      <th class=\"r\" style=\"width:22%\">対象者数<\/th><th class=\"r\" style=\"width:22%\">受講率<\/th>\n    <\/tr><\/thead><tbody>${rows}<\/tbody><\/table>\n  <\/div>`;\n}\n\n/* ---------- nothing granted ---------- */\nfunction viewNoGrant(){\n  return `<div class=\"empty\">\n    <div class=\"ei\" style=\"background:#f4f6f9\"><svg viewBox=\"0 0 24 24\" style=\"stroke:var(--text-3)\">\n      <rect x=\"5\" y=\"10.5\" width=\"14\" height=\"9.5\" rx=\"2\"/><path d=\"M8.4 10.5V7.8a3.6 3.6 0 017.2 0v2.7\"/><\/svg><\/div>\n    <h3>ご利用可能なMAUライセンスがありません<\/h3>\n    <p>${esc(PARENT)}のMAUライセンスのアクセス範囲に当社が含まれていないため、対象コースを受講できません。\n      ご利用をご希望の場合は、親組織の管理者にアクセス範囲の追加をご依頼ください。<\/p>\n  <\/div>`;\n}\n\n/* ---------- メンバーのプラン移行（サイドパネル） ---------------------------\n   Same panel as the parent screen, scoped to this organisation. It only appears\n   when the parent's ACLs grant both plans, so every row's button works.\n   -------------------------------------------------------------------------- */\nlet mgSrc='basic', mgDept='', mgQ='', mgSel=new Set(), mgAll=false;\nconst PAGE_SIZE=10;\nconst mgTarget=()=>PLANS.find(p=>p!==mgSrc&&granted(p))||mgSrc;\nconst eligDepts=()=>ORG.depts.filter(d=>!mgDept||d.id===mgDept);\nconst eligTotal=p=>ORG.depts.reduce((a,d)=>a+d.by[p].n,0);\nconst eligFiltered=p=>eligDepts().reduce((a,d)=>a+d.by[p].n,0);\nconst mgFiltered=()=>ORG.members.filter(m=>\n  m.plan===mgSrc && (!mgDept||m.dept===mgDept) &&\n  (!mgQ||m.name.includes(mgQ)||(m.mail||'').includes(mgQ)));\n\nfunction openMigrate(){\n  mgSrc=PLANS.find(granted)||'basic'; mgDept=''; mgQ=''; mgSel=new Set(); mgAll=false;\n  paintMigrate();\n  $('msheet').classList.add('on'); $('scrim').classList.add('on');\n}\nfunction closeMigrate(){ $('msheet').classList.remove('on'); $('scrim').classList.remove('on'); }\n\nfunction paintMigrate(){\n  const to=mgTarget(), rows=mgFiltered(), page=rows.slice(0,PAGE_SIZE);\n  const total=eligFiltered(mgSrc);\n  const allSel=page.length>0 && page.every(m=>mgSel.has(m.id));\n  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));\n\n  $('msBody').innerHTML=`\n    <div class=\"mtabs\">${PLANS.filter(granted).map(p=>\n      `<button class=\"${p===mgSrc?'on':''}\" data-src=\"${p}\">${PL[p]}<span class=\"cnt\">${n(eligTotal(p))}名<\/span><\/button>`).join('')}<\/div>\n\n    <div class=\"mfilt\" style=\"grid-template-columns:1.6fr 1fr\">\n      <div class=\"dsearch\">\n        <svg viewBox=\"0 0 20 20\"><circle cx=\"8.6\" cy=\"8.6\" r=\"5.4\"/><path d=\"M12.7 12.7l4 4\"/><\/svg>\n        <input id=\"mgq\" type=\"text\" placeholder=\"従業員名で検索\" value=\"${esc(mgQ)}\" />\n      <\/div>\n      <select class=\"selbox\" id=\"mgdept\" style=\"margin-top:0\"><option value=\"\">所属部署<\/option>\n        ${ORG.depts.map(d=>`<option value=\"${d.id}\"${mgDept===d.id?' selected':''}>${esc(d.name)}<\/option>`).join('')}<\/select>\n    <\/div>\n\n    <div class=\"mnote\">当社のメンバーのみが対象です。${esc(PARENT)}の他の子テナントのメンバーは含まれません。<\/div>\n\n    <table class=\"mtbl\"><thead><tr>\n      <th style=\"width:34px\"><input type=\"checkbox\" id=\"mgAllChk\"${allSel?' checked':''} aria-label=\"表示中のすべてを選択\" /><\/th>\n      <th>氏名<\/th><th style=\"width:30%\">部署<\/th><th style=\"width:96px\"><\/th>\n    <\/tr><\/thead><tbody>${page.length?page.map(m=>{\n      const d=deptById(m.dept), s=mgSel.has(m.id);\n      return `<tr class=\"${s?'sel':''}\">\n        <td><input type=\"checkbox\" data-pick=\"${m.id}\"${s?' checked':''} aria-label=\"${esc(m.name)}を選択\" /><\/td>\n        <td><div class=\"mperson\"><div class=\"mav\">${esc(m.name.slice(0,1))}<\/div>\n          <div><div class=\"mnm\">${esc(m.name)}<\/div><div class=\"mml\">${esc(m.mail||'')}<\/div><\/div><\/div><\/td>\n        <td>${esc(d.name)}<\/td>\n        <td><button class=\"btn btn-sm\" data-one=\"${m.id}\">${PL[to]}へ<\/button><\/td><\/tr>`;\n    }).join(''):`<tr><td colspan=\"4\" style=\"text-align:center;color:var(--text-3);padding:26px\">条件に一致するメンバーはいません<\/td><\/tr>`}\n    <\/tbody><\/table>\n\n    <div class=\"mpager\">\n      <span>${total?`1–${page.length} / ${n(total)}名`:'0名'}<\/span>\n      <span class=\"sp\"><\/span><button disabled>‹<\/button>\n      ${Array.from({length:Math.min(pages,4)},(_,i)=>`<button class=\"${i===0?'on':''}\">${i+1}<\/button>`).join('')}\n      ${pages>4?`<span>…<\/span><button>${n(pages)}<\/button>`:''}\n      <button ${pages>1?'':'disabled'}>›<\/button>\n    <\/div>`;\n\n  const selCount = mgAll ? total : mgSel.size;\n  $('msFoot').innerHTML = selCount\n    ? `<span class=\"mselinfo\"><b>${n(selCount)}名<\/b>を選択中${\n        (!mgAll&&total>page.length)?`　<button class=\"mlink\" id=\"mgSelAll\">該当する ${n(total)}名すべてを選択<\/button>`:''}<\/span>\n       <span style=\"flex:1\"><\/span>\n       <button class=\"btn\" id=\"mgClear\">選択を解除<\/button>\n       <button class=\"btn btn-primary\" id=\"mgGo\">${PL[to]} へ移行<\/button>`\n    : `<span class=\"mselinfo\" style=\"color:var(--text-3)\">移行するメンバーを選択してください<\/span>\n       <span style=\"flex:1\"><\/span>\n       <button class=\"btn btn-primary\" disabled>${PL[to]} へ移行<\/button>`;\n\n  $('msBody').querySelectorAll('button[data-src]').forEach(b=>b.addEventListener('click',()=>{\n    mgSrc=b.dataset.src; mgSel=new Set(); mgAll=false; paintMigrate(); }));\n  $('msBody').querySelectorAll('input[data-pick]').forEach(c=>c.addEventListener('change',()=>{\n    const id=c.dataset.pick; if(mgSel.has(id)) mgSel.delete(id); else mgSel.add(id);\n    mgAll=false; paintMigrate(); }));\n  const ac=$('mgAllChk');\n  if(ac) ac.addEventListener('change',()=>{\n    if(allSel) page.forEach(m=>mgSel.delete(m.id)); else page.forEach(m=>mgSel.add(m.id));\n    mgAll=false; paintMigrate(); });\n  $('msBody').querySelectorAll('button[data-one]').forEach(b=>b.addEventListener('click',()=>{\n    moveOne(b.dataset.one,to); paintMigrate(); render(); }));\n  const q=$('mgq');\n  if(q) q.addEventListener('input',()=>{ const at=q.selectionStart; mgQ=q.value; paintMigrate();\n    const nq=$('mgq'); if(nq){ nq.focus(); try{ nq.setSelectionRange(at,at); }catch(e){} } });\n  const ds=$('mgdept');\n  if(ds) ds.addEventListener('change',()=>{ mgDept=ds.value; mgSel=new Set(); mgAll=false; paintMigrate(); });\n  const sa=$('mgSelAll'); if(sa) sa.addEventListener('click',()=>{ mgAll=true; paintMigrate(); });\n  const cl2=$('mgClear'); if(cl2) cl2.addEventListener('click',()=>{ mgSel=new Set(); mgAll=false; paintMigrate(); });\n  const go=$('mgGo'); if(go) go.addEventListener('click',()=>{\n    if(mgAll){\n      eligDepts().forEach(d=>{\n        const k=d.by[mgSrc].n; if(!k) return;\n        moveMembers(d,mgSrc,to,k);\n        ORG.members.forEach(m=>{ if(m.dept===d.id&&m.plan===mgSrc) m.plan=to; });\n      });\n    } else {\n      rows.filter(m=>mgSel.has(m.id)).forEach(m=>moveOne(m.id,to));\n    }\n    mgSel=new Set(); mgAll=false; paintMigrate(); render(); });\n}\nfunction moveOne(id,to){\n  const m=ORG.members.find(x=>x.id===id); if(!m||m.plan===to) return;\n  moveMembers(deptById(m.dept),m.plan,to,1); m.plan=to;\n}\n/* MAU moves with the members so the monthly figures stay consistent. */\nfunction moveMembers(d,from,to,k){\n  k=Math.min(k,d.by[from].n); if(k<=0) return;\n  const share=d.by[from].n?Math.round(d.by[from].mau*k/d.by[from].n):0;\n  d.by[from].n-=k; d.by[from].mau-=share;\n  d.by[to].n+=k;   d.by[to].mau+=share;\n}\n\n/* ---------- dialog plumbing ---------- */\nfunction openDlg(){ $('dlg').classList.add('on'); $('scrim').classList.add('on'); }\nfunction closeDlg(){ $('dlg').classList.remove('on'); $('dlg').classList.remove('wide');\n  $('scrim').classList.remove('on'); $('dSave').disabled=false; }\n$('dClose').addEventListener('click',closeDlg);\n$('dCancel').addEventListener('click',closeDlg);\n$('scrim').addEventListener('click',()=>{ closeDlg(); closeMigrate(); });\n$('msClose').addEventListener('click',closeMigrate);\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDlg(); closeMigrate(); } });\n\n/* ---------- render ---------- */\nfunction render(){\n  $('ctxOrg').textContent=ORG.name;\n  $('crumbOrg').textContent=ORG.name;\n  $('pageSub').innerHTML=anyGrant()\n    ? `親組織「${esc(PARENT)}」のご契約に基づく、当社のご利用状況です。ご契約MAUは親組織全体で共有されます。`\n    : `親組織「${esc(PARENT)}」のMAUライセンスの対象に当社は含まれていません。`;\n  if(!anyGrant()){ $('view').innerHTML=viewNoGrant(); $('pageAct').innerHTML='';\n    $('dbCap').textContent=`${ORG.name}　／　対象外`; bindTips(); return; }\n  if(!granted(plan)) plan=PLANS.find(granted);\n  $('view').innerHTML=planNav()+planPage();\n  $('view').querySelectorAll('button[data-plan]').forEach(b=>\n    b.addEventListener('click',()=>{ plan=b.dataset.plan; render(); }));\n  $('pageAct').innerHTML = PLANS.every(granted)\n    ? `<button class=\"btn btn-sm\" id=\"btn-mig\">メンバーのプラン移行<\/button>` : '';\n  const mb=$('btn-mig'); if(mb) mb.addEventListener('click',openMigrate);\n  document.title=`Skill Hub — MAUライセンス 利用状況（${ORG.name}）`;\n  $('dbCap').textContent=`${ORG.name}　／　利用可能：${PLANS.filter(granted).map(p=>PL[p]).join(' ＋ ')}`;\n  bindTips();\n}\n\n/* ---------- prototype state ---------- */\nfunction setState(s){\n  const shape=SHAPES[s]||SHAPES.both;\n  ORG=clone(ORG_BASE);\n  ORG.id=shape.id; ORG.name=shape.name; ORG.code=shape.code; ORG.grants=clone(shape.grants);\n  /* Members can only hold a granted plan — collapse onto whatever survives. */\n  const only=PLANS.filter(p=>ORG.grants[p]);\n  if(only.length===1){\n    const to=only[0], from=PLANS.find(p=>p!==to);\n    ORG.depts.forEach(d=>{\n      d.by[to].n+=d.by[from].n; d.by[to].mau+=d.by[from].mau;\n      d.by[from].n=0; d.by[from].mau=0;\n    });\n    ORG.members.forEach(m=>m.plan=to);\n  }\n  plan=only[0]||'basic';\n  render();\n}\ndocument.querySelectorAll('#switcher button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#switcher button').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); setState(b.dataset.s);\n}));\n/* Tooltip */\nconst gtip = $('gtip'); const TIP_W = 290, GAP = 10, EDGE = 12;\nfunction gtipArrow(ax){\n  let s = document.getElementById('gtip-arrow-style');\n  if(!s){ s = document.createElement('style'); s.id='gtip-arrow-style'; document.head.appendChild(s); }\n  s.textContent = `#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(icon){\n  const src = icon.querySelector('.tip'); if(!src) return;\n  gtip.innerHTML = src.innerHTML; gtip.classList.add('on'); gtip.style.width = TIP_W+'px';\n  const r = icon.getBoundingClientRect();\n  let left = Math.max(EDGE, Math.min(r.left + r.width/2 - TIP_W/2, window.innerWidth - TIP_W - EDGE));\n  const h = gtip.offsetHeight, above = r.top - GAP - h >= 60;\n  gtip.style.left = left+'px';\n  gtip.style.top  = (above ? r.top-GAP-h : r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above); gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12, Math.min(r.left + r.width/2 - left - 4.5, TIP_W-21)));\n}\nfunction hideTip(){ gtip.classList.remove('on'); }\nfunction bindTips(){\n  document.querySelectorAll('.info').forEach(i=>{\n    if(i.dataset.b) return; i.dataset.b='1';\n    i.setAttribute('tabindex','0');\n    i.addEventListener('mouseenter',()=>showTip(i)); i.addEventListener('mouseleave',hideTip);\n    i.addEventListener('focus',()=>showTip(i));      i.addEventListener('blur',hideTip);\n  });\n}\nwindow.addEventListener('scroll',hideTip,true); window.addEventListener('resize',hideTip);\n\n$('navToggle').addEventListener('click', ()=>document.body.classList.toggle('nav-collapsed'));\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};
var FILE2KEY = {"skill-hub-sysadmin-related-orgs.html": "orgs", "skill-hub-sysadmin-org-detail.html": "detail", "skill-hub-mau-license.html": "customer", "skill-hub-child-usage.html": "child"};
var fr = document.getElementById('fr');

function show(key, qs){
  if(!SRC[key]) key = 'orgs';
  renderStates(null);
  fr.srcdoc = SRC[key].replace('"__QS__"', JSON.stringify(qs || ''));
  var bs = document.querySelectorAll('#tabs button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.k===key);
  var h = '#' + key + (qs || '');
  if(location.hash !== h) history.replaceState(null, '', h);
}
function route(){
  var raw = location.hash.replace(/^#/, '') || 'orgs';
  var key = raw.split('?')[0];
  var qs  = raw.indexOf('?') >= 0 ? '?' + raw.split('?')[1] : '';
  show(key, qs);
}
/* Each embedded page reports the prototype states it supports; the control for
   them lives up here next to the page tabs, and clicking one is sent back down.
   A page with no states (関連会社一覧) simply hides the control. */
function renderStates(list, cap){
  var host = document.getElementById('pstate-host');
  var seg  = document.getElementById('pstate-seg');
  var note = document.getElementById('note');
  seg.innerHTML = '';
  if(!list || !list.length){ host.hidden = true; note.textContent = '1440px 以上での閲覧を推奨'; return; }
  host.hidden = false;
  note.textContent = cap || '1440px 以上での閲覧を推奨';
  list.forEach(function(s){
    var b = document.createElement('button');
    b.textContent = s.label;
    if(s.on) b.className = 'on';
    b.addEventListener('click', function(){
      var bs = seg.querySelectorAll('button');
      for(var i=0;i<bs.length;i++) bs[i].classList.remove('on');
      b.classList.add('on');
      fr.contentWindow.postMessage({__state: s.k}, '*');
    });
    seg.appendChild(b);
  });
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if(d.__states){ renderStates(d.__states, d.__cap); return; }
  var nav = d.__nav; if(!nav) return;
  var file = nav.split('?')[0];
  var qs   = nav.indexOf('?') >= 0 ? '?' + nav.split('?')[1] : '';
  show(FILE2KEY[file] || 'orgs', qs);
});
var bs = document.querySelectorAll('#tabs button');
for(var i=0;i<bs.length;i++) (function(b){ b.addEventListener('click', function(){ show(b.dataset.k, ''); }); })(bs[i]);
window.addEventListener('hashchange', route);
route();
