ame:'ACME 研修センター',plan:'エンタープライズ',seats:980,seatCap:1200,mau:960},\n     {id:82,name:'ACME 東京本社',plan:'エンタープライズ',seats:760,seatCap:900,mau:640},\n   ]},\n  {id:6382,name:'日本テクノホールディングス',seg:'製造',plan:'エンタープライズ',\n   term:'2026/4/1 - 2027/3/31',days:227,seats:2840,seatCap:3180,contractSet:false,\n   lic:{cap:2000,term:'2026/4/1 - 2027/3/31',days:227,sync:true,\n        trend:[1310,1680,2090,2280,2450],hist:['—','1,540 / 2,000（超過0）']},\n   children:[\n     {id:64,name:'日本テクノ研修センター',plan:'エンタープライズ',seats:980,seatCap:1200,mau:960},\n     {id:65,name:'東京本社',plan:'エンタープライズ',seats:760,seatCap:900,mau:640},\n     {id:66,name:'大阪支社',plan:'エンタープライズ',seats:520,seatCap:700,mau:350},\n   ]},\n  {id:4471,name:'大和自動車工業',seg:'自動車',plan:'エンタープライズ',\n   term:'2025/10/1 - 2026/9/30',days:45,seats:5120,seatCap:6000,contractSet:true,\n   lic:{cap:3000,term:'2026/4/1 - 2027/3/31',days:227,sync:false,\n        trend:[2810,3120,3340,3510,3620,3480,3390,3550,3720,3820,3660],\n        hist:['2,180 / 3,000（超過0）','2,760 / 3,000（超過2）']},children:[]},\n  {id:2210,name:'東海マテリアル',seg:'素材',plan:'エンタープライズ',\n   term:'2025/12/1 - 2026/11/10',days:86,seats:980,seatCap:1200,contractSet:true,\n   lic:{cap:1000,term:'2025/12/1 - 2026/11/10',days:86,sync:true,\n        trend:[1180,1420,1660,1810,1950,2040,2110,2180,2240],\n        hist:['840 / 1,000（超過0）','1,120 / 1,000（超過6）']},children:[]},\n  {id:3311,name:'三葉重工業',seg:'重工',plan:'エンタープライズ',\n   term:'2025/12/1 - 2026/10/31',days:76,seats:2100,seatCap:2600,contractSet:true,\n   lic:{cap:1000,term:'2025/12/1 - 2026/10/31',days:76,sync:true,\n        trend:[680,640,610,590,620,600,580,640,660,630],\n        hist:['720 / 1,000（超過0）','690 / 1,000（超過0）']},children:[]},\n  {id:5502,name:'関西エレクトロニクス',seg:'電機',plan:'エンタープライズ',\n   term:'2026/1/1 - 2027/1/31',days:168,seats:8600,seatCap:9500,contractSet:true,\n   lic:{cap:5000,term:'2026/1/1 - 2027/1/31',days:168,sync:true,\n        trend:[4210,4480,4890,5180,4960,4870,5090],\n        hist:['3,900 / 5,000（超過0）','4,410 / 5,000（超過1）']},children:[]},\n  {id:3390,name:'九州インダストリー',seg:'製造',plan:'エンタープライズ',\n   term:'2026/1/1 - 2026/12/31',days:137,seats:3900,seatCap:4500,contractSet:true,\n   lic:{cap:4000,term:'2026/1/1 - 2026/12/31',days:137,sync:true,\n        trend:[980,1050,1120,1180,1090,1140,1210,1160],\n        hist:['1,880 / 4,000（超過0）','1,450 / 4,000（超過0）']},children:[]},\n  {id:12,name:'{Acme}',seg:'—',plan:'デフォルト',term:'2025/4/1 - 2026/1/31',days:-197,\n   seats:100,seatCap:1000,contractSet:true,lic:null,\n   children:[{id:2,name:'{Acme 2}',plan:'デフォルト',seats:1001,seatCap:1000,mau:null}]},\n  {id:25,name:'Academy Demo',seg:'—',plan:'デフォルト',term:'2026/4/1 - 2027/3/31',days:227,\n   seats:30001,seatCap:30000,contractSet:true,lic:null,children:[]},\n];\n\nconst n=v=>v.toLocaleString('ja-JP');\nconst yen=v=>'¥'+v.toLocaleString('ja-JP');\nconst pct=(a,b)=>Math.round(a/b*1000)/10;\nconst $=id=>document.getElementById(id);\n\nfunction derive(o){\n  const seatOver=o.seats>o.seatCap;\n  if(!o.lic) return {has:false,seatOver,inWindow:o.days>=0&&o.days<=90,action:'オプション提案',tone:'none'};\n  const L=o.lic,t=L.trend,ex=t.filter(v=>v>L.cap),nEx=ex.length;\n  const mau=t[t.length-1],peak=Math.max(...t);\n  const avg=Math.round(t.reduce((a,b)=>a+b,0)/t.length);\n  const maxOver=nEx?Math.max(...ex)-L.cap:0;\n  const util=pct(avg,L.cap),idle=util<50;\n  const overTrend=nEx>=Math.ceil(t.length/2);\n  const inWindow=(o.days>=0&&o.days<=90)||(L.days>=0&&L.days<=90);\n  const tier=TIERS.find(x=>x.mau===L.cap);\n  const next=TIERS.find(x=>x.mau>=peak&&x.mau>L.cap)||null;\n  let action,tone;\n  if(idle){action='未活用フォロー';tone='idle';}\n  else if(overTrend&&!next){action='同条件更新（最上位）';tone='ok';}\n  else if(overTrend&&inWindow){action='上位提案';tone='bad';}\n  else if(overTrend){action='打診候補（監視）';tone='warn';}\n  else if(nEx>0){action='様子見';tone='warn';}\n  else{action='同条件更新';tone='ok';}\n  return {has:true,seatOver,mau,peak,avg,nEx,months:t.length,maxOver,util,idle,overTrend,inWindow,tier,next,action,tone};\n}\n\n/* warning icon + its tooltip payload */\nfunction wico(html,amber){\n  return `<span class=\"wico${amber?' amber':''}\" tabindex=\"0\">!<span class=\"wtip\">${html}<\/span><\/span>`;\n}\n\nlet q='',open=new Set([6382]);\n\nfunction render(){\n  const list=ORGS.filter(o=>!q||o.name.includes(q));\n  let html='';\n  list.forEach(o=>{\n    const d=derive(o),kids=o.children.length>0,isOpen=open.has(o.id);\n\n    /* 従業員数 / 定員 */\n    const seatCell=`<div class=\"cell ${d.seatOver?'bad':''}\">\n      <span class=\"val\">${n(o.seats)} / ${n(o.seatCap)}<\/span>\n      ${d.seatOver?wico(`<b>契約定員を超過しています<\/b><br>従業員数 ${n(o.seats)} 名に対し、契約定員は ${n(o.seatCap)} 名です（<b>${n(o.seats-o.seatCap)} 名超過<\/b>）。<br>定員の見直しまたは契約変更の手続きが必要です。`):''}<\/div>`;\n\n    /* 契約期間 */\n    const ctExp=o.days<0, ctSoon=o.days>=0&&o.days<=90;\n    const ctCell=!o.contractSet\n      ? `<span class=\"setlink\"><span class=\"muted-chip\">未設定<\/span><a class=\"link\">設定する<\/a><\/span>`\n      : `<div class=\"cell ${ctExp?'bad':''}\"><span class=\"val\">${o.term}<\/span>\n         ${ctExp?wico(`<b>契約期間が終了しています<\/b><br>${o.term.split(' - ')[1]} に契約期間が満了しました。更新手続きが未完了です。`):''}<\/div>\n         ${ctSoon?`<span class=\"sub soon\">更新まで ${o.days} 日<\/span>`:''}`;\n\n    /* E-learning MAU：超過月数 / 経過月数 のみ */\n    const mauCell=!d.has\n      ? `<span class=\"muted\">未契約　<a class=\"link\">提案する<\/a><\/span>`\n      : `<div class=\"cell ${d.nEx?'bad':''}\">\n          <span class=\"val\">${d.nEx} / ${d.months} ヶ月<\/span>\n          ${d.nEx?wico(`<b>契約MAUを超過した月があります<\/b><br>経過 ${d.months} ヶ月のうち <b>${d.nEx} ヶ月<\/b>で契約MAU ${n(o.lic.cap)} を超過しました。<br>最大超過幅 <b>${n(d.maxOver)} MAU<\/b>（当月 ${n(d.mau)} MAU）。<br><br>契約期間中の追加請求・利用制限は発生しません。更新時のプラン見直し対象です。`,true):''}\n          ${!d.nEx&&d.idle?wico(`<b>契約枠が大きく未消化です<\/b><br>平均 ${n(d.avg)} MAU ／ 契約 ${n(o.lic.cap)} MAU（活用率 <b>${d.util}%<\/b>）。<br>更新時に減額・解約を打診されるリスクがあります。`,true):''}\n         <\/div>\n         <span class=\"sub\">超過月数 / 経過月数<\/span>`;\n\n    /* ライセンス期間 */\n    const lcSoon=d.has&&o.lic.days>=0&&o.lic.days<=90;\n    const licCell=!d.has\n      ? `<span class=\"muted\">—<\/span>`\n      : `<div class=\"cell ${!o.lic.sync?'bad':''}\"><span class=\"val\">${o.lic.term}<\/span>\n         ${!o.lic.sync?wico(`<b>契約期間と一致していません<\/b><br>契約：${o.term}<br>ライセンス：${o.lic.term}<br><br>契約が先に終了するため、契約終了後のE-learning利用可否について確認が必要です。`):''}<\/div>\n         ${lcSoon?`<span class=\"sub soon\">更新まで ${o.lic.days} 日<\/span>`:''}`;\n\n    html+=`<tr class=\"parent\" data-o=\"${o.id}\">\n      <td>${kids?`<button class=\"exp ${isOpen?'open':''}\" data-x=\"${o.id}\"><svg viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg><\/button>`:''}<\/td>\n      <td class=\"num\">${o.id}<\/td>\n      <td><div class=\"orgcell\"><span class=\"sq\"><\/span><span>${kids?'<span class=\"otop\">親テナント<\/span>':''}<a class=\"onamelink\" href=\"skill-hub-sysadmin-org-detail.html?org=${o.id}\">${o.name}<\/a><\/span><\/div><\/td>\n      <td>${o.plan}<\/td>\n      <td>${seatCell}<\/td>\n      <td>${ctCell}<\/td>\n      <td>${mauCell}<\/td>\n      <td>${licCell}<\/td>\n      <td style=\"text-align:right\"><button class=\"icobtn\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"4.5\" r=\"1.3\"/><circle cx=\"10\" cy=\"10\" r=\"1.3\"/><circle cx=\"10\" cy=\"15.5\" r=\"1.3\"/><\/svg><\/button><\/td><\/tr>`;\n\n    if(isOpen) o.children.forEach(c=>{\n      const cOver=c.seats>c.seatCap;\n      html+=`<tr class=\"child\"><td><\/td><td class=\"num\">${c.id}<\/td>\n        <td><div class=\"orgcell\" style=\"padding-left:18px\"><span class=\"arrow\">↳<\/span><span class=\"sq\"><\/span>\n          <span><span class=\"otop\">${o.name}の子テナント<\/span><span class=\"oname\">${c.name}<\/span><\/span><\/div><\/td>\n        <td>${c.plan}<\/td>\n        <td><div class=\"cell ${cOver?'bad':''}\"><span class=\"val\">${n(c.seats)} / ${n(c.seatCap)}<\/span>\n          ${cOver?wico(`<b>契約定員を超過しています<\/b><br>従業員数 ${n(c.seats)} 名に対し、契約定員は ${n(c.seatCap)} 名です（<b>${n(c.seats-c.seatCap)} 名超過<\/b>）。`):''}<\/div><\/td>\n        <td class=\"muted\">親組織の契約に含む<\/td>\n        <td class=\"muted\" style=\"font-size:12px\">${c.mau!==null?`当月 ${n(c.mau)} MAU`:'—'}<\/td>\n        <td class=\"muted\">親組織のライセンス<\/td>\n        <td><\/td><\/tr>`;\n    });\n  });\n  $('tbody').innerHTML=html||`<tr><td colspan=\"9\" style=\"padding:38px;text-align:center;color:var(--text-3)\">該当する組織がありません<\/td><\/tr>`;\n  $('count').textContent=`表示 1-${list.length}/${list.length}`;\n\n  document.querySelectorAll('.exp').forEach(b=>b.addEventListener('click',e=>{\n    e.stopPropagation();const i=+b.dataset.x;open.has(i)?open.delete(i):open.add(i);render();\n  }));\n  document.querySelectorAll('tr.parent').forEach(tr=>tr.addEventListener('click',()=>{location.href='skill-hub-sysadmin-org-detail.html?org='+tr.dataset.o;}));\n  bindTips();\n}\n\n/* ---------- body-level tooltip (never clipped by the table) ---------- */\nconst gtip=$('gtip'),TIP_W=300,GAP=10,EDGE=12;\nfunction gtipArrow(ax){\n  let s=document.getElementById('gtip-arrow');\n  if(!s){s=document.createElement('style');s.id='gtip-arrow';document.head.appendChild(s);}\n  s.textContent=`#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(el){\n  const src=el.querySelector('.wtip');if(!src)return;\n  gtip.innerHTML=src.innerHTML;gtip.classList.add('on');gtip.style.width=TIP_W+'px';\n  const r=el.getBoundingClientRect();\n  let left=Math.max(EDGE,Math.min(r.left+r.width/2-TIP_W/2,window.innerWidth-TIP_W-EDGE));\n  const h=gtip.offsetHeight,above=r.top-GAP-h>=60;\n  gtip.style.left=left+'px';\n  gtip.style.top=(above?r.top-GAP-h:r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above);gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12,Math.min(r.left+r.width/2-left-4.5,TIP_W-21)));\n}\nfunction hideTip(){gtip.classList.remove('on');}\nfunction bindTips(){\n  document.querySelectorAll('.wico').forEach(el=>{\n    el.addEventListener('mouseenter',()=>showTip(el));\n    el.addEventListener('mouseleave',hideTip);\n    el.addEventListener('focus',()=>showTip(el));\n    el.addEventListener('blur',hideTip);\n    el.addEventListener('click',e=>e.stopPropagation());\n  });\n}\nwindow.addEventListener('scroll',hideTip,true);\nwindow.addEventListener('resize',hideTip);\n\ndocument.querySelectorAll('#utabs button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#utabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');\n}));\n$('q').addEventListener('input',e=>{q=e.target.value.trim();render();});\n$('navToggle').addEventListener('click',()=>document.body.classList.toggle('nav-collapsed'));\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "detail": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=1440\" />\n<title>Skill Hub — {ACME}（Eラーニングライセンス）<\/title>\n<style>\n  :root{\n    --line:#e5e9f0; --line-strong:#cbd3e0;\n    --text:#0f172a; --text-2:#4b5565; --text-3:#7c8698;\n    --brand:#2563eb; --brand-weak:#eaf1fe;\n    --ok:#0d8a5f; --ok-weak:#e8f6f0;\n    --warn:#b45309; --warn-weak:#fef4e6;\n    --danger:#d92d20; --danger-weak:#fdeceb;\n    --idle:#6b4a9e; --idle-weak:#f4effb;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{background:#fff;color:var(--text);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;\n    font-family:\"Inter\",\"Helvetica Neue\",Arial,\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Noto Sans JP\",\"Yu Gothic UI\",\"Meiryo\",sans-serif;}\n  .num{font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\";}\n\n  .shell{display:flex;min-height:100vh;}\n  .side{width:256px;flex:none;background:#fff;border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:transform .18s;}\n  .side-brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 18px;}\n  .side-brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ef4a3c,#c8362d);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none;}\n  .side-brand .nm{font-weight:700;font-size:15.5px;}\n  .navgrp{margin-top:14px;}\n  .navgrp .gl{font-size:11px;color:var(--text-3);font-weight:600;padding:0 18px 7px;border-bottom:1px solid var(--line);margin-bottom:6px;}\n  .nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text-2);text-decoration:none;}\n  .nav a:hover{background:#f5f7fa;}\n  .nav a.active{background:var(--brand-weak);color:var(--brand);font-weight:650;}\n  .nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}\n\n  .main{flex:1;min-width:0;margin-left:256px;transition:margin-left .18s;}\n  .hdr{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;}\n  .toggle{width:32px;height:32px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none;}\n  .toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;}\n  .hdr .vr{width:1px;height:22px;background:var(--line);}\n  .crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2);}\n  .crumb a{color:var(--text-2);text-decoration:none;}\n  .crumb a:hover{color:var(--brand);}\n  .crumb .sep{color:var(--line-strong);}\n  .crumb .cur{color:var(--text);font-weight:650;}\n  .hdr .spacer{flex:1;}\n  .prof{width:34px;height:34px;border-radius:50%;background:var(--brand-weak);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);}\n  body.nav-collapsed .side{transform:translateX(-256px);}\n  body.nav-collapsed .main{margin-left:0;}\n\n  /* Gutters match the customer page (Eラーニング MAU 利用状況): the wide side\n     margins come from the 1240px max-width + auto centring, not the padding. */\n  .wrap{max-width:1240px;margin:0 auto;padding:24px 24px 88px;}\n\n  .orgcard{border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;align-items:flex-start;gap:18px;margin-bottom:22px;}\n  .avatar{width:88px;height:88px;border-radius:10px;background:#1c2333;display:grid;place-items:center;flex:none;color:#c9e265;font-size:30px;font-weight:700;}\n  .oc-b{flex:1;min-width:0;}\n  .oc-top{font-size:11.5px;color:var(--text-3);}\n  .oc-name{display:flex;align-items:center;gap:10px;margin:1px 0 3px;}\n  .oc-name h1{font-size:21px;margin:0;letter-spacing:-.01em;}\n  .planbadge{font-size:11.5px;font-weight:600;background:#f1f4f8;border:1px solid #e0e6ee;color:var(--text-2);border-radius:6px;padding:2px 10px;}\n  .oc-desc{font-size:11.5px;color:var(--text-3);}\n  .oc-meta{display:flex;align-items:center;gap:20px;margin-top:9px;font-size:12.5px;color:var(--text-2);}\n  .oc-meta span{display:inline-flex;align-items:center;gap:7px;}\n  .oc-meta svg{width:16px;height:16px;stroke:var(--ok);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}\n  .oc-meta .lnk svg{stroke:var(--text-3);}\n  .oc-act{display:flex;gap:9px;flex:none;}\n\n  .btn{font:inherit;font-size:13.5px;border:1px solid var(--line-strong);background:#fff;color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;}\n  .btn:hover{background:#f7f9fc;}\n  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}\n  .btn-primary:hover{background:#1d4fd0;}\n  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}\n  .btn-icon{padding:10px 12px;}\n  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}\n  .btn-danger{color:var(--danger);border-color:#f5c6c3;}\n  .btn-danger:hover{background:var(--danger-weak);}\n\n  .pills{display:flex;gap:6px;margin-bottom:22px;}\n  .pills button{font:inherit;font-size:14px;font-weight:650;border:none;background:none;color:var(--text-2);padding:11px 20px;border-radius:9px;cursor:pointer;}\n  .pills button:hover{background:#f4f6fa;}\n  .pills button.on{background:var(--brand-weak);color:var(--brand);}\n\n  .card{border:1px solid var(--line);border-radius:12px;}\n  .card-h{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}\n  .card-h h2{font-size:13.5px;margin:0;font-weight:700;}\n  .card-h .hint{font-size:11.5px;color:var(--text-3);font-weight:400;}\n  .card-b{padding:17px;}\n  .section{margin-bottom:20px;}\n\n  /* licence identity header */\n  .lichead{border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;}\n  .lichead .nm{font-size:16px;font-weight:700;}\n  .lichead .meta{font-size:11.5px;color:var(--text-3);margin-top:1px;}\n  .lichead .sp{flex:1;}\n  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 10px;letter-spacing:.02em;}\n  .tag-basic{background:#eef1f6;color:var(--text-2);border:1px solid #dde3ec;}\n  .tag-adv{background:var(--brand-weak);color:var(--brand);border:1px solid #cfe0fd;}\n\n  .tiles{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:11px;margin-bottom:20px;}\n  .tiles.c4{grid-template-columns:repeat(4,1fr);}\n  .tiles.c3{grid-template-columns:repeat(3,1fr);}\n  .tiles .tl{padding:13px 16px;border-right:1px solid var(--line);}\n  .tiles .tl:last-child{border-right:none;}\n  .tiles .k{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:3px;display:flex;align-items:center;}\n\n  /* info icon + body-level tooltip */\n  .info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;\n    border:1px solid var(--line-strong);color:var(--text-3);font-size:9.5px;font-weight:700;\n    cursor:help;margin-left:5px;background , months:12, avg:1120, ex:6, peak:1290}]},\n    children:[]},\n\n  3311:{name:'三葉重工業', plan:'エンタープライズ', initials:'三葉',\n    desc:'重工 &gt; 産業機械・プラント', sso:true, lms:false,\n    contract:{term:'2025/12/1 - 2026/10/31', days:76, seats:2100, seatCap:2600},\n    lic:{name:'技術部門向けEラーニング', plan:'Basic', cap:1000,\n         term:'2025/12/1 - 2026/10/31', end:'2026/10/31', days:76, sync:true,\n         pool:2600, elapsed:10, created:'2025/11/14',\n         trend:[680,640,610,590,620,600,580,640,660,630],\n         past:[{term:'2023/12/1 - 2024/11/30', cap:1000, months:12, avg:720, ex:0, peak:810},\n               {term:'2024/12/1 - 2025/11/30', cap:1000, months:12, avg:690, ex:0, peak:780}]},\n    children:[]},\n\n  5502:{name:'関西エレクトロニクス', plan:'エンタープライズ', initials:'関エ',\n    desc:'電機 &gt; 半導体・電子デバイス', sso:true, lms:true,\n    contract:{term:'2026/1/1 - 2027/1/31', days:168, seats:8600, seatCap:9500},\n    lic:{name:'半導体エンジニア育成', plan:'Advanced', cap:5000,\n         term:'2026/1/1 - 2027/1/31', end:'2027/1/31', days:168, sync:true,\n         pool:9500, elapsed:7, created:'2025/12/18',\n         trend:[4210,4480,4890,5180,4960,4870,5090],\n         past:[{term:'2024/1/1 - 2024/12/31', cap:4000, months:12, avg:3900, ex:5, peak:4310},\n               {term:'2025/1/1 - 2025/12/31', cap:5000, months:12, avg:4410, ex:1, peak:5050}]},\n    children:[]},\n\n  3390:{name:'九州インダストリー', plan:'エンタープライズ', initials:'九イ',\n    desc:'製造業 &gt; 産業装置', sso:false, lms:false,\n    contract:{term:'2026/1/1 - 2026/12/31', days:137, seats:3900, seatCap:4500},\n    lic:{name:'全社リスキリング基盤', plan:'Basic', cap:4000,\n         term:'2026/1/1 - 2026/12/31', end:'2026/12/31', days:137, sync:true,\n         pool:4500, elapsed:8, created:'2025/12/09',\n         trend:[980,1050,1120,1180,1090,1140,1210,1160],\n         past:[{term:'2024/1/1 - 2024/12/31', cap:4000, months:12, avg:1880, ex:0, peak:2100},\n               {term:'2025/1/1 - 2025/12/31', cap:4000, months:12, avg:1450, ex:0, peak:1690}]},\n    children:[]},\n\n  12:{name:'{Acme}', plan:'デフォルト', initials:'Ac',\n    desc:'—', sso:false, lms:false,\n    contract:{term:'2025/4/1 - 2026/1/31', days:-197, seats:100, seatCap:1000},\n    lic:null, children:[]},\n\n  25:{name:'Academy Demo', plan:'デフォルト', initials:'AD',\n    desc:'—', sso:false, lms:false,\n    contract:{term:'2026/4/1 - 2027/3/31', days:227, seats:30001, seatCap:30000},\n    lic:null, children:[]},\n};\n\nconst qs=new URLSearchParams(window.__QS||location.search);\nconst ORG_ID=REGISTRY[qs.get('org')]?qs.get('org'):'8801';\nconst ORG=REGISTRY[ORG_ID];\nconst PRISTINE=JSON.parse(JSON.stringify(ORG.lic));\nlet LIC = ORG.lic ? JSON.parse(JSON.stringify(ORG.lic)) : null;   // null === 未設定\nconst ML=['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];\nconst MF=['2026年4月','2026年5月','2026年6月','2026年7月','2026年8月','2026年9月','2026年10月',\n          '2026年11月','2026年12月','2027年1月','2027年2月','2027年3月'];\nconst n=v=>v.toLocaleString('ja-JP');\nconst pct=(a,b)=>Math.round(a/b*1000)/10;\nconst $=id=>document.getElementById(id);\n\nfunction stats(){\n  const T=LIC.trend, CAP=LIC.cap;\n  const ex=T.filter(v=>v>CAP), nEx=ex.length;\n  const mau=T[T.length-1], peak=Math.max(...T), peakM=ML[T.indexOf(peak)];\n  const avg=Math.round(T.reduce((a,b)=>a+b,0)/T.length);\n  const maxOver=nEx?Math.max(...ex)-CAP:0;\n  const util=pct(avg,CAP);\n  return {T,CAP,nEx,mau,peak,peakM,avg,maxOver,util,idle:util<50};\n}\nconst info=html=>`<span class=\"info\" tabindex=\"0\">?<span class=\"tip\">${html}<\/span><\/span>`;\nconst planTag=p=>p==='Advanced'\n  ? '<span class=\"tag tag-adv\">Advanced<\/span>'\n  : '<span class=\"tag tag-basic\">Basic<\/span>';\n\n/* ---------- empty state ---------- */\nfunction viewEmpty(){\n  return `<div class=\"empty\">\n    <div class=\"ei\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 6.5A2.5 2.5 0 016.5 4H19v13H6.5A2.5 2.5 0 004 19.5z\"/><path d=\"M4 19.5A2.5 2.5 0 016.5 17H19v3H6.5A2.5 2.5 0 014 19.5z\"/><path d=\"M9 9h6\"/><\/svg><\/div>\n    <h3>Eラーニングライセンスが設定されていません<\/h3>\n    <p>この組織ではEラーニング機能をご利用いただけません。\n      ライセンス名・プラン・有効な期限・ライセンス数を設定すると、対象コースの受講とMAU実績の記録が開始されます。<\/p>\n    <button class=\"btn btn-primary\" onclick=\"openSheet('new')\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"M10 4.5v11M4.5 10h11\"/><\/svg>Eラーニングライセンスを新規作成する<\/button>\n  <\/div>`;\n}\n\n/* ---------- configured state ---------- */\nfunction viewEl(){\n  if(!LIC) return viewEmpty();\n  const s=stats(), CAP=s.CAP, T=s.T;\n  const H=180, CMAX=Math.max(CAP*1.28, s.peak*1.1);\n  const ys=[0,Math.round(CMAX/4),Math.round(CMAX/2),Math.round(CMAX*3/4),Math.round(CMAX)]\n    .map(v=>`<span style=\"top:${H-v/CMAX*H}px\">${n(v)}<\/span>`).join('');\n  const bars=ML.slice(0,LIC.elapsed).map((lab,i)=>{\n    const v=T[i], ov=v>CAP, c=ov?'#e0a03a':'#2563eb';\n    const now=i===LIC.elapsed-1;\n    return `<div class=\"bcol${now?' now':''}\">\n      <div class=\"bar\" style=\"height:${Math.max(v/CMAX*H,3)}px;background:${c}\">\n        ${ov?`<span class=\"bflag\">+${n(v-CAP)}<\/span>`:''}\n        <span class=\"bval\" style=\"color:${c}\">${n(v)}<\/span><\/div>\n      <span class=\"bx\">${lab}${now?' ●':''}<\/span><\/div>`;\n  }).join('');\n  const rows=MF.slice(0,LIC.elapsed).map((lab,i)=>{\n    const v=T[i], ov=v>CAP;\n    return `<tr class=\"${ov?'ex':''}\"><td>${lab}${i===LIC.elapsed-1?' <span style=\"font-size:10px;color:var(--brand);font-weight:700\">当月<\/span>':''}<\/td>\n      <td class=\"r num\"><b>${n(v)}<\/b><\/td><td class=\"r num\">${n(CAP)}<\/td>\n      <td class=\"r num ${ov?'bad':''}\">${pct(v,CAP)}%<\/td><\/tr>`;\n  }).join('');\n  /* NOTE for engineering: `past[]` keeps each contract term with the cap that\n     applied to it. The MVP UI does not render a cross-term comparison, but the\n     cap MUST be stored per term — otherwise raising it at renewal silently\n     re-judges every earlier month. */\n  const kidTot=ORG.children.reduce((a,c)=>a+c.mau,0);\n  const kidsSorted=[...ORG.children].sort((x,y)=>y.mau-x.mau);\n  const kids=kidsSorted.map(c=>{\n    const share=pct(c.mau,kidTot||1);\n    return `<tr><td>${c.name}<\/td>\n      <td class=\"r num\"><b>${n(c.mau)}<\/b><\/td>\n      <td><div class=\"sharecell\">\n        <span class=\"mini\"><span style=\"width:${share}%;background:var(--brand)\"><\/span><\/span>\n        <span class=\"pv\">${share}%<\/span><\/div><\/td><\/tr>`;\n  }).join('');\n\n  const alert = !LIC.sync\n    ? `<div class=\"alert a-bad\"><div class=\"ico\">!<\/div><div><h3>契約期間とライセンス期間が一致していません<\/h3>\n        <p>契約：${ORG.contract.term} ／ ライセンス：${LIC.term}。契約終了後のEラーニング利用可否について確認が必要です。<\/p><\/div><\/div>`\n    : s.nEx ? `<div class=\"alert a-warn\"><div class=\"ico\">!<\/div><div>\n        <h3>契約MAUを超過した月があります（${s.nEx} / ${LIC.elapsed} ヶ月）<\/h3>\n        <p>最大超過幅 <b>${n(s.maxOver)} MAU<\/b>（${s.peakM}・${n(s.peak)} MAU）。<\/p><\/div><\/div>` : '';\n\n  return `\n  ${alert}\n\n  <div class=\"lichead\">\n    <div>\n      <div class=\"nm\">${LIC.name}<\/div>\n      <div class=\"meta\">有効な期限 ${LIC.term}（更新まで <b class=\"num\">${LIC.days}<\/b> 日）　／　作成 ${LIC.created}<\/div>\n    <\/div>\n    ${planTag(LIC.plan)}\n    <span class=\"sp\"><\/span>\n    <button class=\"btn btn-sm\" onclick=\"openSheet('edit')\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"M13.5 3.6l2.9 2.9L7.9 15H5v-2.9z\"/><\/svg>ライセンスを編集<\/button>\n  <\/div>\n\n  <div class=\"tiles c3\">\n    <div class=\"tl\"><div class=\"k\">ライセンス数（契約MAU）${info('契約時に設定したMAU数です。<br><br><b>利用を停止する上限ではありません。<\/b>超過しても受講は継続でき、契約期間中の追加請求も発生しません。')}<\/div>\n      <div class=\"v num\">${n(CAP)}<small>MAU<\/small><\/div>\n      <div class=\"s\">プラン ${LIC.plan}<\/div><\/div>\n    <div class=\"tl\"><div class=\"k\">当月MAU（2026年8月）${info('<b>MAU＝当月内に対象コンテンツを1つ以上受講したユニークユーザー数<\/b><br>・同一ユーザーが何コース受講しても <b>1 MAU<\/b><br>・カウントは<b>月次でリセット<\/b>されます<br>・自社オリジナル／サードパーティコンテンツは対象外')}<\/div>\n      <div class=\"v num\" style=\"color:${s.mau>CAP?'var(--warn)':'var(--brand)'}\">${n(s.mau)}<\/div>\n      <div class=\"s\">契約比 ${pct(s.mau,CAP)}%<\/div><\/div>\n    <div class=\"tl\"><div class=\"k\">平均活用率${info('経過月の平均MAU ÷ ライセンス数。<br><br>低い場合はライセンス枠が過大であり、更新時に減額・解約を打診されるリスクがあります。高い場合は上位ラダーの検討対象です。')}<\/div>\n      <div class=\"v num\" style=\"color:${s.idle?'var(--idle)':s.util>100?'var(--warn)':'var(--ok)'}\">${s.util}%<\/div>\n      <div class=\"s\">平均 ${n(s.avg)} MAU<\/div><\/div>\n  <\/div>\n\n  <div class=\"card section\">\n    <div class=\"card-h\"><h2>月次MAU推移<\/h2><\/div>\n    <div class=\"card-b\">\n      <div class=\"chart\"><div class=\"chart-y\">${ys}<\/div>\n        <div class=\"chart-plot\"><div class=\"rline\" style=\"top:${H-CAP/CMAX*H}px\"><span>ライセンス数 ${n(CAP)}<\/span><\/div>\n        <div class=\"bars\">${bars}<\/div><\/div><\/div>\n      <div class=\"legend\">\n        <span><i style=\"background:#2563eb\"><\/i>ライセンス数以内<\/span>\n        <span><i style=\"background:#e0a03a\"><\/i>ライセンス数超過<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card section\">\n    <div class=\"card-h\"><h2>月次明細<\/h2><button class=\"btn btn-sm\">CSV出力<\/button><\/div>\n    <table><thead><tr>\n      <th style=\"width:34%\">対象月<\/th><th class=\"r\" style=\"width:22%\">当月MAU<\/th>\n      <th class=\"r\" style=\"width:22%\">ライセンス数<\/th><th class=\"r\" style=\"width:22%\">契約比<\/th>\n    <\/tr><\/thead><tbody>${rows}<\/tbody><\/table>\n  <\/div>\n\n  ${!ORG.children.length?'':`<div class=\"card section\">\n    <div class=\"card-h\"><h2>子組織別 利用状況<\/h2>\n      <span class=\"hint\">当月MAUの多い順　／　合計 ${n(kidTot)} MAU<\/span><\/div>\n    <table><thead><tr>\n      <th style=\"width:40%\">子組織<\/th><th class=\"r\" style=\"width:16%\">当月MAU<\/th>\n      <th style=\"width:44%\">構成比（当月MAU）<\/th>\n    <\/tr><\/thead><tbody>${kids}<\/tbody><\/table>\n  <\/div>`}\n  ${ORG.children.length?'':`<div class=\"card section\"><div class=\"card-h\"><h2>子組織別 利用状況<\/h2><\/div>\n    <div class=\"card-b\" style=\"color:var(--text-3);font-size:12.5px;padding:26px;text-align:center\">\n      子テナントが設定されていません。ライセンス数 ${n(CAP)} MAU はすべて本組織で利用されます。<\/div><\/div>`}`;\n}\n\nfunction viewCt(){\n  const c=ORG.contract, over=c.seats>c.seatCap;\n  return `<div class=\"tiles\" style=\"grid-template-columns:repeat(4,1fr)\">\n      <div class=\"tl\"><div class=\"k\">プラン<\/div><div class=\"v\" style=\"font-size:17px;padding-top:3px\">${ORG.plan}<\/div><div class=\"s\">親テナント<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">従業員数 / 定員<\/div><div class=\"v num\" style=\"${over?'color:var(--danger)':''}\">${n(c.seats)}<small>/ ${n(c.seatCap)}<\/small><\/div><div class=\"s\">${over?'定員超過':'定員内'}<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">契約期間<\/div><div class=\"v\" style=\"font-size:14px;padding-top:5px\">${c.term}<\/div><div class=\"s\">更新まで ${c.days} 日<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">オプション<\/div>\n        <div class=\"v\" style=\"font-size:15px;padding-top:4px\">${LIC?'Eラーニング':'なし'}<\/div>\n        <div class=\"s\">${LIC?`${LIC.name}（${LIC.plan}）`:'未設定'}<\/div><\/div>\n    <\/div>\n    <div class=\"placeholder\">契約タブの詳細（プラン変更履歴・請求・管理者・SSO設定など）は別途設計します。<\/div>`;\n}\n\nfunction renderHeader(){\n  $('oAvatar').textContent=ORG.initials;\n  $('oName').textContent=ORG.name;\n  $('oPlan').textContent=ORG.plan;\n  $('oDesc').innerHTML=ORG.desc;\n  $('oTop').textContent=ORG.children.length?'親テナント':'テナント';\n  $('oMeta').innerHTML=\n    (ORG.sso?`<span><svg viewBox=\"0 0 20 20\"><path d=\"M10 2.6l6 2.1v5c0 3.9-2.5 6.5-6 7.7-3.5-1.2-6-3.8-6-7.7v-5z\"/><path d=\"M7.6 10.2l1.7 1.7 3.3-3.4\"/><\/svg>SAML設定済・SSO必須<\/span>`:'')\n   +(ORG.lms?`<span class=\"lnk\"><svg viewBox=\"0 0 20 20\"><path d=\"M8.4 11.6a3 3 0 004.3 0l2.6-2.6a3 3 0 10-4.3-4.3l-.9.9\"/><path d=\"M11.6 8.4a3 3 0 00-4.3 0l-2.6 2.6a3 3 0 104.3 4.3l.9-.9\"/><\/svg>LMS連携済<\/span>`:'')\n   ||`<span style=\"color:var(--text-3)\">連携設定なし<\/span>`;\n  document.querySelector('.crumb .cur').textContent=ORG.name.replace(/[{}]/g,'');\n  document.title=`Skill Hub — ${ORG.name}（Eラーニングライセンス）`;\n  $('dbCap').textContent=`${ORG.name}　／　組織を切り替えるには関連会社一覧から選択`;\n}\n\n/* body-level tooltip — cannot be clipped by cards or tables */\nconst gtip=document.createElement('div'); gtip.id='gtip'; document.body.appendChild(gtip);\nconst TIP_W=300, GAP=10, EDGE=12;\nfunction gtipArrow(ax){\n  let s=document.getElementById('gtip-arrow');\n  if(!s){s=document.createElement('style');s.id='gtip-arrow';document.head.appendChild(s);}\n  s.textContent=`#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(el){\n  const src=el.querySelector('.tip'); if(!src) return;\n  gtip.innerHTML=src.innerHTML; gtip.classList.add('on'); gtip.style.width=TIP_W+'px';\n  const r=el.getBoundingClientRect();\n  const left=Math.max(EDGE,Math.min(r.left+r.width/2-TIP_W/2,window.innerWidth-TIP_W-EDGE));\n  const h=gtip.offsetHeight, above=r.top-GAP-h>=60;\n  gtip.style.left=left+'px';\n  gtip.style.top=(above?r.top-GAP-h:r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above); gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12,Math.min(r.left+r.width/2-left-4.5,TIP_W-21)));\n}\nconst hideTip=()=>gtip.classList.remove('on');\nfunction bindTips(){\n  document.querySelectorAll('.info').forEach(el=>{\n    el.addEventListener('mouseenter',()=>showTip(el));\n    el.addEventListener('mouseleave',hideTip);\n    el.addEventListener('focus',()=>showTip(el));\n    el.addEventListener('blur',hideTip);\n  });\n}\nwindow.addEventListener('scroll',hideTip,true);\nwindow.addEventListener('resize',hideTip);\n\nfunction render(){\n  const t=document.querySelector('#pills button.on').dataset.t;\n  $('view').innerHTML = t==='el' ? viewEl() : viewCt();\n  bindTips();\n}\n\n/* ---------- sheet ---------- */\nlet mode='new';\nfunction openSheet(m){\n  mode=m;\n  $('shTitle').textContent = m==='new' ? 'Eラーニングライセンスを新規作成する' : 'Eラーニングライセンスを編集する';\n  $('shSave').textContent  = m==='new' ? 'Eラーニングライセンスを保存する' : '変更を保存する';\n  if(m==='edit'&&LIC){\n    $('i-name').value=LIC.name; $('i-term').value=LIC.term; $('i-num').value=LIC.cap;\n    document.querySelectorAll('input[name=plan]').forEach(r=>r.checked=r.value===LIC.plan);\n  }else{\n    $('i-name').value=''; $('i-term').value=''; $('i-num').value='';\n    document.querySelectorAll('input[name=plan]').forEach(r=>r.checked=r.value==='Basic');\n  }\n  ['f-name','f-term','f-num'].forEach(id=>$(id).classList.remove('invalid'));\n  $('sheet').classList.add('on'); $('scrim').classList.add('on');\n  setTimeout(()=>$('i-name').focus(),180);\n}\nfunction closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }\n$('shClose').addEventListener('click',closeSheet);\n$('scrim').addEventListener('click',closeSheet);\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });\n\n$('shSave').addEventListener('click',()=>{\n  const name=$('i-name').value.trim(), term=$('i-term').value.trim(), num=parseInt($('i-num').value,10);\n  let ok=true;\n  [['f-name',!name],['f-term',!term],['f-num',!(num>0)]].forEach(([id,bad])=>{\n    $(id).classList.toggle('invalid',bad); if(bad) ok=false;\n  });\n  if(!ok) return;\n  const plan=document.querySelector('input[name=plan]:checked').value;\n  if(LIC){ Object.assign(LIC,{name,plan,cap:num,term}); }\n  else{\n    LIC={name,plan,cap:num,term,end:term.split(' - ')[1]||'',days:227,sync:term===ORG.contract.term,\n         pool:ORG.contract.seatCap,elapsed:5,created:'2026/08/16',trend:[620,710,880,940,1020]};\n  }\n  closeSheet(); render();\n});\n\n/* prototype state bar */\nfunction setState(s){\n  if(s==='none'){ LIC=null; }\n  else if(!PRISTINE){\n    /* org genuinely has no licence — synthesise one so the state is viewable */\n    LIC={name:`${ORG.name} Eラーニング`,plan:'Basic',cap:1000,term:ORG.contract.term,\n         end:ORG.contract.term.split(' - ')[1],days:Math.max(ORG.contract.days,0),sync:true,\n         pool:ORG.contract.seatCap,elapsed:5,created:'2026/08/16',trend:[620,710,880,940,1020]};\n  }\n  else { LIC=JSON.parse(JSON.stringify(PRISTINE)); }\n  if(s==='diverge'&&LIC){\n    LIC.term='2026/7/1 - 2027/6/30'; LIC.end='2027/6/30'; LIC.days=318; LIC.sync=false;\n  }\n  render();\n}\ndocument.querySelectorAll('#pstate button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#pstate button').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); setState(b.dataset.s);\n}));\n\ndocument.querySelectorAll('#pills button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#pills button').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); render();\n}));\n$('navToggle').addEventListener('click',()=>document.body.classList.toggle('nav-collapsed'));\nrenderHeader();\nif(!LIC) document.querySelector('#pstate button[data-s=none]').click();\nelse render();\n<\/script>\n<\/body>\n<\/html>\n", "customer": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=1280\" />\n<title>Skill Hub — Eラーニング MAU 利用状況（親組織管理者）<\/title>\n<style>\n  :root{\n    --bg:#f4f6f9; --surface:#fff; --line:#e3e8ef; --line-strong:#cdd5e0;\n    --text:#101828; --text-2:#475467; --text-3:#79839a;\n    --brand:#2563eb; --brand-weak:#eaf1fe;\n    --ok:#0d8a5f; --ok-weak:#e8f6f0;\n    --warn:#b45309; --warn-weak:#fef4e6;\n    --danger:#c02626; --danger-weak:#fdeceb;\n    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;\n    font-family:\"Inter\",\"Helvetica Neue\",Arial,\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Noto Sans JP\",\"Yu Gothic UI\",\"Meiryo\",sans-serif;}\n  .num{font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\";}\n\n  /* ---------- App shell: sidebar + header (Givery Skill Hub DS) ---------- */\n  .shell{display:flex;min-height:100vh;}\n  .side{width:256px;flex:none;background:#fff;border-right:1px solid var(--line);\n    position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:width .18s,transform .18s;}\n  .side-brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 18px;}\n  .side-brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ef4a3c,#c8362d);\n    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none;}\n  .side-brand .nm{font-weight:700;font-size:15.5px;letter-spacing:.01em;}\n\n  .orgsw{margin:2px 12px 6px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;\n    display:flex;align-items:center;gap:9px;cursor:pointer;background:#fff;}\n  .orgsw:hover{background:#f7f9fc;}\n  .orgsw .oi{width:26px;height:26px;border-radius:6px;background:var(--brand-weak);color:var(--brand);\n    display:grid;place-items:center;flex:none;}\n  .orgsw .ot{flex:1;min-width:0;}\n  .orgsw .ot b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .orgsw .ot span{font-size:11px;color:var(--text-3);}\n  .orgsw .chev{color:var(--text-3);flex:none;}\n\n  .navgrp{margin-top:14px;}\n  .navgrp .gl{font-size:11px;color:var(--text-3);font-weight:600;padding:0 18px 7px;\n    border-bottom:1px solid var(--line);margin-bottom:6px;}\n  .nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:8px 10px;border-radius:7px;\n    font-size:13px;color:var(--text-2);text-decoration:none;}\n  .nav a:hover{background:#f5f7fa;}\n  .nav a.active{background:var(--brand-weak);color:var(--brand);font-weight:650;}\n  .nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;\n    stroke-linecap:round;stroke-linejoin:round;}\n  .nav .sub a{padding-left:38px;font-size:12.5px;}\n\n  .main{flex:1;min-width:0;margin-left:256px;transition:margin-left .18s;}\n  .hdr{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;\n    gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;}\n  .togg ><svg viewBox=\"0 0 20 20\"><rect x=\"2.3\" y=\"4.6\" width=\"15.4\" height=\"10.8\" rx=\"2\"/><path d=\"M2.3 8.4h15.4M5.4 12.2h3\"/><\/svg>ライセンス管理<\/a>\n    <\/nav>\n    <nav class=\"nav sub\">\n      <a href=\"#\" class=\"active\">Eラーニング MAU 利用状況<\/a>\n      <a href=\"#\">Coreライセンス<\/a>\n    <\/nav>\n  <\/div>\n  <div style=\"height:28px\"><\/div>\n<\/aside>\n\n<div class=\"main\">\n  <header class=\"hdr\">\n    <button class=\"toggle\" id=\"navToggle\" aria-label=\"ナビゲーションの表示切替\">\n      <svg viewBox=\"0 0 20 20\"><rect x=\"2.5\" y=\"3.5\" width=\"15\" height=\"13\" rx=\"2\"/><path d=\"M7.8 3.5v13\"/><\/svg>\n    <\/button>\n    <span class=\"vr\"><\/span>\n    <nav class=\"crumb\">\n      <span>管理・設定<\/span><span class=\"sep\">›<\/span>\n      <span>ライセンス管理<\/span><span class=\"sep\">›<\/span>\n      <span class=\"cur\">Eラーニング MAU 利用状況<\/span>\n    <\/nav>\n    <span class=\"spacer\"><\/span>\n    <div class=\"prof\" title=\"親組織管理者\">YS<\/div>\n  <\/header>\n\n<div class=\"wrap\">\n  <div class=\"page-head\">\n    <div>\n      <h1>Eラーニング MAU 利用状況<\/h1>\n      <p class=\"page-sub\">ご契約MAUに対する月次の利用実績をご確認いただけます。<\/p>\n    <\/div>\n  <\/div>\n\n  <div id=\"banner-mau\"><\/div>\n\n  <div class=\"lichead\">\n    <div>\n      <div class=\"nm\">全社向けEラーニング（2026年度）<\/div>\n      <div class=\"meta\">有効な期限 2026/04/01 – 2027/03/31（更新まで <b class=\"num\">227<\/b> 日）　／　作成 2026/03/18<\/div>\n    <\/div>\n    <span class=\"tag tag-adv\">Advanced<\/span>\n  <\/div>\n\n\n  <div class=\"kpis section\">\n    <div class=\"kpi\">\n      <div class=\"k\">ご契約MAU\n        <span class=\"info\">?<span class=\"tip\"><b>契約時にご購入いただいたMAU数<\/b>です。契約期間中は固定され、期中に変更されることはありません。<br><br>この数値は<b>利用を停止する上限ではありません<\/b>。超えても受講は継続でき、追加のご請求も発生しません。<\/span><\/span>\n      <\/div>\n      <div class=\"v num\">2,000<small>MAU<\/small><\/div>\n      <div class=\"s\">契約上のベースライン<\/div>\n    <\/div>\n    <div class=\"kpi accent\">\n      <div class=\"k\">当月MAU（2026年8月）\n        <span class=\"info\">?<span class=\"tip\"><b>MAU＝当月内に対象コンテンツを1つ以上受講したユニークユーザー数<\/b><br>・同一ユーザーが何コース・何回受講しても <b>1 MAU<\/b><br>・カウントは<b>月次でリセット<\/b>されます<br>・対象は公式Trackコース（Basic &amp; Advanced）のみ<br>・自社オリジナル／サードパーティコンテンツは対象外<\/span><\/span>\n      <\/div>\n      <div class=\"v num\" id=\"kpi-current\">—<\/div>\n      <div class=\"s\" id=\"kpi-current-sub\">—<\/div>\n    <\/div>\n    <div class=\"kpi\">\n      <div class=\"k\">平均活用率\n        <span class=\"info\">?<span class=\"tip\">経過月の平均MAU ÷ ご契約MAU。<br><br>ご契約枠に対してどれだけ活用できているかを示します。<b>低い場合は投資対効果を高める余地<\/b>があり、社内の受講促進をご検討いただけます。<\/span><\/span>\n      <\/div>\n      <div class=\"v num\" id=\"kpi-util\">—<\/div>\n      <div class=\"s\" id=\"kpi-util-sub\">—<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Current month -->\n  <div class=\"section card\">\n    <div class=\"card-h\">\n      <h2>当月の利用状況<\/h2>\n      <span class=\"hint\">2026年8月度 ／ 集計日: 2026/08/14<\/span>\n    <\/div>\n    <div class=\"card-b\">\n      <div class=\"gauge-top\">\n        <div>\n          <div class=\"gauge-read num\"><span id=\"g-current\">—<\/span><span class=\"of\">/ 2,000<\/span><span class=\"unit\">MAU<\/span><\/div>\n          <div class=\"gauge-pct\">ご契約MAU比 <b class=\"num\" id=\"g-pct\">—<\/b><\/div>\n        <\/div>\n        <div id=\"g-badge\"><\/div>\n      <\/div>\n\n      <div class=\"track-wrap\">\n        <div class=\"track\">\n          <div class=\"zone zone-over\" id=\"z-over\"><\/div>\n          <div class=\"fill\" id=\"g-fill\"><\/div>\n        <\/div>\n        <div class=\"mark cur\" id=\"m-cur\"><div class=\"lab\">当月 <span class=\"num\" id=\"m-cur-val\"><\/span><\/div><div class=\"line\"><\/div><\/div>\n        <div class=\"mark\" id=\"m-cap\"><div class=\"line\"><\/div><div class=\"sub\">ご契約MAU <b class=\"num\">2,000<\/b><br><span style=\"color:var(--text-3)\">利用制限はありません<\/span><\/div><\/div>\n      <\/div>\n\n      <div class=\"legend\">\n        <span><i style=\"background:#2563eb\"><\/i>ご契約MAU内<\/span>\n        <span><i style=\"background:#fbeacd\"><\/i>ご契約MAU超過<\/span>\n      <\/div>\n\n      <div class=\"note\">\n        <span>ℹ️<\/span>\n        <span><b>ご契約MAUは記録上の基準値であり、アクセス制限ではありません。<\/b> 超過しても受講は止まらず、契約期間中のご請求額も変わりません。月次の実績は記録され、<b>次回更新時のプラン見直しの参考<\/b>としてご活用いただけます。MAUは月次でカウントされ、翌月にリセットされます。<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Monthly record -->\n  <div class=\"section card\">\n    <div class=\"card-h\">\n      <h2>月次MAU実績<\/h2>\n      <span class=\"hint\">社内報告用にCSVでダウンロードいただけます<\/span>\n    <\/div>\n    <div class=\"card-b\">\n      <div class=\"chart\">\n        <div class=\"chart-y\" id=\"chart-y\"><\/div>\n        <div class=\"chart-plot\">\n          <div class=\"rline avg\" id=\"rl-avg\"><span>期間平均 <b id=\"rl-avg-v\"><\/b><\/span><\/div>\n          <div class=\"rline cap\" id=\"rl-cap\"><span>ご契約MAU 2,000<\/span><\/div>\n          <div class=\"bars\" id=\"chart-bars\"><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"legend\">\n        <span><i style=\"background:#2563eb\"><\/i>ご契約MAU内<\/span>\n        <span><i style=\"background:#e0a03a\"><\/i>ご契約MAU超過<\/span>\n        <span><i style=\"background:none;border-top:2px dotted #7c8ba1;height:0;border-radius:0\"><\/i>期間平均<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"card-h\" style=\"border-top:1px solid var(--line)\">\n      <h2 style=\"font-size:13px\">月次明細<\/h2>\n      <button class=\"btn btn-sm\">CSVダウンロード<\/button>\n    <\/div>\n    <table>\n      <thead><tr>\n        <th style=\"width:34%\">対象月<\/th><th class=\"r\" style=\"width:22%\">当月MAU<\/th>\n        <th class=\"r\" style=\"width:22%\">ご契約MAU<\/th><th class=\"r\" style=\"width:22%\">契約比<\/th>\n      <\/tr><\/thead>\n      <tbody id=\"month-body\"><\/tbody>\n    <\/table>\n  <\/div>\n\n  <!-- Child orgs: adoption view — share of the parent total, no target line -->\n  <div class=\"section card\">\n    <div class=\"card-h\">\n      <h2>子組織別 利用状況<\/h2>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <span class=\"hint\" id=\"child-hint\"><\/span>\n        <button class=\"btn btn-sm\">CSVダウンロード<\/button>\n      <\/div>\n    <\/div>\n    <table>\n      <thead><tr>\n        <th style=\"width:38%\">子組織<\/th>\n        <th class=\"r\" style=\"width:18%\">当月MAU<\/th>\n        <th style=\"width:44%\">構成比（当月MAU）<\/th>\n      <\/tr><\/thead>\n      <tbody id=\"child-body\"><\/tbody>\n      <tfoot><tr>\n        <td>合計（<span class=\"num\" id=\"child-count\">—<\/span>組織）<\/td>\n        <td class=\"r num\" id=\"child-total\">—<\/td>\n        <td style=\"font-weight:400;color:var(--text-3);font-size:11.5px\" id=\"child-note\">—<\/td>\n      <\/tr><\/tfoot>\n    <\/table>\n  <\/div>\n\n  <div class=\"footnotes\">\n    ＊<b>契約期間中はMAU超過による利用制限・自動プラン変更・追加請求のいずれも行いません。<\/b>月次実績は次回更新時のプラン見直しの参考としてご利用いただけます。\n  <\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"gtip\"><\/div>\n\n<div class=\"demobar\">\n  <span class=\"lbl\">Prototype state<\/span>\n  <div class=\"seg\" id=\"switcher\">\n    <button data-s=\"a\" class=\"on\">ご契約MAU内<\/button>\n    <button data-s=\"b\">単月のみ超過<\/button>\n    <button data-s=\"c\">継続的に超過<\/button>\n  <\/div>\n  <span class=\"spacer\"><\/span>\n  <span class=\"cap\">親組織管理者向け（顧客画面）　／　CS向けは別画面: skill-hub-sysadmin-renewal-review.html<\/span>\n<\/div>\n\n<script>\nconst CONTRACT_MAU = 2000, ANNUAL = 31200000;\nconst MONTH_LABELS = ['4月','5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月'];\nconst MONTH_FULL   = ['2026年4月','2026年5月','2026年6月','2026年7月','2026年8月','2026年9月','2026年10月','2026年11月','2026年12月','2027年1月','2027年2月','2027年3月'];\nconst MONTHS_ELAPSED = 5;\n\nconst ORGS = [\n  {id:'toyo',  name:'日本テクノ研修センター', code:'ORG-100301'},\n  {id:'tokyo', name:'東京本社',              code:'ORG-100302'},\n  {id:'osaka', name:'大阪支社',              code:'ORG-100303'},\n  {id:'nagoya',name:'名古屋支社',            code:'ORG-100304'},\n  {id:'kyushu',name:'九州テック株式会社',     code:'ORG-100305'},\n  {id:'global',name:'グローバル事業部',       code:'ORG-100306'},\n];\n\nconst STATES = {\n  /* 子組織MAU合計 = 親の当月MAU で一致。 */\n  a:  {current:1420, trend:[ 980,1150,1290,1360,1420],\n       per: {toyo:540, tokyo:370, osaka:225, nagoya:135, kyushu:105, global: 45}},\n  b:  {current:2150, trend:[1180,1490,1760,1980,2150],\n       per: {toyo:900, tokyo:700, osaka:215, nagoya:145, kyushu:115, global: 75}},\n  c:  {current:2450, trend:[1310,1680,2090,2280,2450],\n       per: {toyo:880, tokyo:620, osaka:380, nagoya:230, kyushu:190, global:150}},\n};\n\nlet stateKey = 'a';\n\nconst n   = v => v.toLocaleString('ja-JP');\nconst yen = v => '¥' + v.toLocaleString('ja-JP');\nconst pct = (a,b) => Math.round(a/b*1000)/10;\nconst $   = id => document.getElementById(id);\n\nfunction render(){\n  const S = STATES[stateKey], cur = S.current, over = cur > CONTRACT_MAU;\n  const seen = S.trend.slice(0, MONTHS_ELAPSED);\n  const exceeded = seen.filter(v=>v>CONTRACT_MAU);\n  const nExceed  = exceeded.length;\n  const maxOver  = nExceed ? Math.max(...exceeded) - CONTRACT_MAU : 0;\n  const peak = Math.max(...seen);\n  const avg  = Math.round(seen.reduce((x,y)=>x+y,0)/seen.length);\n  const util = pct(avg, CONTRACT_MAU);\n\n  /* KPIs */\n  $('kpi-current').textContent     = n(cur);\n  $('kpi-current-sub').textContent = `ご契約MAU比 ${pct(cur,CONTRACT_MAU)}%`;\n\n  $('kpi-util').textContent = util + '%';\n  $('kpi-util').style.color = util < 60 ? 'var(--warn)' : util > 100 ? 'var(--warn)' : 'var(--ok)';\n  $('kpi-util-sub').textContent = util < 60\n    ? `平均 ${n(avg)} MAU — 活用余地があります`\n    : util > 100 ? `平均 ${n(avg)} MAU — 枠を上回っています`\n    : `平均 ${n(avg)} MAU — 良好に活用されています`;\n\n\n  /* Banner — customer framing: no surprise, and what to plan for */\n  /* Two independent banners, each rendered on its own element and stacked\n     vertically. Only the MAU-overage banner remains. */\n  $('banner-mau').innerHTML = nExceed > 0\n    ? `<div class=\"banner bn-warn\"><div class=\"ico\">!<\/div><div>\n        <h3>契約期間中にご契約MAUを超過した月が <span class=\"num\">${nExceed}<\/span> ヶ月あります<\/h3>\n        <p>経過 <b class=\"num\">${MONTHS_ELAPSED}<\/b> ヶ月のうち <b class=\"num\">${nExceed}<\/b> ヶ月で、当月MAUがご契約MAU\n        <b class=\"num\">${n(CONTRACT_MAU)}<\/b> を上回りました。最大超過幅 <b class=\"num\">${n(maxOver)}<\/b> MAU（${MONTH_LABELS[seen.indexOf(peak)]}・${n(peak)} MAU）。<\/p>\n        <p style=\"margin-top:8px\">この傾向が続く場合、<b>次回更新時に上位プランのご提案がある可能性<\/b>があります。予算計画のご参考ください。<\/p>\n      <\/div><\/div>`\n    : '';\n\n\n  /* Gauge */\n  const SCALE = Math.max(CONTRACT_MAU*1.25, cur*1.12);\n  const p = v => (v/SCALE*100) + '%';\n  $('g-current').textContent = n(cur);\n  $('g-pct').textContent     = pct(cur,CONTRACT_MAU) + '%';\n  $('z-over').style.left = p(CONTRACT_MAU); $('z-over').style.right = '0';\n  const fill = $('g-fill');\n  fill.style.width = p(cur);\n  fill.style.background = over\n    ? `linear-gradient(90deg,#2563eb 0%,#2563eb ${CONTRACT_MAU/cur*100}%,#e0a03a ${CONTRACT_MAU/cur*100}%,#d97706 100%)`\n    : 'linear-gradient(90deg,#4b86f5,#2563eb)';\n  $('m-cap').style.left = p(CONTRACT_MAU);\n  $('m-cur').style.left = p(cur);\n  $('m-cur').classList.toggle('over', over);\n  $('m-cur-val').textContent = n(cur);\n  $('g-badge').innerHTML = over\n    ? '<span class=\"badge b-warn\"><span class=\"dot\"><\/span>ご契約MAU超過<\/span>'\n    : '<span class=\"badge b-ok\"><span class=\"dot\"><\/span>ご契約MAU内<\/span>';\n\n  /* Renewal outlook */\n\n  /* Monthly chart */\n  const H = 200, CMAX = Math.max(CONTRACT_MAU*1.3, peak*1.12);\n  $('chart-y').innerHTML = [0,Math.round(CMAX/4),Math.round(CMAX/2),Math.round(CMAX*3/4),Math.round(CMAX)]\n    .map(v=>`<span style=\"top:${H - v/CMAX*H}px\">${n(v)}<\/span>`).join('');\n  $('rl-cap').style.top = (H - CONTRACT_MAU/CMAX*H) + 'px';\n  $('rl-avg').style.top = (H - avg/CMAX*H) + 'px';\n  $('rl-avg-v').textContent = n(avg);\n  $('chart-bars').innerHTML = MONTH_LABELS.slice(0,MONTHS_ELAPSED).map((lab,i)=>{\n    const v = S.trend[i];\n    const ov = v > CONTRACT_MAU;\n    const c = ov ? '#e0a03a' : '#2563eb';\n    const now = i === MONTHS_ELAPSED-1;\n    return `<div class=\"bcol${now?' now':''}\">\n      <div class=\"bar\" style=\"height:${Math.max(v/CMAX*H,3)}px;background:${c}\">\n        ${ov?`<span class=\"bflag\">超過 +${n(v-CONTRACT_MAU)}<\/span>`:''}\n        <span class=\"bval\" style=\"color:${c}\">${n(v)}<\/span>\n      <\/div><span class=\"bx\">${lab}${now?' ●':''}<\/span><\/div>`;\n  }).join('');\n\n  /* Monthly table */\n  $('month-body').innerHTML = MONTH_FULL.slice(0,MONTHS_ELAPSED).map((lab,i)=>{\n    const v = S.trend[i], ov = v > CONTRACT_MAU;\n    return `<tr class=\"${ov?'exceeded':''}\">\n      <td>${lab}${i===MONTHS_ELAPSED-1?' <span style=\"font-size:10.5px;color:var(--brand);font-weight:700\">当月<\/span>':''}<\/td>\n      <td class=\"r num\"><b>${n(v)}<\/b><\/td>\n      <td class=\"r num\">${n(CONTRACT_MAU)}<\/td>\n      <td class=\"r num ${ov?'delta-pos':''}\">${pct(v,CONTRACT_MAU)}%<\/td><\/tr>`;\n  }).join('');\n\n  /* Child orgs — adoption view: share of the parent total and month-on-month\n     movement. There is no allocation target to compare against. */\n  const tb = $('child-body'); tb.innerHTML = '';\n  const rows = ORGS.map(o=>({...o, mau:S.per[o.id]}))\n                   .sort((x,y)=>y.mau-x.mau);\n  const total = rows.reduce((s,r)=>s+r.mau,0);\n  rows.forEach(r=>{\n    const share = pct(r.mau,total);\n    tb.insertAdjacentHTML('beforeend',`<tr>\n      <td><div class=\"org-cell\"><div class=\"org-ico\">${r.name.slice(0,2)}<\/div>\n        <div><div class=\"org-name\">${r.name}<\/div><div class=\"org-sub\">${r.code}<\/div><\/div><\/div><\/td>\n      <td class=\"r num\"><b>${n(r.mau)}<\/b><\/td>\n      <td><div class=\"sharecell\">\n        <span class=\"mini\"><span style=\"width:${share}%;background:var(--brand)\"><\/span><\/span>\n        <span class=\"pv\">${share}%<\/span><\/div><\/td>\n    <\/tr>`);\n  });\n  $('child-count').textContent = rows.length;\n  $('child-total').textContent = n(total);\n  $('child-note').textContent  = `当月MAU（${MONTH_FULL[MONTHS_ELAPSED-1]}）の多い順`;\n  $('child-hint').textContent  = `受講が最も多いのは ${rows[0].name}（全体の ${pct(rows[0].mau,total)}%）`;\n\n  bindTips();\n\n}\n\n/* Tooltip */\nconst gtip = $('gtip'); const TIP_W = 290, GAP = 10, EDGE = 12;\nfunction gtipArrow(ax){\n  let s = document.getElementById('gtip-arrow-style');\n  if(!s){ s = document.createElement('style'); s.id='gtip-arrow-style'; document.head.appendChild(s); }\n  s.textContent = `#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(icon){\n  const src = icon.querySelector('.tip'); if(!src) return;\n  gtip.innerHTML = src.innerHTML; gtip.classList.add('on'); gtip.style.width = TIP_W+'px';\n  const r = icon.getBoundingClientRect();\n  let left = Math.max(EDGE, Math.min(r.left + r.width/2 - TIP_W/2, window.innerWidth - TIP_W - EDGE));\n  const h = gtip.offsetHeight, above = r.top - GAP - h >= 60;\n  gtip.style.left = left+'px';\n  gtip.style.top  = (above ? r.top-GAP-h : r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above); gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12, Math.min(r.left + r.width/2 - left - 4.5, TIP_W-21)));\n}\nfunction hideTip(){ gtip.classList.remove('on'); }\nfunction bindTips(){\n  document.querySelectorAll('.info').forEach(i=>{\n    if(i.dataset.b) return; i.dataset.b='1';\n    i.setAttribute('tabindex','0');\n    i.addEventListener('mouseenter',()=>showTip(i)); i.addEventListener('mouseleave',hideTip);\n    i.addEventListener('focus',()=>showTip(i));      i.addEventListener('blur',hideTip);\n  });\n}\nwindow.addEventListener('scroll',hideTip,true); window.addEventListener('resize',hideTip);\n\n$('navToggle').addEventListener('click', ()=>document.body.classList.toggle('nav-collapsed'));\n\ndocument.querySelectorAll('#switcher button').forEach(btn=>{\n  btn.addEventListener('click',()=>{\n    document.querySelectorAll('#switcher button').forEach(b=>b.classList.remove('on'));\n    btn.classList.add('on'); stateKey = btn.dataset.s; render();\n  });\n});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};
var FILE2KEY = {"skill-hub-sysadmin-related-orgs.html": "orgs", "skill-hub-sysadmin-org-detail.html": "detail", "skill-hub-mau-license.html": "customer"};
var fr = document.getElementById('fr');

function show(key, qs){
  if(!SRC[key]) key = 'orgs';
  fr.srcdoc = SRC[key].replace('"__QS__"', JSON.stringify(qs || ''));
  var bs = document.querySelectorAll('#tabs button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.k===key);
  var h = '#' + key + (qs || '');
  if(location.hash !== h) history.replaceState(null, '', h);
}
function route(){
  var raw = location.hash.replace(/^#/, '') || 'orgs';
  var key = raw.split('?')[0];
  var qs  = raw.indexOf('?') >= 0 ? '?' + raw.split('?')[1] : '';
  show(key, qs);
}
window.addEventListener('message', function(e){
  var nav = e.data && e.data.__nav; if(!nav) return;
  var file = nav.split('?')[0];
  var qs   = nav.indexOf('?') >= 0 ? '?' + nav.split('?')[1] : '';

});
var bs = document.querySelectorAll('#tabs button');
for(var i=0;i<bs.length;i++) (function(b){ b.addEventListener('click', function(){ show(b.dataset.k, ''); }); })(bs[i]);

route();
