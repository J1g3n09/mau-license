2\"/><\/svg>管理者一覧<\/a>\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><rect x=\"2.2\" y=\"4.5\" width=\"15.6\" height=\"11\" rx=\"2\"/><circle cx=\"7.3\" cy=\"9.4\" r=\"1.8\"/><path d=\"M4.6 13.5c.4-1.1 1.5-1.7 2.7-1.7s2.3.6 2.7 1.7M12.4 8.6h3.3M12.4 11.4h3.3\"/><\/svg>従業員一覧<\/a>\n  <\/nav><\/div>\n  <div class=\"navgrp\"><div class=\"gl\">スキル分析<\/div><nav class=\"nav\">\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><rect x=\"2.5\" y=\"2.5\" width=\"15\" height=\"15\" rx=\"2\"/><path d=\"M2.5 7.5h15M2.5 12.5h15M7.5 2.5v15M12.5 2.5v15\"/><\/svg>スキルヒートマップ<\/a>\n  <\/nav><\/div>\n  <div class=\"navgrp\"><div class=\"gl\">スキル評価<\/div><nav class=\"nav\">\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><rect x=\"4.5\" y=\"3.5\" width=\"11\" height=\"14\" rx=\"2\"/><path d=\"M7.6 3.5V2.6h4.8v.9M7.5 8.6h5M7.5 11.8h3\"/><\/svg>アセスメント<\/a>\n  <\/nav><\/div>\n  <div class=\"navgrp\"><div class=\"gl\">スキル管理<\/div><nav class=\"nav\">\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><rect x=\"2.5\" y=\"3\" width=\"6\" height=\"4\" rx=\"1\"/><rect x=\"11.5\" y=\"3\" width=\"6\" height=\"4\" rx=\"1\"/><rect x=\"7\" y=\"13\" width=\"6\" height=\"4\" rx=\"1\"/><path d=\"M5.5 7v3h9V7M10 10v3\"/><\/svg>スキルタクソノミー<\/a>\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><path d=\"M10 2.6l7.4 3.9-7.4 3.9-7.4-3.9z\"/><path d=\"M2.6 10.4l7.4 3.9 7.4-3.9\"/><\/svg>スキルマスタ管理<\/a>\n  <\/nav><\/div>\n  <div class=\"navgrp\"><div class=\"gl\">管理・設定<\/div><nav class=\"nav\">\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><rect x=\"3.4\" y=\"3\" width=\"8\" height=\"14\" rx=\"1\"/><path d=\"M11.4 8h5.2v9h-5.2M6 6h2.8M6 9h2.8M6 12h2.8\"/><\/svg>関連会社一覧<\/a>\n    <a href=\"#\"><svg viewBox=\"0 0 20 20\"><path d=\"M10 2.6l6 2.1v5c0 3.9-2.5 6.5-6 7.7-3.5-1.2-6-3.8-6-7.7v-5z\"/><\/svg>セキュリティ<\/a>\n  <\/nav><\/div>\n  <div class=\"navgrp\"><div class=\"gl\">システム管理者専用<\/div><nav class=\"nav\">\n    <a href=\"#\" class=\"active\"><svg viewBox=\"0 0 20 20\"><rect x=\"3.4\" y=\"3\" width=\"8\" height=\"14\" rx=\"1\"/><pat    <\/table>\n    <\/div>\n\n    <div class=\"pager\"><span id=\"count\"><\/span><span style=\"color:var(--text-3)\">1<\/span><\/div>\n  <\/div>\n<\/div>\n<\/div>\n\n<div id=\"gtip\"><\/div>\n\n<script>\n/* 契約 (plan + seat cap + term) and the E-learning contracts (own cap, own\n   term, own ACL) are separate objects. An organisation may hold a Basic\n   contract, an Advanced contract, or both — at most one active per plan, so\n   the e-learning columns render one line per contract and never sum across\n   plans. Every judgement is a warning icon with a tooltip; detail lives on\n   the organisation detail page. */\n\n/* An organisation holds up to two independent e-learning contracts — at most\n   one active per plan. Figures here mirror the org-detail registry so the two\n   screens cannot contradict each other. `acl` on a child row lists the plans\n   that child organisation is allowed to use. */\nconst ORGS=[\n  {id:8801,name:'{ACME}',seg:'IT',plan:'エンタープライズ',\n   term:'2026/4/1 - 2027/3/31',days:227,seats:20000,seatCap:21000,contractSet:true,\n   lic:{basic:{cap:2000,term:'2026/4/1 - 2027/3/31',days:227,sync:true,acl:'国内拠点のみ',\n               trend:[980,1150,1290,1380,1460]},\n        advanced:{cap:1000,term:'2026/4/1 - 2027/3/31',days:227,sync:true,acl:'技術・グローバル部門',\n               trend:[640,780,900,1010,1120]}},\n   children:[\n     {id:81,name:'ACME 研修センター',plan:'エンタープライズ',seats:980,seatCap:1200,acl:['basic','advanced']},\n     {id:82,name:'ACME 東京本社',plan:'エンタープライズ',seats:760,seatCap:900,acl:['basic','advanced']},\n     {id:86,name:'ACME Global',plan:'エンタープライズ',seats:320,seatCap:400,acl:['advanced']},\n   ]},\n  {id:6382,name:'日本テクノホールディングス',seg:'製造',plan:'エンタープライズ',\n   term:'2026/4/1 - 2027/3/31',days:227,seats:2840,seatCap:3180,contractSet:false,\n   lic:{basic:{cap:2000,term:'2026/4/1 - 2027/3/31',days:227,sync:true,acl:'All（全子組織）',\n               trend:[1310,1680,2090,2280,2450]},\n        advanced:null},\n   children:[\n     {id:64,name:'日本テクノ研修センター',plan:'エンタープライズ',seats:980,seatCap:1200,acl:['basic']},\n     {id:65,name:'東京本社',plan:'エンタープライズ',seats:760,seatCap:900,acl:['basic']},\n     {id:66,name:'大阪支社',plan:'エンタープライズ',seats:520,seatCap:700,acl:['basic']},\n   ]},\n  {id:4471,name:'大和自動車工業',seg:'自動車',plan:'エンタープライズ',\n   term:'2025/10/1 - 2026/9/30',days:45,seats:5120,seatCap:6000,contractSet:true,\n   lic:{basic:null,\n        advanced:{cap:3000,term:'2026/4/1 - 2027/3/31',days:227,sync:false,acl:null,\n               trend:[2810,3120,3340,3510,3620,3480,3390,3550,3720,3820,3660]}},\n   children:[]},\n  {id:2210,name:'東海マテリアル',seg:'素材',plan:'エンタープライズ',\n   term:'2025/12/1 - 2026/11/10',days:86,seats:980,seatCap:1200,contractSet:true,\n   lic:{basic:{cap:800,term:'2025/12/1 - 2026/11/10',days:86,sync:true,acl:null,\n               trend:[620,680,730,790,840,880,900,930,915]},\n        advanced:null},\n   children:[]},\n  {id:3311,name:'三葉重工業',seg:'重工',plan:'エンタープライズ',\n   term:'2025/12/1 - 2026/10/31',days:76,seats:2100,seatCap:2600,contractSet:true,\n   lic:{basic:{cap:1000,term:'2025/12/1 - 2026/10/31',days:76,sync:true,acl:null,\n               trend:[680,640,610,590,620,600,580,640,660,630]},\n        advanced:null},\n   children:[]},\n  {id:5502,name:'関西エレクトロニクス',seg:'電機',plan:'エンタープライズ',\n   term:'2026/1/1 - 2027/1/31',days:168,seats:8600,seatCap:9500,contractSet:true,\n   lic:{basic:{cap:3000,term:'2026/1/1 - 2027/1/31',days:168,sync:true,acl:'技術系以外',\n               trend:[2410,2680,2890,3180,2960,2870,3190]},\n        advanced:{cap:3000,term:'2026/4/1 - 2027/3/31',days:227,sync:false,acl:'技術系本部のみ',\n               trend:[2210,2480,2690,2780,2860,2790,2880]}},\n   children:[]},\n  {id:3390,name:'九州インダストリー',seg:'製造',plan:'エンタープライズ',\n   term:'2026/1/1 - 2026/12/31',days:137,seats:3900,seatCap:4500,contractSet:true,\n   lic:{basic:{cap:4000,term:'2026/1/1 - 2026/12/31',days:137,sync:true,acl:null,\n               trend:[980,1050,1120,1180,1090,1140,1210,1160]},\n        advanced:null},\n   children:[]},\n  {id:12,name:'{Acme}',seg:'—',plan:'デフォルト',term:'2025/4/1 - 2026/1/31',days:-197,\n   seats:100,seatCap:1000,contractSet:true,lic:{basic:null,advanced:null},\n   children:[{id:2,name:'{Acme 2}',plan:'デフォルト',seats:1001,seatCap:1000,acl:[]}]},\n  {id:25,name:'Academy Demo',seg:'—',plan:'デフォルト',term:'2026/4/1 - 2027/3/31',days:227,\n   seats:30001,seatCap:30000,contractSet:true,lic:{basic:null,advanced:null},children:[]},\n];\n\nconst PLANS=['basic','advanced'];\nconst PL={basic:'Basic', advanced:'Advanced'};\n\nconst n=v=>v.toLocaleString('ja-JP');\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;');\nconst pct=(a,b)=>Math.round(a/b*1000)/10;\nconst $=id=>document.getElementById(id);\n\n/* Per-plan judgement. Every number is scoped to one contract; nothing is\n   summed across Basic and Advanced, because they have separate caps. */\nfunction derivePlan(o,p){\n  const L=o.lic&&o.lic[p]; if(!L) return null;\n  const t=L.trend, ex=t.filter(v=>v>L.cap), nEx=ex.length;\n  const mau=t[t.length-1], peak=Math.max(...t);\n  const avg=Math.round(t.reduce((a,b)=>a+b,0)/t.length);\n  const util=pct(avg,L.cap);\n  return {plan:p,cap:L.cap,term:L.term,days:L.days,sync:L.sync,acl:L.acl,months:t.length,\n          nEx,mau,peak,avg,util,idle:util<50,maxOver:nEx?Math.max(...ex)-L.cap:0,\n          soon:L.days>=0&&L.days<=90};\n}\nfunction derive(o){\n  const seatOver=o.seats>o.seatCap;\n  const per=PLANS.map(p=>derivePlan(o,p)).filter(Boolean);\n  return {seatOver, per, has:per.length>0,\n          anyEx:per.some(d=>d.nEx>0), anyDesync:per.some(d=>!d.sync)};\n}\n\n/* warning icon + its tooltip payload */\nfunction wico(html,amber){\n  return `<span class=\"wico${amber?' amber':''}\" tabindex=\"0\">!<span class=\"wtip\">${html}<\/span><\/span>`;\n}\n\nlet q='',open=new Set([6382]);\n\nfunction render(){\n  const list=ORGS.filter(o=>!q||o.name.includes(q));\n  let html='';\n  list.forEach(o=>{\n    const d=derive(o),kids=o.children.length>0,isOpen=open.has(o.id);\n\n    /* 従業員数 / 定員 */\n    const seatCell=`<div class=\"cell ${d.seatOver?'bad':''}\">\n      <span class=\"val\">${n(o.seats)} / ${n(o.seatCap)}<\/span>\n      ${d.seatOver?wico(`<b>契約定員を ${n(o.seats-o.seatCap)} 名超過<\/b><br>従業員 ${n(o.seats)} 名 ／ 定員 ${n(o.seatCap)} 名`):''}<\/div>`;\n\n    /* 契約期間 */\n    const ctExp=o.days<0, ctSoon=o.days>=0&&o.days<=90;\n    const ctCell=!o.contractSet\n      ? `<span class=\"setlink\"><span class=\"muted-chip\">未設定<\/span><a class=\"link\">設定する<\/a><\/span>`\n      : `<div class=\"cell ${ctExp?'bad':''}\"><span class=\"val\">${o.term}<\/span>\n         ${ctExp?wico(`<b>契約期間が終了しています<\/b><br>${o.term.split(' - ')[1]} 満了・更新未完了`):''}<\/div>\n         ${ctSoon?`<span class=\"sub soon\">更新まで ${o.days} 日<\/span>`:''}`;\n\n    /* MAUライセンス — one line per contract, never summed across plans */\n    const mauCell=!d.has\n      ? `<span class=\"muted\">未契約　<a class=\"link\">提案する<\/a><\/span>`\n      : d.per.map(x=>`<div class=\"cell ${x.nEx?'bad':''}\" style=\"margin:1px 0\">\n          <span class=\"lictag ${x.plan==='advanced'?'adv':'basic'}\">${PL[x.plan]}<\/span>\n          <span class=\"val\" style=\"margin-left:6px\">${x.nEx} / ${x.months} ヶ月<\/span>\n          ${x.nEx?wico(`<b>${PL[x.plan]}：契約MAU ${n(x.cap)} を ${x.nEx} / ${x.months} ヶ月 超過<\/b><br>最大超過幅 ${n(x.maxOver)} MAU ／ 当月 ${n(x.mau)} MAU`,true):''}\n          ${!x.nEx&&x.idle?wico(`<b>${PL[x.plan]}：活用率 ${x.util}%<\/b><br>平均 ${n(x.avg)} MAU ／ 契約 ${n(x.cap)} MAU`,true):''}\n         <\/div>`).join('')\n        + `<span class=\"sub\">超過月数 / 経過月数<\/span>`;\n\n    /* ライセンス期間 — collapsed when both contracts share a term */\n    const sameTerm=d.per.length===2&&d.per[0].term===d.per[1].term;\n    const termRow=x=>`<div class=\"cell ${!x.sync?'bad':''}\" style=\"margin:1px 0\">\n        ${d.per.length>1&&!sameTerm?`<span class=\"lictag ${x.plan==='advanced'?'adv':'basic'}\">${PL[x.plan]}<\/span> `:''}\n        <span class=\"val\">${x.term}<\/span>\n        ${!x.sync?wico(`<b>${PL[x.plan]}：契約期間と不一致<\/b><br>契約：${o.term}<br>ライセンス：${x.term}`):''}<\/div>\n      ${x.soon?`<span class=\"sub soon\">更新まで ${x.days} 日<\/span>`:''}`;\n    const licCell=!d.has ? `<span class=\"muted\">—<\/span>`\n      : sameTerm\n        ? `<div class=\"cell ${!d.per[0].sync?'bad':''}\"><span class=\"val\">${d.per[0].term}<\/span>\n            ${!d.per[0].sync?wico(`<b>契約期間と不一致<\/b><br>契約：${o.term}<br>ライセンス：${d.per[0].term}`):''}<\/div>\n           <span class=\"sub\">Basic・Advanced 共通<\/span>\n           ${d.per[0].soon?`<span class=\"sub soon\">更新まで ${d.per[0].days} 日<\/span>`:''}`\n        : d.per.map(termRow).join('');\n\n    html+=`<tr class=\"parent\" data-o=\"${o.id}\">\n      <td>${kids?`<button class=\"exp ${isOpen?'open':''}\" data-x=\"${o.id}\"><svg viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg><\/button>`:''}<\/td>\n      <td class=\"num\">${o.id}<\/td>\n      <td><div class=\"orgcell\"><span class=\"sq\"><\/span><span>${kids?'<span class=\"otop\">親テナント<\/span>':''}<a class=\"onamelink\" href=\"skill-hub-sysadmin-org-detail.html?org=${o.id}\">${o.name}<\/a><\/span><\/div><\/td>\n      <td>${o.plan}<\/td>\n      <td>${seatCell}<\/td>\n      <td>${ctCell}<\/td>\n      <td>${mauCell}<\/td>\n      <td>${licCell}<\/td>\n      <td style=\"text-align:right\"><button class=\"icobtn\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"4.5\" r=\"1.3\"/><circle cx=\"10\" cy=\"10\" r=\"1.3\"/><circle cx=\"10\" cy=\"15.5\" r=\"1.3\"/><\/svg><\/button><\/td><\/tr>`;\n\n    if(isOpen) o.children.forEach(c=>{\n      const cOver=c.seats>c.seatCap;\n      html+=`<tr class=\"child\"><td><\/td><td class=\"num\">${c.id}<\/td>\n        <td><div class=\"orgcell\" style=\"padding-left:18px\"><span class=\"arrow\">↳<\/span><span class=\"sq\"><\/span>\n          <span><span class=\"otop\">${o.name}の子テナント<\/span><span class=\"oname\">${c.name}<\/span><\/span><\/div><\/td>\n        <td>${c.plan}<\/td>\n        <td><div class=\"cell ${cOver?'bad':''}\"><span class=\"val\">${n(c.seats)} / ${n(c.seatCap)}<\/span>\n          ${cOver?wico(`<b>契約定員を ${n(c.seats-c.seatCap)} 名超過<\/b><br>従業員 ${n(c.seats)} 名 ／ 定員 ${n(c.seatCap)} 名`):''}<\/div><\/td>\n        <td class=\"muted\">親組織の契約に含む<\/td>\n        <td>${(c.acl&&c.acl.length)\n          ? c.acl.map(p=>`<span class=\"lictag ${p==='advanced'?'adv':'basic'}\">${PL[p]}<\/span>`).join(' ')\n            +'<span class=\"sub\">アクセス可能なプラン<\/span>'\n          : '<span class=\"muted\">アクセス範囲外<\/span>'}<\/td>\n        <td class=\"muted\">親組織のライセンス<\/td>\n        <td><\/td><\/tr>`;\n    });\n  });\n  $('tbody').innerHTML=html||`<tr><td colspan=\"9\" style=\"padding:38px;text-align:center;color:var(--text-3)\">該当する組織がありません<\/td><\/tr>`;\n  $('count').textContent=`表示 1-${list.length}/${list.length}`;\n\n  document.querySelectorAll('.exp').forEach(b=>b.addEventListener('click',e=>{\n    e.stopPropagation();const i=+b.dataset.x;open.has(i)?open.delete(i):open.add(i);render();\n  }));\n  document.querySelectorAll('tr.parent').forEach(tr=>tr.addEventListener('click',()=>{location.href='skill-hub-sysadmin-org-detail.html?org='+tr.dataset.o;}));\n  bindTips();\n}\n\n/* ---------- body-level tooltip (never clipped by the table) ---------- */\nconst gtip=$('gtip'),TIP_W=300,GAP=10,EDGE=12;\nfunction gtipArrow(ax){\n  let s=document.getElementById('gtip-arrow');\n  if(!s){s=document.createElement('style');s.id='gtip-arrow';document.head.appendChild(s);}\n  s.textContent=`#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(el){\n  const src=el.querySelector('.wtip');if(!src)return;\n  gtip.innerHTML=src.innerHTML;gtip.classList.add('on');gtip.style.width=TIP_W+'px';\n  const r=el.getBoundingClientRect();\n  let left=Math.max(EDGE,Math.min(r.left+r.width/2-TIP_W/2,window.innerWidth-TIP_W-EDGE));\n  const h=gtip.offsetHeight,above=r.top-GAP-h>=60;\n  gtip.style.left=left+'px';\n  gtip.style.top=(above?r.top-GAP-h:r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above);gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12,Math.min(r.left+r.width/2-left-4.5,TIP_W-21)));\n}\nfunction hideTip(){gtip.classList.remove('on');}\nfunction bindTips(){\n  document.querySelectorAll('.wico').forEach(el=>{\n    el.addEventListener('mouseenter',()=>showTip(el));\n    el.addEventListener('mouseleave',hideTip);\n    el.addEventListener('focus',()=>showTip(el));\n    el.addEventListener('blur',hideTip);\n    el.addEventListener('click',e=>e.stopPropagation());\n  });\n}\nwindow.addEventListener('scroll',hideTip,true);\nwindow.addEventListener('resize',hideTip);\n\ndocument.querySelectorAll('#utabs button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#utabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');\n}));\n$('q').addEventListener('input',e=>{q=e.target.value.trim();render();});\n$('navToggle').addEventListener('click',()=>document.body.classList.toggle('nav-collapsed'));\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "detail": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=1440\" />\n<title>Skill Hub — {ACME}（MAUライセンス）<\/title>\n<style>\n  :root{\n    --line:#e5e9f0; --line-strong:#cbd3e0;\n    --text:#0f172a; --text-2:#4b5565; --text-3:#7c8698;\n    --brand:#2563eb; --brand-weak:#eaf1fe;\n    --ok:#0d8a5f; --ok-weak:#e8f6f0;\n    --warn:#b45309; --warn-weak:#fef4e6;\n    --danger:#d92d20; --danger-weak:#fdeceb;\n    --idle:#6b4a9e; --idle-weak:#f4effb;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{background:#fff;color:var(--text);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;\n    font-family:\"Inter\",\"Helvetica Neue\",Arial,\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"Noto Sans JP\",\"Yu Gothic UI\",\"Meiryo\",sans-serif;}\n  .num{font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\";}\n\n  .shell{display:flex;min-height:100vh;}\n  .side{width:256px;flex:none;background:#fff;border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:transform .18s;}\n  .side-brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 18px;}\n  .side-brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ef4a3c,#c8362d);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none;}\n  .side-brand .nm{font-weight:700;font-size:15.5px;}\n  .navgrp{margin-top:14px;}\n  .navgrp .gl{font-size:11px;color:var(--text-3);font-weight:600;padding:0 18px 7px;border-bottom:1px solid var(--line);margin-bottom:6px;}\n  .nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text-2);text-decoration:none;}\n  .nav a:hover{background:#f5f7fa;}\n  .nav a.active{background:var(--brand-weak);color:var(--brand);font-weight:650;}\n  .nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}\n\n  .main{flex:1;min-width:0;margin-left:256px;transition:margin-left .18s;}\n  .hdr{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;}\n  .toggle{width:32px;height:32px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none;}\n  .toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;}\n  .hdr .vr{width:1px;height:22px;background:var(--line);}\n  .crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2);}\n  .crumb a{color:var(--text-2);text-decoration:none;}\n  .crumb a:hover{color:var(--brand);}\n  .crumb .sep{color:var(--line-strong);}\n  .crumb .cur{color:var(--text);font-weight:650;}\n  .hdr .spacer{flex:1;}\n  .prof{width:34px;height:34px;border-radius:50%;background:var(--brand-weak);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line);}\n  body.nav-collapsed .side{transform:translateX(-256px);}\n  body.nav-collapsed .main{margin-left:0;}\n\n  /* Gutters match the customer page (Eラーニング MAU 利用状況): the wide side\n     margins come from the 1240px max-width + auto centring, not the padding. */\n  .wrap{max-width:1240px;margin:0 auto;padding:24px 24px 88px;}\n\n  .orgcard{border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;align-items:flex-start;gap:18px;margin-bottom:22px;}\n  .avatar{width:88px;height:88px;border-radius:10px;background:#1c2333;display:grid;place-items:center;flex:none;color:#c9e265;font-size:30px;font-weight:700;}\n  .oc-b{flex:1;min-width:0;}\n  .oc-top{font-size:11.5px;color:var(--text-3);}\n  .oc-name{display:flex;align-items:center;gap:10px;margin:1px 0 3px;}\n  .oc-name h1{font-size:21px;margin:0;letter-spacing:-.01em;}\n  .planbadge{font-size:11.5px;font-weight:600;background:#f1f4f8;border:1px solid #e0e6ee;color:var(--text-2);border-radius:6px;padding:2px 10px;}\n  .oc-desc{font-size:11.5px;color:var(--text-3);}\n  .oc-meta{display:flex;align-items:center;gap:20px;margin-top:9px;font-size:12.5px;color:var(--text-2);}\n  .oc-meta span{display:inline-flex;align-items:center;gap:7px;}\n  .oc-meta svg{width:16px;height:16px;stroke:var(--ok);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}\n  .oc-meta .lnk svg{stroke:var(--text-3);}\n  .oc-act{display:flex;gap:9px;flex:none;}\n\n  .btn{font:inherit;font-size:13.5px;border:1px solid var(--line-strong);background:#fff;color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;}\n  .btn:hover{background:#f7f9fc;}\n  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}\n  .btn-primary:hover{background:#1d4fd0;}\n  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}\n  .btn-icon{padding:10px 12px;}\n  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}\n  .btn-danger{color:var(--danger);border-color:#f5c6c3;}\n  .btn-danger:hover{background:var(--danger-weak);}\n\n  .pills{display:flex;gap:6px;margin-bottom:22px;}\n  .pills[hidden]{display:none;}\n  .pills button{font:inherit;font-size:14px;font-weight:650;border:none;background:none;color:var(--text-2);padding:11px 20px;border-radius:9px;cursor:pointer;}\n  .pills button:hover{background:#f4f6fa;}\n  .pills button.on{background:var(--brand-weak);color:var(--brand);}\n\n  .card{border:1px solid var(--line);border-radius:12px;}\n  .card-h{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}\n  .card-h h2{font-size:13.5px;margin:0;font-weight:700;}\n  .card-h .hint{font-size:11.5px;color:var(--text-3);font-weight:400;}\n  .card-b{padding:17px;}\n  .section{margin-bottom:20px;}\n\n  /* licence identity header */\n  .lichead{border:1px solid var(--line);border-radius:12px;background:#fff;\n    padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:20px;}\n  .lichead .nm{font-size:15.5px;font-weight:700;}\n  .lichead .meta{font-size:11.5px;color:var(--text-3);margin-top:2px;}\n  .lichead .lictag{flex:none;}\n  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 10px;letter-spacing:.02em;}\n  .tag-basic{background:#eef1f6;color:var(--text-2);border:1px solid #dde3ec;}\n  .tag-adv{background:var(--brand-weak);color:var(--brand);border:1px solid #cfe0fd;}\n\n  .tiles{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:11px;margin-bottom:20px;}\n  .tiles.c4{grid-template-columns:repeat(4,1fr);}\n  .tiles.c3{grid-template-columns:repeat(3,1fr);}\n  .tiles.c2{grid-template-columns:repeat(2,1fr);}\n  .tiles .tl{padding:13px 16px;border-right:1px solid var(--line);}\n  .tiles .tl:last-child{bo n      return rank[a.status]-rank[b.status] || a.tier.localeCompare(b.tier) || a.name.localeCompare(b.name);\n    });\n  const body=rows.map(l=>{\n    const s=stats(l);\n    return `<tr class=\"lrow ${l.status==='archived'?'dim':''}\" data-open=\"${l.id}\">\n      <td><a class=\"lname\">${esc(l.name)}<\/a><\/td>\n      <td>${tierTag(l.tier)}<\/td>\n      <td>${statusTag(l.status)}<\/td>\n      <td class=\"num\" style=\"font-size:12px\">${esc(l.term)}\n        ${l.status==='inuse'&&l.days>0?`<div class=\"lsub\">更新まで ${l.days} 日<\/div>`:''}<\/td>\n      <td class=\"r num\">${n(l.cap)}<\/td>\n      <td class=\"r num\">${!s.T.length?'<span class=\"rdonly\">—<\/span>'\n        :`<b style=\"color:${s.nEx?'var(--warn)':'inherit'}\">${s.nEx} / ${s.T.length}<\/b> ヶ月\n           ${s.nEx?`<span class=\"wico\" tabindex=\"0\">!<span class=\"tip\"><b>契約MAU ${n(l.cap)} を ${s.nEx} / ${s.T.length} ヶ月 超過<\/b><br>\n             最大超過幅 ${n(s.maxOver)} MAU（${s.peakM}・${n(s.peak)} MAU）<\/span><\/span>`:''}`}\n        <div class=\"lsub\">${!s.T.length?'実績なし':'超過月数 / 経過月数'}<\/div><\/td>\n      <td style=\"text-align:right\"><button class=\"icobtn\" data-menu=\"${l.id}\">\n        <svg viewBox=\"0 0 20 20\" stroke-width=\"0\" fill=\"currentColor\"><circle cx=\"10\" cy=\"4.5\" r=\"1.4\"/><circle cx=\"10\" cy=\"10\" r=\"1.4\"/><circle cx=\"10\" cy=\"15.5\" r=\"1.4\"/><\/svg><\/button><\/td>\n    <\/tr>`;\n  }).join('');\n\n  const live=TIERS.filter(t=>inUse(t));\n  return `<div class=\"ltoolbar\">\n    <div class=\"lsearch\">\n      <svg viewBox=\"0 0 20 20\"><circle cx=\"8.6\" cy=\"8.6\" r=\"5.4\"/><path d=\"M12.7 12.7l4 4\"/><\/svg>\n      <input id=\"lq\" type=\"text\" placeholder=\"ライセンス名で検索\" value=\"${esc(query)}\" />\n    <\/div>\n    <span style=\"flex:1\"><\/span>\n    <button class=\"btn btn-primary btn-sm\" id=\"lnew\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"M10 4.5v11M4.5 10h11\"/><\/svg>新規ライセンス<\/button>\n  <\/div>\n\n  <div class=\"note\" style=\"margin-bottom:18px\"><span>\n    <b>利用中：${live.length?live.map(t=>PL[t]).join(' ＋ '):'なし'}<\/b>\n    　／　1組織・1プランにつき<b>利用中は1件のみ<\/b>です。<\/span><\/div>\n\n  ${LICS.length?`<div class=\"card\">\n    <table class=\"ltable\"><thead><tr>\n      <th style=\"width:30%\">ライセンス名<\/th>\n      <th style=\"width:9%\">プラン<\/th>\n      <th style=\"width:11%\">ステータス<\/th>\n      <th style=\"width:19%\">有効な期限<\/th>\n      <th class=\"r\" style=\"width:11%\">契約MAU<\/th>\n      <th class=\"r\" style=\"width:14%\">超過月数<\/th>\n      <th style=\"width:5%\"><\/th>\n    <\/tr><\/thead><tbody>${body||`<tr><td colspan=\"7\" style=\"text-align:center;color:var(--text-3);padding:30px\">「${esc(query)}」に一致するライセンスはありません<\/td><\/tr>`}<\/tbody><\/table>\n    <div class=\"card-b\" style=\"border-top:1px solid var(--line);padding:11px 17px\">\n      <span class=\"rdonly\">表示 ${rows.length}/${LICS.length} 件<\/span><\/div>\n  <\/div>`\n  :`<div class=\"empty\">\n    <div class=\"ei\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 6.5A2.5 2.5 0 016.5 4H19v13H6.5A2.5 2.5 0 004 19.5z\"/><path d=\"M4 19.5A2.5 2.5 0 016.5 17H19v3H6.5A2.5 2.5 0 014 19.5z\"/><path d=\"M9 9h6\"/><\/svg><\/div>\n    <h3>MAUライセンスがありません<\/h3>\n    <p>この組織ではMAUライセンスが設定されていません。ライセンスを作成すると、対象コースの受講とMAU実績の記録が開始されます。\n      下書きとして保存しておき、稟議後に利用中へ切り替えることもできます。<\/p>\n    <button class=\"btn btn-primary\" id=\"lnew2\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"M10 4.5v11M4.5 10h11\"/><\/svg>最初のライセンスを作成する<\/button>\n  <\/div>`}`;\n}\n\n/* ---------- one licence's detail ---------- */\nfunction viewDetail(){\n  const L=licById(selId);\n  if(!L){ selId=null; return viewList(); }\n  const s=stats(L), CAP=L.cap, H=180, live=isLive(L);\n  /* Departments directly under the parent tenant have no child org, so label the\n     scope by what is actually there rather than printing \"0組織\". */\n  const scopeSet=new Set(deptsOn(L.tier).filter(d=>d.org).map(d=>d.org));\n  const scopeLabel=scopeSet.size ? `${scopeSet.size}組織`\n                  : deptsOn(L.tier).length ? '本組織 直属' : '対象組織なし';\n  const acl=aclById(L.aclId);\n  const back='';\n\n  const head=`<div class=\"lichead\">\n    <div style=\"flex:1;min-width:0\">\n      <div class=\"nm\">${esc(L.name)}<\/div>\n      <div class=\"meta\">有効な期限 ${esc(L.term)}${live&&L.days>0?`（更新まで <b class=\"num\">${L.days}<\/b> 日）`:''}　／　作成 ${esc(L.created)}<\/div>\n    <\/div>\n    ${tierTag(L.tier)} ${statusTag(L.status)}\n    ${L.status!=='archived'?`<button class=\"btn btn-sm\" id=\"ledit\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"M13.6 3.6l2.8 2.8L7 15.8H4.2v-2.8z\"/><\/svg>編集する<\/button>`:''}\n  <\/div>`;\n\n  /* --- draft: no MAU exists yet --- */\n  if(L.status==='draft'){\n    const target=inUse(L.tier);\n    return `${back}${head}\n    <div class=\"alert a-warn\"><div class=\"ico\">!<\/div><div>\n      <h3>このライセンスは下書きです<\/h3>\n      <p>顧客には表示されず、MAUの記録も行われません。利用中に切り替えると\n        ${target?`現在利用中の「${esc(target.name)}」をアーカイブする必要があります。`:`${PL[L.tier]}のライセンスとして有効になります。`}<\/p><\/div><\/div>\n    <div class=\"tiles c2\">\n      <div class=\"tl\"><div class=\"k\">契約MAU（予定）<\/div><div class=\"v num\">${n(CAP)}<small>MAU<\/small><\/div>\n        <div class=\"s\">${PL[L.tier]}プラン<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">有効な期限（予定）<\/div><div class=\"v\" style=\"font-size:14px;padding-top:5px\">${esc(L.term)}<\/div>\n        <div class=\"s\">${L.sync?'契約期間と一致':'契約期間（'+esc(ORG.contract.term)+'）と不一致'}<\/div><\/div>\n    <\/div>\n    <div class=\"placeholder\">利用中に切り替えると、月次MAUの記録と部門の割当状況がここに表示されます。<\/div>`;\n  }\n\n  /* --- in use / archived: there is a series to show --- */\n  const CMAX=Math.max(...s.T,CAP)*1.16;\n  const ys=[0,.25,.5,.75,1].map(f=>`<span style=\"top:${H-f*H}px\">${n(Math.round(CMAX*f))}<\/span>`).join('');\n  const bars=ML.slice(0,s.T.length).map((lab,i)=>{\n    const v=s.T[i], ov=v>CAP, now=live&&i===s.T.length-1;\n    return `<div class=\"bcol ${now?'now':''}\">\n      ${ov?'<span class=\"bflag\">超過<\/span>':''}\n      <span class=\"bval\" style=\"color:${ov?'#b45309':'var(--text-2)'}\">${n(v)}<\/span>\n      <div class=\"bar\" style=\"height:${Math.max(v/CMAX*H,3)}px;background:${ov?'#d97706':(now?'var(--brand)':'#93b4f5')}\"><\/div>\n      <span class=\"bx\">${lab}<\/span><\/div>`;\n  }).join('');\n  const rows=s.T.map((v,i)=>{\n    const ov=v>CAP, now=live&&i===s.T.length-1;\n    return `<tr class=\"${ov?'ex':''}\"><td>${MF[i]||ML[i]}${now?' <span style=\"font-size:10px;color:var(--brand);font-weight:700\">当月<\/span>':''}<\/td>\n      <td class=\"r num\"><b>${n(v)}<\/b><\/td><td class=\"r num\">${n(CAP)}<\/td>\n      <td class=\"r num ${ov?'bad':''}\">${pct(v,CAP)}%<\/td><\/tr>`;\n  }).join('');\n\n  /* Departments and child orgs only mean something for a live licence — an\n     archived licence's ACL no longer governs anything. */\n  let scope='';\n  if(live){\n    const kids=(acl?acl.orgs:[]).map(id=>{\n      const ds=deptsOn(L.tier).filter(d=>d.org===id);\n      return {id,name:childName(id),mau:ds.reduce((a,d)=>a+d.by[L.tier].mau,0),\n              head:ds.reduce((a,d)=>a+d.by[L.tier].n,0),nd:ds.length};\n    }).sort((a,b)=>b.mau-a.mau);\n    const kidTot=kids.reduce((a,c)=>a+c.mau,0);\n    scope=`${kids.length?`<div class=\"card section\">\n      <div class=\"card-h\"><h2>子組織別 利用状況<\/h2>\n        <span class=\"hint\">当月MAUの多い順　／　合計 ${n(kidTot)} MAU<\/span><\/div>\n      <table><thead><tr>\n        <th style=\"width:40%\">子組織<\/th><th class=\"r\" style=\"width:16%\">当月MAU<\/th>\n        <th style=\"width:44%\">構成比（当月MAU）<\/th>\n      <\/tr><\/thead><tbody>${kids.map(c=>{\n        const share=pct(c.mau,kidTot||1);\n        return `<tr><td>${esc(c.name)}<div class=\"memsub\">${c.nd?`${c.nd}部門　／　${n(c.head)}名`:'このプランの部門なし'}<\/div><\/td>\n          <td class=\"r num\"><b>${n(c.mau)}<\/b><\/td>\n          <td><div class=\"sharecell\">\n            <span class=\"mini\"><span style=\"width:${share}%;background:var(--brand)\"><\/span><\/span>\n            <span class=\"pv\">${share}%<\/span><\/div><\/td><\/tr>`;\n      }).join('')}<\/tbody><\/table><\/div>`:''}`;\n  }\n\n  return `${back}\n  ${!live?`<div class=\"alert a-warn\"><div class=\"ico\">!<\/div><div>\n      <h3>このライセンスはアーカイブ済です<\/h3>\n      <p>下記は当時の記録です。判定は<b>その期間に適用されていた契約MAU ${n(CAP)}<\/b>に対して行われています。\n         現在の受講可否・MAU集計には影響しません。<\/p><\/div><\/div>`:''}\n  ${head}\n  ${live&&!L.sync?`<div class=\"alert a-bad\"><div class=\"ico\">!<\/div><div>\n      <h3>契約期間とライセンス期間が一致していません<\/h3>\n      <p>契約：${esc(ORG.contract.term)} ／ ライセンス：${esc(L.term)}。契約終了後のMAUライセンス利用可否について確認が必要です。<\/p><\/div><\/div>`:''}\n  ${s.nEx?`<div class=\"alert a-warn\"><div class=\"ico\">!<\/div><div>\n      <h3>契約MAUを超過した月があります（${s.nEx} / ${s.T.length} ヶ月）<\/h3>\n      <p>最大超過幅 <b>${n(s.maxOver)} MAU<\/b>（${s.peakM}・${n(s.peak)} MAU）。<\/p><\/div><\/div>`:''}\n\n  <div class=\"tiles ${live?'c4':'c3'}\">\n    <div class=\"tl\"><div class=\"k\">契約MAU${info('当月MAUの記録・判定に使う基準値です。<br><b>受講を停止する上限ではありません。<\/b>')}<\/div>\n      <div class=\"v num\">${n(CAP)}<small>MAU<\/small><\/div><div class=\"s\">${PL[L.tier]}プラン<\/div><\/div>\n    ${live?`<div class=\"tl\"><div class=\"k\">当月MAU（2026年8月）${info('当月に対象コースを1つ以上受講した<b>実人数<\/b>です。月次でリセットされます。')}<\/div>\n      <div class=\"v num\" style=\"color:${s.mau>CAP?'var(--warn)':'var(--brand)'}\">${n(s.mau)}<\/div>\n      <div class=\"s\">契約比 ${pct(s.mau,CAP)}%<\/div><\/div>\n    <div class=\"tl\"><div class=\"k\">対象者数${info('このプランの組織に所属する、<b>受講できる対象者<\/b>の数です。')}<\/div>\n      <div class=\"v num\">${n(assigned(L.tier))}<small>名<\/small><\/div>\n      <div class=\"s\">${scopeLabel}<\/div><\/div>`\n    :`<div class=\"tl\"><div class=\"k\">最大MAU<\/div><div class=\"v num\">${n(s.peak)}<\/div>\n      <div class=\"s\">${s.peakM}　／　契約比 ${pct(s.peak,CAP)}%<\/div><\/div>`}\n    <div class=\"tl\"><div class=\"k\">平均活用率${info('記録された月の平均MAU ÷ 契約MAU。')}<\/div>\n      <div class=\"v num\" style=\"color:${s.idle?'var(--idle)':s.util>100?'var(--warn)':'var(--ok)'}\">${s.util}%<\/div>\n      <div class=\"s\">平均 ${n(s.avg)} MAU（${s.T.length}ヶ月）<\/div><\/div>\n  <\/div>\n\n  <div class=\"card section\">\n    <div class=\"card-h\"><h2>月次MAU推移<\/h2><span class=\"hint\">${PL[L.tier]}プラン　／　${esc(L.term)}<\/span><\/div>\n    <div class=\"card-b\">\n      <div class=\"chart\"><div class=\"chart-y\">${ys}<\/div>\n        <div class=\"chart-plot\"><div class=\"rline\" style=\"top:${H-CAP/CMAX*H}px\"><span>契約MAU ${n(CAP)}<\/span><\/div>\n        <div class=\"bars\">${bars}<\/div><\/div><\/div>\n      <div class=\"legend\"><span><i style=\"background:#93b4f5\"><\/i>${live?'過去月':'記録済の月'}<\/span>\n        ${live?'<span><i style=\"background:var(--brand)\"><\/i>当月<\/span>':''}\n        <span><i style=\"background:#d97706\"><\/i>契約MAUを超過した月<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card section\">\n    <div class=\"card-h\"><h2>月次明細<\/h2><button class=\"btn btn-sm\">CSV出力<\/button><\/div>\n    <table><thead><tr>\n      <th style=\"width:34%\">対象月<\/th><th class=\"r\" style=\"width:22%\">当月MAU<\/th>\n      <th class=\"r\" style=\"width:22%\">契約MAU<\/th><th class=\"r\" style=\"width:22%\">契約比<\/th>\n    <\/tr><\/thead><tbody>${rows}<\/tbody><\/table>\n  <\/div>\n  ${scope}`;\n}\n\n/* ---------- 契約 tab (stub) ---------- */\nfunction viewCt(){\n  const c=ORG.contract, over=c.seats>c.seatCap;\n  const live=TIERS.filter(t=>inUse(t));\n  const drafts=LICS.filter(l=>l.status==='draft').length;\n  return `<div class=\"tiles c4\">\n      <div class=\"tl\"><div class=\"k\">プラン<\/div><div class=\"v\" style=\"font-size:17px;padding-top:3px\">${ORG.plan}<\/div><div class=\"s\">契約プラン<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">従業員数 / 定員<\/div><div class=\"v num\" style=\"${over?'color:var(--danger)':''}\">${n(c.seats)}<small>/ ${n(c.seatCap)}<\/small><\/div><div class=\"s\">${over?'定員を超過':'定員内'}<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">契約期間<\/div><div class=\"v\" style=\"font-size:14px;padding-top:5px\">${c.term}<\/div><div class=\"s\">${c.days<0?'期限切れ':`更新まで ${c.days} 日`}<\/div><\/div>\n      <div class=\"tl\"><div class=\"k\">MAUライセンス<\/div>\n        <div class=\"v\" style=\"font-size:15px;padding-top:4px\">${live.length?live.map(t=>PL[t]).join(' + '):'なし'}<\/div>\n        <div class=\"s\">利用中 ${live.length}件${drafts?`　／　下書き ${drafts}件`:''}<\/div><\/div>\n    <\/div>\n    <div class=\"placeholder\">契約タブの詳細（プラン変更履歴・請求・管理者・SSO設定など）は別途設計します。<\/div>`;\n}\n\n/* ---------- org header ---------- */\nfunction renderHeader(){\n  $('oAvatar').textContent=ORG.initials;\n  $('oName').textContent=ORG.name;\n  $('oPlan').textContent=ORG.plan;\n  $('oDesc').innerHTML=ORG.desc;\n  $('oTop').textContent=ORG.children.length?'親テナント':'テナント';\n  $('oMeta').innerHTML=\n    (ORG.sso?`<span><svg viewBox=\"0 0 20 20\"><path d=\"M10 2.6l6 2.1v5c0 3.9-2.5 6.5-6 7.7-3.5-1.2-6-3.8-6-7.7v-5z\"/><path d=\"M7.6 10.2l1.7 1.7 3.3-3.4\"/><\/svg>SAML設定済・SSO必須<\/span>`:'')\n   +(ORG.lms?`<span class=\"lnk\"><svg viewBox=\"0 0 20 20\"><path d=\"M8.4 11.6a3 3 0 004.3 0l2.6-2.6a3 3 0 10-4.3-4.3l-.9.9\"/><path d=\"M11.6 8.4a3 3 0 00-4.3 0l-2.6 2.6a3 3 0 104.3 4.3l.9-.9\"/><\/svg>LMS連携済<\/span>`:'')\n   ||`<span style=\"color:var(--text-3)\">連携設定なし<\/span>`;\n  document.title=`Skill Hub — ${ORG.name}（MAUライセンス）`;\n  $('dbCap').textContent=`${ORG.name}　／　組織を切り替えるには関連会社一覧から選択`;\n}\n\n/* ---------- body-level tooltip ---------- */\nconst gtip=document.createElement('div'); gtip.id='gtip'; document.body.appendChild(gtip);\nconst TIP_W=300, GAP=10, EDGE=12;\nfunction gtipArrow(ax){\n  let s=document.getElementById('gtip-arrow');\n  if(!s){s=document.createElement('style');s.id='gtip-arrow';document.head.appendChild(s);}\n  s.textContent=`#gtip::after{left:${ax}px;}`;\n}\nfunction showTip(el){\n  const src=el.querySelector('.tip'); if(!src) return;\n  gtip.innerHTML=src.innerHTML; gtip.classList.add('on'); gtip.style.width=TIP_W+'px';\n  const r=el.getBoundingClientRect();\n  const left=Math.max(EDGE,Math.min(r.left+r.width/2-TIP_W/2,window.innerWidth-TIP_W-EDGE));\n  const h=gtip.offsetHeight, above=r.top-GAP-h>=60;\n  gtip.style.left=left+'px'; gtip.style.top=(above?r.top-GAP-h:r.bottom+GAP)+'px';\n  gtip.classList.toggle('above',above); gtip.classList.toggle('below',!above);\n  gtipArrow(Math.max(12,Math.min(r.left+r.width/2-left-4.5,TIP_W-21)));\n}\nconst hideTip=()=>gtip.classList.remove('on');\nfunction bindTips(){\n  document.querySelectorAll('.info, .wico').forEach(el=>{\n    el.addEventListener('mouseenter',()=>showTip(el));\n    el.addEventListener('mouseleave',hideTip);\n    el.addEventListener('focus',()=>showTip(el));\n    el.addEventListener('blur',hideTip);\n  });\n}\nwindow.addEventListener('scroll',hideTip,true);\nwindow.addEventListener('resize',hideTip);\n\n/* ---------- row action menu ---------- */\nfunction closeMenu(){ const m=$('rowmenu'); if(m) m.classList.remove('on'); }\nfunction openMenu(id,anchor){\n  const l=licById(id); if(!l) return;\n  const items=[];\n  if(l.status!=='archived') items.push(['edit','編集する','M13.6 3.6l2.8 2.8L7 15.8H4.2v-2.8z']);\n  if(l.status==='inuse')    items.push(['archive','アーカイブする','M3.5 5.5h13M5.5 5.5v10h9v-10M8.5 8.5v4M11.5 8.5v4']);\n  if(l.status==='draft')    items.push(['activate','利用中にする','M4 10.5l4 4 8-9']);\n  if(l.status==='draft')    items.push(['delete','削除する','M3.5 5.5h13M7 5.5V3.5h6v2M5.5 5.5v10h9v-10']);\n  if(l.status==='archived') items.push(['duplicate','複製して下書き作成','M7 7V4.5h8.5V13H13M4.5 7H13v8.5H4.5z']);\n  const m=$('rowmenu');\n  m.innerHTML=items.map(([act,label,d])=>\n    `<button data-act=\"${act}\" data-lic=\"${id}\" class=\"${act==='delete'?'danger':''}\">\n      <svg viewBox=\"0 0 20 20\"><path d=\"${d}\"/><\/svg>${label}<\/button>`).join('');\n  const r=anchor.getBoundingClientRect();\n  m.style.top=(r.bottom+6)+'px';\n  m.style.left=Math.max(12,r.right-208)+'px';\n  m.classList.add('on');\n  m.querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',e=>{\n    e.stopPropagation(); closeMenu(); rowAction(b.dataset.act,b.dataset.lic);\n  }));\n}\ndocument.addEventListener('click',closeMenu);\n\nfunction toast(msg){\n  const t=$('toast'); t.innerHTML=`<svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8\"/><path d=\"M6.5 10.3l2.3 2.3 4.7-5\"/><\/svg><span>${esc(msg)}<\/span>`;\n  t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),3200);\n}\n\nfunction rowAction(act,id){\n  const l=licById(id); if(!l) return;\n  if(act==='edit')      return openSheet('edit',l);\n  if(act==='activate')  return confirmActivate(l);\n  if(act==='archive')   return confirmArchive(l);\n  if(act==='delete')    return confirmDelete(l);\n  if(act==='duplicate'){\n    const copy={...clone(l),id:'L'+(++seq),name:l.name+'（複製）',status:'draft',\n      past:[],elapsed:0,history:[],created:'2026/08/20'};\n    LICS.push(copy); toast(`「${copy.name}」を下書きとして作成しました。`); render();\n  }\n}\n\n/* ---------- confirm dialogs ---------- */\nfunction askDlg(title,body,okLabel,danger,onOk){\n  $('cTitle').textContent=title;\n  $('cBody').innerHTML=body;\n  const ok=$('cOk'); ok.textContent=okLabel;\n  ok.className='btn '+(danger?'btn-danger-solid':'btn-primary');\n  ok.onclick=()=>{ closeConfirm(); onOk(); };\n  $('confirm').classList.add('on'); $('cscrim').classList.add('on');\n}\nfunction closeConfirm(){ $('confirm').classList.remove('on'); $('cscrim').classList.remove('on'); }\n$('cCancel').addEventListener('click',closeConfirm);\n$('cClose').addEventListener('click',closeConfirm);\n$('cscrim').addEventListener('click',closeConfirm);\n\nfunction confirmArchive(l){\n  askDlg('ライセンスをアーカイブしますか？',\n    `<p>「<b>${esc(l.name)}<\/b>」をアーカイブします。<\/p>\n     <ul class=\"clist\">\n       <li>顧客側の画面から表示されなくなり、対象コースを受講できなくなります。<\/li>\n       <li>これまでの月次MAU実績は<b>当時の契約MAU ${n(l.cap)} に対する記録として保持<\/b>されます。<\/li>\n       <li>アーカイブ後は ${PL[l.tier]} の枠が空くため、下書きを利用中に切り替えられます。<\/li>\n     <\/ul>`,\n    'アーカイブする', true, ()=>{\n      l.status='archived'; l.days=0;\n      if(selId===l.id) selId=null;\n      toast(`「${l.name}」をアーカイブしました。`); render();\n    });\n}\nfunction confirmDelete(l){\n  askDlg('下書きを削除しますか？',\n    `<p>「<b>${esc(l.name)}<\/b>」を削除します。下書きのため実績データはありません。この操作は取り消せません。<\/p>`,\n    '削除する', true, ()=>{\n      LICS=LICS.filter(x=>x.id!==l.id);\n      if(selId===l.id) selId=null;\n      toast(`「${l.name}」を削除しました。`); render();\n    });\n}\nfunction confirmActivate(l){\n  const cur=inUse(l.tier);\n  askDlg('このライセンスを利用中にしますか？',\n    `<p>「<b>${esc(l.name)}<\/b>」を ${PL[l.tier]} の利用中ライセンスにします。<\/p>\n     ${cur?`<ul class=\"clist\">\n       <li>現在利用中の「<b>${esc(cur.name)}<\/b>」は<b>自動的にアーカイブ<\/b>されます（実績は保持されます）。<\/li>\n       <li>1組織・1プランにつき利用中は1件のみのため、入れ替えとなります。<\/li>\n     <\/ul>`:`<ul class=\"clist\"><li>切り替え後、顧客側の画面に表示され、MAUの記録が開始されます。<\/li><\/ul>`}`,\n    cur?'入れ替えて利用中にする':'利用中にする', false, ()=>{\n      if(cur){ cur.status='archived'; cur.days=0; }\n      l.status='inuse';\n      toast(cur?`「${l.name}」を利用中にし、「${cur.name}」をアーカイブしました。`\n               :`「${l.name}」を利用中にしました。`);\n      render();\n    });\n}\n\n/* ---------- create / edit sheet ---------- */\nlet sheetMode='new', sheetId=null, sheetTier='basic', sheetStatus='draft';\nfunction openSheet(mode,lic){\n  sheetMode=mode; sheetId=lic?lic.id:null;\n  sheetTier=lic?lic.tier:'basic';\n  sheetStatus=lic?(lic.status==='archived'?'draft':lic.status):'draft';\n  $('shTitle').textContent = mode==='new' ? 'ライセンスを新規作成する' : 'ライセンスを編集する';\n  $('shSave').textContent  = mode==='new' ? 'ライセンスを保存する' : '変更を保存する';\n  $('i-name').value = lic?lic.name:'';\n  $('i-term').value = lic?lic.term:ORG.contract.term;\n  $('i-num').value  = lic?lic.cap:'';\n  ['f-name','f-term','f-num'].forEach(id=>$(id).classList.remove('invalid'));\n  renderSheetChoices();\n  $('sheet').classList.add('on'); $('scrim').classList.add('on');\n  setTimeout(()=>$('i-name').focus(),180);\n}\n\n/* Tier and status interact: 利用中 is only selectable when the chosen tier has no\n   other licence already in use. That is the whole one-per-tier rule, expressed\n   in the form rather than as an error after saving. */\nfunction renderSheetChoices(){\n  $('f-tier').innerHTML=TIERS.map(t=>\n    `<label class=\"pcard ${t===sheetTier?'sel-on':''}\" data-tier=\"${t}\">\n      <input type=\"radio\" name=\"stier\" value=\"${t}\"${t===sheetTier?' checked':''} />\n      <div class=\"pb\"><div class=\"pn\">${tierTag(t)} ${PL[t]}<\/div>\n        <div class=\"pd\">${t==='basic'?'標準コースのみ受講できます。':'標準コース＋上位コースを受講できます。'}<\/div>\n      <\/div><\/label>`).join('');\n\n  const blocker=LICS.find(l=>l.tier===sheetTier&&l.status==='inuse'&&l.id!==sheetId);\n  if(blocker && sheetStatus==='inuse') sheetStatus='draft';\n  $('f-status').innerHTML=['draft','inuse'].map(s=>{\n    const dis=(s==='inuse'&&!!blocker);\n    return `<label class=\"pcard ${s===sheetStatus?'sel-on':''} ${dis?'dis':''}\" data-status=\"${s}\">\n      <input type=\"radio\" name=\"sstatus\" value=\"${s}\"${s===sheetStatus?' checked':''}${dis?' disabled':''} />\n      <div class=\"pb\"><div class=\"pn\">${statusTag(s)}<\/div>\n        <div class=\"pd\">${dis\n          ? `すでに ${PL[sheetTier]} の利用中ライセンス「${esc(blocker.name)}」が存在するため、下書き保存のみ可能です。一覧から既存ライセンスをアーカイブすると切り替えられます。`\n          : s==='draft'\n            ? '顧客には表示されず、MAUの記録も行われません。稟議前の保存に使います。'\n            : '顧客側の画面に表示され、MAUの記録が開始されます。'}<\/div>\n      <\/div><\/label>`;\n  }).join('');\n\n  $('f-tier').querySelectorAll('input[name=stier]').forEach(r=>r.addEventListener('change',()=>{\n    sheetTier=r.value; renderSheetChoices();\n  }));\n  $('f-status').querySelectorAll('input[name=sstatus]').forEach(r=>r.addEventListener('change',()=>{\n    sheetStatus=r.value; renderSheetChoices();\n  }));\n\n}\n\nfunction closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }\n$('shClose').addEventListener('click',closeSheet);\n$('scrim').addEventListener('click',closeSheet);\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); closeConfirm(); closeMenu(); } });\n\n$('shSave').addEventListener('click',()=>{\n  const name=$('i-name').value.trim(), term=$('i-term').value.trim(),\n        num=parseInt($('i-num').value,10);\n  let ok=true;\n  [['f-name',!name],['f-term',!term],['f-num',!(num>0)]].forEach(([id,bad])=>{\n    $(id).classList.toggle('invalid',bad); if(bad) ok=false;\n  });\n  if(!ok) return;\n  const blocker=LICS.find(l=>l.tier===sheetTier&&l.status==='inuse'&&l.id!==sheetId);\n  const status=(sheetStatus==='inuse'&&blocker)?'draft':sheetStatus;\n\n  if(sheetMode==='edit'&&sheetId){\n    const l=licById(sheetId);\n    Object.assign(l,{name,cap:num,term,end:term.split(' - ')[1]||'',\n      tier:sheetTier,status,sync:term===ORG.contract.term});\n    toast(`「${name}」を更新しました。`);\n  }else{\n    LICS.push({id:'L'+(++seq),name,tier:sheetTier,status,cap:num,term,\n      end:term.split(' - ')[1]||'',days:status==='inuse'?Math.max(ORG.contract.days,0):0,\n      sync:term===ORG.contract.term,elapsed:0,created:'2026/08/20',past:[],\n      aclId:(ORG.acls[0]||{}).id||null,history:[]});\n    toast(status==='inuse'?`「${name}」を利用中で作成しました。`:`「${name}」を下書きで保存しました。`);\n  }\n  closeSheet(); render();\n});\n\n/* ---------- render ---------- */\nfunction renderCrumb(){\n  const org=ORG.name.replace(/[{}]/g,'');\n  const L=selId?licById(selId):null;\n  /* On a licence detail the tabs are hidden, so the crumb carries the whole path.\n     The organisation is context (not a link — it resolves to this same page);\n     the licence list is the actual way back. */\n  $('crumb').innerHTML = L\n    ? `<a href=\"skill-hub-sysadmin-related-orgs.html\">関連会社一覧<\/a><span class=\"sep\">›<\/span>\n       <span>${esc(org)}<\/span><span class=\"sep\">›<\/span>\n       <button class=\"crumblink\" id=\"cbList\">MAUライセンス一覧<\/button><span class=\"sep\">›<\/span>\n       <span class=\"cur\">${esc(L.name)}<\/span>`\n    : `<a href=\"skill-hub-sysadmin-related-orgs.html\">関連会社一覧<\/a><span class=\"sep\">›<\/span>\n       <span class=\"cur\">${esc(org)}<\/span>`;\n  const b=$('cbList'); if(b) b.addEventListener('click',()=>{ selId=null; render(); });\n}\n\nfunction render(){\n  const t=document.querySelector('#pills button.on').dataset.t;\n  /* A licence detail replaces the whole tab surface — the tabs would otherwise\n     imply the detail belongs to one of them. The breadcrumb carries the way back. */\n  $('pills').hidden = !!(selId && t==='el');\n  renderCrumb();\n  $('view').innerHTML = t==='el' ? (selId?viewDetail():viewList()) : viewCt();\n\n  const q=$('lq');\n  if(q) q.addEventListener('input',()=>{\n    query=q.value;\n    const at=q.selectionStart;\n    render();\n    const nq=$('lq'); if(nq){ nq.focus(); try{ nq.setSelectionRange(at,at); }catch(e){} }\n  });\n  ['lnew','lnew2'].forEach(id=>{ const b=$(id); if(b) b.addEventListener('click',()=>openSheet('new',null)); });\n  const ed=$('ledit'); if(ed) ed.addEventListener('click',()=>openSheet('edit',licById(selId)));\n  $('view').querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',e=>{\n    e.stopPropagation(); openMenu(b.dataset.menu,b);\n  }));\n  $('view').querySelectorAll('tr[data-open]').forEach(tr=>tr.addEventListener('click',()=>{\n    selId=tr.dataset.open; render();\n  }));\n  bindTips();\n}\n\n/* ---------- prototype state bar ---------- */\nfunction setState(s){\n  LICS=clone(PRISTINE.licenses); DEPTS=clone(PRISTINE.depts); selId=null; query='';\n  if(s==='none') LICS=[];\n  if(s==='draftonly') LICS=LICS.map(l=>({...l,status:l.status==='inuse'?'draft':l.status}));\n  if(s==='basic')    LICS=LICS.filter(l=>l.tier==='basic');\n  if(s==='advanced') LICS=LICS.filter(l=>l.tier==='advanced');\n  render();\n}\ndocument.querySelectorAll('#pstate button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#pstate button').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); setState(b.dataset.s);\n}));\ndocument.querySelectorAll('#pills button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#pills button').forEach(x=>x.classList.remove('on'));
